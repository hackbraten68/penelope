meta:
  project: Penelope
  artifact: guidelines
  version: 0.0.269
  previous_version: 0.0.268
  last_updated: '2026-05-10'
  audience:
  - LLM
  - AI code assistant
  language: en-US
  language_policy:
    keyboard_layout: de-DE
    os_and_system_language: en-US
    scripts: en-US
    guidelines: en-US
    documentation: en-US
    note: The operator's physical keyboard layout is de-DE. All produced artefacts
      (scripts, guidelines, documentation) are in English, while operator chat communication
      may use the operator's preferred natural language.
    release_bundle_rule: Operator/release bundles should not include raw review evidence
      that preserves rejected non-English project strings; keep such evidence outside
      the runnable project bundle or sanitize it in English-only form.
structure_and_scope:
  intent:
  - Separate reusable workflow rules from Penelope-specific rules; keep one canonical
    owner per topic.
  rule_layering_model:
    intent:
    - general_rules are the reusable workflow base layer.
    - penelope_specific and thread-/series-local rules are narrower derived layers
      that may extend, narrow, or explicitly override within their scope.
    scope_layers_in_precedence_order:
    - explicit operator instruction / operator-approved override
    - thread- or series-local rule
    - project-specific rule
    - general rule
    maintenance_rule:
    - On every rule creation, modification, or review, re-check that its classification
      is still correct.
    promotion_and_demotion_rule:
    - If a local or project-specific rule proves reusable across projects, consider
      promoting it to general_rules.
    - If a supposedly general rule is only valid for one project or one temporary
      series context, demote or relocate it to the narrower correct scope.
    classification_targets:
    - general
    - project-specific
    - thread-/series-local only
    explicit_override_rule:
    - If a narrower rule overrides a wider rule, the override scope and target must
      be named explicitly; do not rely on implied override by proximity.
  generality_interpretation:
    intent:
    - general_rules are workflow-general, not universal across all software projects.
    - penelope_specific carries Penelope-only paths, artefacts, and runtime semantics.
    classification_quick_test:
    - Reusable word-for-word without Penelope names/paths/artefacts -> general_rules.
    - Needs Penelope architecture, bundles, files, paths, or runtime semantics ->
      penelope_specific.
    - Governs only one active thread or series -> thread-/series-local only.
  audience_boundary:
    guidelines:
    - Guidelines define assistant behaviour for review, patching, and delivery.
    documentation:
    - Documentation is for human operators; move stabilised operator instructions
      there.
  canonical_sections:
    general_rules:
    - Reusable workflow rules for patch series, review, testing, shell safety, and
      documentation.
    - Not the normative owner for Penelope-specific paths, tokens, hostnames, artefacts,
      or runtime semantics.
    penelope_specific:
    - Penelope architecture, variables, paths, bundle/heredoc rules, and project-specific
      operational semantics.
    - May reference general_rules but must not duplicate their normative text.
    guidelines_machine_readability:
    - YAML/parseability rules for maintaining this file.
  change_policy:
  - Structural/separation adjustments proceed in small steps with a version bump and
    yaml.safe_load proof.
  - No rule-behaviour change in this section without explicit operator request.
  de_duplication_cleanup_policy:
    intent:
    - Reduce redundant rule text to one canonical owner; tolerated transition duplicates
      need an explicit cross-ref.
    canonical_owner_examples:
      patch_workflow: general_rules.collaboration_protocol
      shell_safety: general_rules.shell_safety
      penelope_architecture: penelope_specific.project_architecture
      penelope_variables: penelope_specific.project_variables
      initramfs_dropbear_unlock_contract: penelope_specific.initramfs_dropbear_unlock
  rule_placement_review_policy:
    intent:
    - Every rule needs a canonical owner; review placement, redundancy, and clarity
      before extending.
    per_rule_review_questions:
    - Is the rule at the correct level (generic principle vs. Penelope-specific instantiation)?
    - Does the rule repeat existing normative text without added value?
    - Is it clearly formulated, testable, and free of ambiguous terms?
    - Is there a canonical owner and, if applicable, a cross-ref instead of a duplicate?
    output_expectation:
    - Small structural/clarity patches with version bump.
    - No behaviour change without explicit operator request.
  wording_and_ambiguity_cleanup_policy:
    intent:
    - Wording must stay unambiguous and testable; cleanup may clarify but must not
      silently change behaviour.
    placement_rule: General term definitions and wording rules live under structure_and_scope
      or general_rules; project-specific meanings and overrides live under penelope_specific.
    per_rule_checks:
    - Is the normative mode clear (MUST/SHALL/SHOULD/MAY) and consistent with neighbouring
      rules?
    - Is it clear what a pronoun/reference refers to (this script/this file/this patch)?
    - Is it clear whether a behaviour is strict/fatal or best-effort/report-only?
    - Is it clear whether a "fallback" is a runtime fallback or a workflow behaviour
      in the patch series?
    - Is it clear which section is the canonical owner and where only a cross-ref
      should appear?
    safe_rewrite_rules:
    - 'Permitted without semantic change: clarification of terms, resolution of ambiguous
      references, unification of terminology, explicit cross-refs.'
    - 'Not permitted without explicit operator request: new obligation levels, changed
      exit-code semantics, changed strictness, new deliverables or process steps.'
    wording_change_classification:
      editorial_only:
      - Pure linguistic smoothing without changing obligation level, scope, or example
        meaning.
      - Format/structural improvement with unchanged normative content.
      clarifying_but_non_semantic:
      - Clarification of an existing term without changing obligation level/scope;
        canonical owner remains the same.
      - Explicit cross-refs/owner hints for redundancy avoidance without new obligation.
      semantic_change_requires_explicit_patch:
      - Change of MUST/SHALL/SHOULD/MAY or strict/best-effort interpretation.
      - Change of exit-code semantics, conflict resolution, or scope of a rule.
      - New normative requirement instead of pure clarification.
  migration_completion_criteria:
    canonical_owner: structure_and_scope
    definition_of_done:
    - Every normative rule group has a canonical owner (general_rules or penelope_specific).
    - Tolerated overlaps are recorded in the known_overlaps_registry or explicitly
      justified via cross-ref.
    - No conflicting obligation levels (MUST/SHALL/SHOULD/MAY) exist for the same
      scope without a documented conflict rule.
    - New rules are filed directly under the canonical section rather than parked
      as silent interim duplicates.
    review_trigger:
    - When adding new rule blocks or larger cleanup patches, re-check canonical-owner
      placement, tolerated overlaps, and duplicate-cleanup state.
    - When a tolerated duplicate is changed, check the canonical owner and registry
      entry too.
  conflict_resolution_order:
    canonical_owner: structure_and_scope
    intent: Deterministic resolution of apparent conflicts between rules at different
      scopes.
    order:
    - Explicit operator instruction or operator-approved override wins over all guideline
      text.
    - A thread-/series-local rule wins over a project-specific rule when its local
      scope is explicit.
    - A project-specific rule wins over a general rule within the project-specific
      scope.
    - Narrower scope wins over wider scope when comparing rules of the same class.
    - Explicit normative statements (MUST/SHALL/SHOULD/MAY) win over examples/illustrations.
    - If two candidate interpretations or solutions remain equally compliant after
      scope resolution, prefer the one that preserves correctness with lower complexity,
      lower redundancy, and lower operational/resource cost; reject this tie-break
      if it would oversimplify required behaviour.
    - With the same scope and same obligation level, the section marked as canonical
      owner wins.
    - 'On genuine collision without clear resolution: mark as contradiction and resolve
      via cleanup patch; do not silently interpret.'
  known_overlaps_registry:
    canonical_owner: structure_and_scope
    purpose: Registry for tolerated overlaps during structure/de-dup migration.
    rules:
    - Only register active, temporary, or consciously accepted overlaps.
    - Each entry names the canonical owner and duplicate_location or project_override/project_extensions.
    - Remove already cleaned-up cases from the registry or track them separately in
      the changelog.
    entries:
    - rule_family: upgrade_safety
      canonical_owner: general_rules.upgrade_rules
      project_override: penelope_specific.backup_upgrade_rules
      status: active_scoped_strengthening
    - rule_family: generated_artifact_consistency
      canonical_owner: general_rules.generated_script_rules
      project_extensions:
      - penelope_specific.generated_script_constraints
      status: active_scoped_strengthening
    - rule_family: net_state_keys
      canonical_owner: penelope_specific.logging_and_observability.initramfs_diagnostic_profile.net_state_required_keys
      duplicate_location: penelope_specific.initramfs_dropbear_unlock.parameters.diagnostics_contract_checklist.must_adopt_net_state_keys
      status: tolerated_cross_check
      note: Duplication is intentional as a contract checklist; cross-ref added at
        duplicate_location. To be merged in a future cleanup patch.
  term_definitions:
    canonical_owner: 'The section that is normatively leading for a rule family; parallel
      formulations are only permitted as cross-ref or temporary overlap. Writing convention:
      always as fully-qualified path (section.subsection), e.g. general_rules.collaboration_protocol
      or penelope_specific.project_macros.'
    normative_keywords:
      MUST: Mandatory requirement; no deviation without explicit operator instruction
        or a narrower-scope rule that explicitly overrides it.
      SHALL: Binding default rule for the normal case; deviations require an explicit
        reason in the patch plan or review text.
      SHOULD: Recommended default; deviation is allowed when the assistant states
        a concrete reason.
      MAY: Optional behaviour; use only when compatible with higher-priority rules.
    hard_baseline: A currently available full version that may be used as the authoritative
      base for follow-up work.
    operative_baseline: The concrete full version used as the immediate work base
      for the current patch block; normally this is the immediate predecessor, but
      only if it exists as a currently available full version. Otherwise it must first
      be re-uploaded or reconstructed and republished.
    reconstructed_working_baseline: A full version deterministically rebuilt from
      the last reliable full version plus documented patch/review content and explicit
      operator overrides; it is a usable work base after republication, but not historical
      proof of byte-identical origin.
    missing_intermediate_state: A referenced but unavailable or non-downloadable intermediate
      version that must not be silently assumed.
    patch_block: The preferred unit of change delivery; a thematically coherent and
      operationally stable patch step that is neither an atomised micro-patch nor
      an oversized bundle.
    fix_patch: A narrowly scoped repair patch for the direct predecessor, delivered
      before new thematic work when the predecessor review finds a blocking or closely
      related defect.
    handoff: A thread-transition package/prompt that captures the operative baseline,
      governing rules, current plan, and reconstruction notes so work can continue
      without silently assuming missing context.
    thread_or_series_local_rule: A rule intentionally limited to the active patch
      series/thread and not yet promoted to project-specific or general scope.
    explicit_operator_override: An explicit operator decision that temporarily or
      permanently overrides wider-scope guideline text for the named scope.
    blocker: A condition that forbids continuing directly with the requested patch
      block until it is resolved or explicitly overruled (e.g. missing hard baseline,
      unresolved rule contradiction at the governing scope, or a required governance/guidelines
      patch that the requested code change depends on).
    blast_radius: The scope of artefacts, runtime paths, operational states, and recovery
      work that can be affected when a patch_block or design choice fails.
    single_source_of_truth: A design in which one authoritative owner location defines
      the state, while any derived representations are explicitly secondary and governed
      by a stated derivation/refresh contract.
    transition_complexity: Temporary extra structure such as migration shims, compatibility
      bridges, mirrors, dual-writes, or additional branches introduced only to move
      from one contract/state to another.
    verified_claim: A statement grounded in a currently available artefact, an executed
      validation result, or another explicitly cited source available in the current
      working context.
    reconstructed_claim: A statement grounded in a deterministic reconstruction from
      a hard_baseline plus documented patch/review content; reliable enough for follow-up
      work after republication, but not proof of original byte identity.
    inferred_claim: A reasoned conclusion derived from available evidence, not a directly
      observed fact; it must be identified as inference when relevant to the operator.
    operator_decided_state: A state, contract, or trade-off that is true because the
      operator explicitly decided it, even if older artefacts still reflect an earlier
      state.
    overlap: A content overlap between two rule locations with similar content; it
      must be removed, merged, or explicitly marked in the overlap registry.
    project_specific_strengthening: A Penelope-specific tightening or concretisation
      of a general rule; it may clarify general rules but must not silently contradict
      them.
    implicit_reset: A reset of persistent state without an explicit operator mode
      or documented policy.
    runtime_data: Persistent operational data such as configuration, logs, status
      files, dashboard artefacts, secrets, and comparable state files.
    stateful_tool: A tool or setup script that reads, creates, or changes persistent
      state and therefore must explicitly consider rerun/upgrade safety.
    generated_artifact: A file produced from templates, heredocs, macros, or generator
      logic that must therefore demonstrably prove generator/runtime consistency.
    cheap_test: 'A test that does not require a full install/reboot/unlock cycle (e.g.
      bash -n, shellcheck, yaml.safe_load, log analysis); cross-ref: general_rules.preflight_for_new_script_patch_series.'
    expensive_test: 'A test that requires a full install, reboot, or unlock cycle
      (e.g. end-to-end Penelope reinstall with reboot and SSH unlock); cross-ref:
      penelope_specific.install_strictness_refactoring_path.'
    legacy_term_note: Prefer expensive_test over older mixed-language labels such
      as teurer_test.
    status_delta: A compact statement of what changed since the direct predecessor
      and what intentionally remained unchanged for the current patch_block.
    status_invariant: A property, decision, or contract intentionally carried forward
      unchanged across the current patch_block and worth restating to avoid drift
      assumptions.
    compatibility_stance: The declared compatibility policy governing the current
      patch series or patch_block (for example current-only/latest-only/no-compatibility
      mode, narrow migration seam, or release-facing compatibility line).
    legacy_census: A compact inventory of in-scope old commands, aliases, schema paths,
      config keys, migration shims, or compatibility branches in the touched area,
      each classified as removed_now, intentionally_kept_with_reason, or deferred_with_reason.
    series_guideline_scan: A compact per-series analysis that identifies the governing
      relevant rules from general_rules, project-specific rules, and active thread-/series-local
      rules, and states which nearby rule families are intentionally not in scope
      for the series.
    series_compliance_matrix: A short derived checklist from the series_guideline_scan
      that names the concrete compliance gates for the active series and the status
      model used for later prechecks.
    series_continuation_state: 'A compact handoff-carried record of the still-governing
      strategic memory for an active series: accepted decisions, rejected directions,
      deferred-but-valuable insights, current validation strategy, next expensive
      truth surfaces, and the next-thread re-entry expectations.'
    series_decision_log: A compact list of small but governing decisions from an active
      series that are easy to lose in a thread switch because they are narrower than
      major architecture headings but stronger than mere conversational texture; examples
      include manual-merge seams, newly hardened overwrite/permission contracts, accepted
      non-goals for the current series, and blocker-vs-follow-up classification calls.
    series_prerelease_target_register: A compact list of not-yet-landed items that
      are already judged necessary before the current pre-release line can be called
      release-ready; classify each item explicitly (for example must_land_before_release,
      release_candidate_gate, or deferred_post_release) so that it is not mistaken
      for an optional follow-up.
    handoff_reentry_protocol: A short ordered restart ritual for the next thread that
      tells the assistant how to regain the correct baseline, governing rules, continuation
      state, and next patch-block entry conditions without relying on implicit memory.
    predecessor_precheck: A pre-patch-block check that asks whether the direct predecessor
      introduced regressions, missing artefacts, invalid delivery, or another concrete
      blocker that should be fixed before new thematic work continues.
    guideline_compliance_precheck: A pre-patch-block check that evaluates the material
      items from the current series_compliance_matrix and marks them as pass, fail,
      open, deferred_with_reason, or not_applicable before new content-changing work
      is delivered.
    guideline_gates: The explicit delivery gates that must be filled before a content-changing
      patch_block is delivered. At minimum this includes operative_baseline, series_guideline_scan,
      series_compliance_matrix, predecessor_precheck, guideline_compliance_precheck,
      touched_phase or phase_stopline when applicable, runtime_definition_audit when generated
      code/source/trap/mktemp boundaries are touched, blast_radius, and validation_claims.
general_rules:
  release_zip_permissions:
    summary: Preserve conservative release ZIP permissions.
    rules:
    - Shell scripts in release ZIPs SHOULD be executable by owner, group, and others but not writable by group or others; target mode 0755.
    - Documentation, YAML, config templates, notes, and README files SHOULD be readable but not executable; target mode 0644.
    - Release ZIPs MUST NOT contain mode 0777 scripts, mode 0666 documentation or config files, or private-mode documentation that blocks normal operator reading.
    - Validate release ZIP permissions with zipinfo or an extraction-mode check before declaring a release candidate.
  scope_boundary:
    canonical_owner: general_rules
    includes:
    - Patch workflow, iteration, deliverables, versioning rules
    - Shell/Bash/systemd/test/review principles
    - General error handling (including handling missing files/expired uploads)
    - Project-status checkpoint artefacts for active patch series and handoff baselines
    excludes:
    - Penelope-specific variables, paths, tokens, bundle files, initramfs artefact
      names
    handoff_rule:
    - When a rule sounds both general and Penelope-specific, the generic form lives
      here.
    - The concrete Penelope instantiation lives under penelope_specific and references
      the generic rule.
    duplication_handling:
    - When existing Penelope sections repeat generic rules, general_rules is the canonical
      owner.
    - Penelope sections should then reference the general_rules section instead of
      copying normative text.
    rule_classification_review:
    - 'MUST: When creating, modifying, or reviewing a rule, explicitly check whether
      it belongs to general_rules, penelope_specific, or only to the current thread/series
      context.'
    - 'MUST: Reclassify a rule when its actual scope has changed (e.g. formerly local
      but now broadly reusable, or formerly general but now clearly project-bound).'
    - 'MUST: If a Penelope-specific rule overrides a general rule, name the overridden
      rule family or section explicitly.'
    canonical_crossrefs_to_penelope_specific:
    - project_architecture
    - project_variables
    - logging_and_observability
    - initramfs_dropbear_unlock
  script_quick_audit:
    canonical_owner: general_rules
    applicability:
    - General checklist for new or changed scripts (shell and script-adjacent heredocs).
    - Penelope-specific additional requirements are added in penelope_specific, not
      duplicated here.
    checklist:
      syntax:
      - 'MUST: Check syntax (at minimum bash -n for bash scripts; appropriate validators
        for other types).'
      shell_mode:
      - 'MUST: Set set -Eeuo pipefail deliberately or justify deviation; guard exceptions
        selectively.'
      tool_guards:
      - 'MUST: Guard external tools (command -v / require_cmd) or explicitly mark
        best-effort/fallback.'
      idempotency:
      - 'SHALL: Repeated execution must not cause harm; detect already-reached target
        states.'
      exitcodes:
      - 'MUST: Define exit-code semantics clearly (strict/fatal vs. best-effort/report-only).'
      deliverables:
      - 'MUST: Provide patch + full version; naming consistent with project conventions.'
      missing_files_and_expiry:
      - 'MUST: Do not guess when baseline files are missing/expired; use a currently
        available full version only.'
      clarity_and_scope:
      - 'MUST: Formulate rule text/script purpose clearly; separate generic vs. project-specific
        aspects.'
      placement_and_conflict_check:
      - 'MUST: For every new/changed rule, verify whether general_rules or penelope_specific
        is the canonical owner.'
      - 'MUST: On overlap, apply conflict resolution per structure_and_scope.conflict_resolution_order
        and set cross-ref.'
      - 'SHALL: Record tolerated overlaps in known_overlaps_registry if not cleaned
        up in the same patch.'
    placement_rule:
    - The generic checklist lives exclusively under general_rules.script_quick_audit.
    - Penelope-specific mappings/overrides reference this checklist.
    cross_ref:
    - 'Duplicate with identical semantics under general_rules.preflight_for_new_script_patch_series.checklist.missing_files_and_expiry
      (canonical owner: general_rules.script_quick_audit).'
    wording_clarity_and_placement:
      canonical_owner: general_rules
      goal: For new/changed script rules, explicitly co-check clarity, placement,
        and redundancy.
      checks:
      - '[ ] Is the rule general (general_rules) or project-specific (penelope_specific)?'
      - '[ ] Is there already a canonical rule with the same semantics (cross-ref
        instead of duplicate)?'
      - '[ ] Are normative terms (MUST/SHALL/SHOULD/MAY, strict/best-effort) unambiguous?'
      - '[ ] Are file name/artefact patterns formulated generically or extracted as
        a Penelope mapping?'
  debug_instrumentation_safety:
    canonical_owner: general_rules
    intent:
    - Debug/diagnostic code should improve observability, not change behaviour or
      initialisation logic.
    - Goal is to avoid Heisenbugs and "only works with debug" effects.
    rules:
    - Debug/diag code must not initialise variables that would be uninitialised in
      the non-debug path.
    - Debug/diag code must not activate fallbacks that silently repair or hide production
      paths.
    - Debug/diag code must not change order/timing if doing so could influence success/failure;
      unavoidable interventions must be treated explicitly as semantic changes.
    - Debug output should prefer read-only observation (log, dump, check) over state-modifying
      helper steps.
    review_questions:
    - Would the production path have the same variables/defaults without this debug
      code?
    - Could removing the debug code turn a success into a failure (or vice versa)
      even though no business logic was changed?
    - Does debug code only make an error visible later instead of early/fatal?
    wording_boundary:
    - '"Diagnostic", "debug", "observability", or "tracing" does not automatically
      change the severity class of a problem.'
  strictness_refactoring_policy:
    canonical_owner: general_rules
    intent:
    - Legacy strict toggles (e.g. strict_mode, STRICT_VERIFY-like switches) must not
      grow as global behavioural modes when they effectively only control check severity
      or individual verification paths.
    - Goal is a consistent structure: checks always run; severity is explicit per
        check.
    principles:
    - Clarify conceptually/documentarily first (docs/guidelines), then refactor code.
    - Before removing a toggle, always create an inventory of all uses and classify
      by effect (fatal / warn-only / best-effort / legacy/superfluous).
    - A refactoring must not establish debug/diagnostic paths as silent replacements
      for missing initialisation/fallbacks.
    - When a toggle is retained for genuine recovery exceptions, scope, default, and
      abuse protection must be explicitly documented (no general lax-mode).
    review_checklist:
    - '[ ] Is it clearly described whether the toggle changes behaviour or only severity/reporting?'
    - '[ ] Are all uses inventoried and classified?'
    - '[ ] Are there locations where a warn-only path could endanger later operation/SSH
      unlock?'
    - '[ ] Are obligation levels/exit codes per check controlled explicitly rather
      than implicitly via a global mode?'
    outputs_for_refactoring_plans:
    - Inventory list of toggle uses with classification
    - Target picture of severity classes (fatal / warn-only / best-effort)
    - Migration order (deprecation -> branch reduction -> removal)
  preflight_for_new_script_patch_series:
    canonical_owner: general_rules
    purpose:
    - General start ritual before a new script/heredoc patch series, independent of
      project.
    - Prevents working against a wrong baseline and reduces unclear deliverables/test
      expectations.
    first_response_gate:
    - Before the first code/documentation/guidelines patch of a new series, explicitly
      capture the relevant guidelines/rules for the series.
    - 'MUST: Before the first content-changing patch_block of a new series, produce
      a compact series_guideline_scan that names the relevant general_rules, project-specific
      rules, and any active thread-/series-local rules.'
    - 'MUST: Derive a compact series_compliance_matrix from that scan before the first
      content-changing patch_block is delivered.'
    - The first response of a new series SHALL name baseline files, deliverables order,
      predecessor-check discipline, and open decisions.
    - The first response of a new series SHOULD stay patch-free when baseline, scope,
      deliverables, or validation expectations are still unclear.
    - The first response of a new series MAY already deliver a patch when baseline,
      scope, deliverables, and validation expectations are already explicit and operationally
      stable.
    series_guideline_scan_contract:
    - 'MUST: The series_guideline_scan distinguish relevant rules from intentionally
      non-relevant nearby rule families when omission could otherwise create silent
      drift.'
    - 'MUST: Keep the series_guideline_scan operator-facing and compact; prefer fully
      qualified rule paths plus a one-line relevance note over long quotations.'
    - 'MUST: The derived series_compliance_matrix name the concrete compliance gates
      for the series and the status vocabulary used in later guideline_compliance_precheck
      blocks.'
    - 'SHALL: When a thread switch is likely mid-series, the scan or its derived notes
      should already identify which items must survive as series_continuation_state
      rather than being rediscovered from transcript memory.'
    - 'SHOULD: When small but governing decisions start to accumulate during a series,
      maintain a compact series_decision_log instead of relying on conversational
      rediscovery later.'
    - 'SHALL: The matrix mark each material item initially as pass, open, deferred_with_reason,
      fail, or not_applicable, and later patch blocks update that status explicitly
      when relevant.'
    series_decision_log_contract:
    - 'SHOULD: Keep a compact series_decision_log when a series accumulates small
      but governing decisions that could otherwise be lost between patch blocks or
      across a forced thread switch.'
    - 'MUST: Before a thread-transition handoff for an active series, promote any
      still-governing small decisions into either the series_continuation_state or
      the series_decision_log; do not leave them in transcript-only memory if they
      could change the next patch choice, validation method, or blocker classification.'
    - 'SHALL: The series_decision_log stay decision-oriented rather than chronological;
      capture the decision and why it still governs, not the full story of how it
      was found.'
    prerelease_target_register_contract:
    - 'SHOULD: When an active pre-release series identifies not-yet-landed items that
      are now believed necessary before the release line is ready, maintain a compact
      series_prerelease_target_register instead of leaving those items only as vague
      future intent.'
    - 'MUST: Distinguish deferred_follow_up from pre-release target status; if an
      item is believed necessary before release, do not classify it merely as optional
      deferred polish.'
    - 'MUST: Classify each prerelease target explicitly (for example must_land_before_release,
      release_candidate_gate, or deferred_post_release) and restate why it still matters.'
    - 'MUST: For each prerelease target, state the current status and a compact done_enough
      criterion for the current release line; do not carry only a title plus vague
      intent.'
    - 'SHALL: Treat must_land_before_release items as active release-scope obligations,
      not as merely interesting future work; do not silently let later patch blocks
      bypass them without an explicit reprioritization note.'
    - 'SHALL: Treat release_candidate_gate items as gates that may require tests,
      integrated verification, or operator sign-off rather than code patches; they
      still must be passed before the line is called release-ready.'
    - 'SHALL: When a currently non-governing idea is later reclassified as required-before-release,
      promote it into the series_prerelease_target_register and carry that reclassification
      forward in later handoffs.'
    prompting_aid:
    - Operators SHOULD prompt the assistant to extract the relevant rules from the
      guidelines before starting code changes.
    - If the series scope is still unclear, the assistant SHOULD keep the first response
      patch-free and use it to lock baseline, scope, and workflow expectations.
    checklist:
      basis_and_scope:
      - '[ ] Baseline file/version is explicitly named and currently available (otherwise
        resolve explicitly via re-upload or operator-approved deterministic reconstruction).'
      - '[ ] Goal of the patch_block is clearly delimited and operationally stable
        (neither atomised nor oversized).'
      - '[ ] Non-goals are named so that no implicit semantic shift occurs.'
      deliverables_and_naming:
      - '[ ] Planned artefacts are named (patch, full version, optionally standalone/test
        samples).'
      - '[ ] File name/version scheme is clarified upfront and consistent.'
      validation:
      - '[ ] Parser/syntax checks for the affected file type are planned.'
      - '[ ] For config/data formats, parseability is explicitly anticipated (e.g.
        yaml.safe_load).'
      governance_and_compliance:
      - '[ ] A compact series_guideline_scan exists or is explicitly planned before
        the first content-changing patch_block.'
      - '[ ] A series_compliance_matrix exists or is explicitly planned from that
        scan.'
      - '[ ] Likely high-risk compliance topics for the series are named (for example
        artefact language, runtime/workdir contract, generated-artifact validation
        depth, external-config handling, or doc/code/operator-surface sync) when relevant.'
      - '[ ] If the series already has known not-yet-landed release-critical items,
        a compact series_prerelease_target_register exists or is explicitly planned.'
      testing:
      - '[ ] Short test plan is named (cheap checks are mandatory; expensive tests
        are added when patch risk, semantics, or operator requirements make them necessary).'
      missing_files_and_expiry:
      - '[ ] Do not guess when baseline files are missing/expired; use a currently
        available full version only.'
      - '[ ] Missing files/artefacts that the operator could realistically provide
        are explicitly requested or called out.'
      - '[ ] If a missing intermediate state is required, explicitly choose between
        re-upload/request and deterministic reconstruction; do not stall or silently
        assume.'
      - '[ ] No work against older baselines without explicit operator instruction.'
    relationship_to_other_rules:
    - Uses general_rules.script_quick_audit for script content quality.
    - Penelope-specific deliverables/workflow details belong in penelope_specific.
  project_status_artifact:
    canonical_owner: general_rules.project_status_artifact
    intent:
    - Provide a compact, versioned, project-local status artefact for active multi-patch
      series.
    - Preserve current baselines, still-governing decisions, open release/merge tasks,
      and RC readiness without relying on transcript memory.
    - Act as the latest durable project milestone that a handoff can reference as
      its baseline.
    scope_boundary:
    - The project status file is a workflow artefact, not operator documentation,
      source code, tests, or a substitute for guidelines.
    - Durable project knowledge must ultimately live in the appropriate durable artefact
      such as code, tests, README, runbook, pipeline/config, guidelines, or PR notes.
    - The project status file may temporarily point to those artefacts while work
      is active, but it must not become the only place where durable knowledge lives.
    applies_when:
    - 'SHOULD: Use a project status artefact when an active patch series spans multiple
      patch blocks and accumulates governing decisions, local overrides, deferred
      items, or RC/release readiness state.'
    - 'SHOULD: Use it when thread handoff is likely or when the project has enough
      artefacts that transcript-only reconstruction would be fragile.'
    - 'MAY: Skip it for small one-shot patches where the README/PR text and patch
      deliverables already capture the complete state.'
    filename_and_version_policy:
    - 'SHALL: During patch series, use a versioned filename such as project_status-0.0.N.md
      or <project>_project_status-0.0.N.md unless the operator chooses a project-specific
      stem.'
    - 'MUST: The file must carry the same version internally, for example <!-- version:
      0.0.N --> for Markdown or an equivalent native metadata field.'
    - 'MUST: Every content change to the project status artefact increments its version
      according to the same artefact versioning rules as other patch-series files.'
    - 'MAY: Before final repository merge, the operator may remove version suffixes
      from filenames and update references accordingly; during the patch series,
      the versioned filename remains useful and explicit.'
    update_policy:
    - 'SHOULD: Update after material synchronization points rather than after every
      patch by default.'
    - 'MUST: Update when a new governing decision, baseline change, RC decision, deferred
      blocker, or release-critical open item would otherwise exist only in chat memory.'
    - 'SHOULD: Update after a coherent verified patch series, large review, series
      plan, RC preparation step, or planned handoff.'
    - 'MAY: Skip updates for purely mechanical patches that do not change governing
      state, baseline state, open items, or release/RC readiness.'
    - 'SHALL: Each update should replace or compact obsolete information instead
      of appending chronology.'
    content_contract:
    - Current artefact baselines and latest verified versions.
    - Latest verified test/check commands and results that matter for continuation
      or RC readiness.
    - Still-governing project-local decisions, operator-approved overrides, and non-goals.
    - Open items with status, owner/decision role, next action, and review trigger.
    - Deferred follow-ups only when they still affect future patch choices or release
      readiness.
    - Accepted caveats and explicit staleness status.
    - A compact recently-closed section only when it helps the next milestone; remove
      or compress it at the next update.
    growth_control:
      principle: The project status file is a current-state snapshot, not a chronological
        log.
      recommended_size: 1-3 pages where practical.
      hard_review_trigger: If it grows beyond roughly 5 pages, compact it before
        adding more content.
      rules:
      - Replace obsolete status instead of appending new history.
      - Remove resolved TODOs or compress them under recently-closed, then remove
        that section at the next material update when it no longer matters.
      - Keep only decisions that still affect future work.
      - Keep patch history at milestone granularity, not patch-by-patch granularity.
      - Do not copy README/runbook content into the status file; link or reference
        the durable artefact instead.
    open_item_discipline:
      required_fields:
      - id
      - status
      - owner_or_decision_role
      - next_action
      - review_trigger
      allowed_statuses:
      - open
      - blocked
      - deferred
      - decided
      - closed
      rules:
      - 'MUST: Every open, deferred, or blocked item must have a concrete next_action.'
      - 'MUST: Every deferred item must have a review_trigger such as before_RC,
        before_PR, before_final_filename_cleanup, after_next_green_suite, or when_touching_pipeline_yaml.'
      - 'SHALL: Closed items should be removed or compressed at the next status-file
        update.'
      - 'MUST: Items without a next_action are not allowed; decide, defer with trigger,
        block with reason, or close them.'
    handoff_relation:
    - 'SHALL: Treat the latest current project status file as a durable project milestone
      that a handoff can reference as its baseline.'
    - 'SHOULD: A handoff should name the latest project status version and summarize
      only the delta since that milestone, unless the status file is stale, unavailable,
      or known incomplete.'
    - 'SHOULD: Before a planned handoff, update the project status file first when
      substantial decisions, patch-series progress, or open release items accumulated
      since the last status milestone.'
    - 'MAY: For unexpected thread switches, the handoff may treat the latest status
      file as the baseline and focus on unreconciled changes after it.'
    - 'MUST: If the latest project status file is stale, the handoff must say so and
      identify what changed since it.'
    final_state_rule:
    - 'MUST: Before RC, PR handoff, or final merge readiness, durable decisions in
      the project status file must be reflected in the appropriate durable artefact
      or explicitly marked as temporary PR/handoff-only state.'
    - 'SHOULD: At RC time, compact the project status file into a release snapshot
      containing current artefact versions, last verified checks, open merge/release
      tasks, accepted caveats, and staleness status.'
    - 'SHALL: After merge or supersession, either archive the status file, remove
      it from the active artefact set, or compact it to a minimal merged/superseded
      marker according to project policy.'
    anti_patterns:
    - A chronological chat transcript or patch-by-patch diary.
    - A second README or runbook.
    - The only location for decisions that must govern future code, tests, operator
      documentation, or release policy.
    - A growing checked-off TODO graveyard.
    cross_references:
    - general_rules.preflight_for_new_script_patch_series.series_decision_log_contract
    - general_rules.preflight_for_new_script_patch_series.prerelease_target_register_contract
    - general_rules.collaboration_protocol.thread_hygiene_and_handoff
    - general_rules.collaboration_protocol.version_bump_rule
  operational_automation_quality:
    canonical_owner: general_rules.operational_automation_quality
    intent:
    - General quality rules for operational automation, validators, migration tools,
      recovery scripts, rotation jobs, and other state-changing or state-verifying
      workflows.
    - Keep semantic truth shared across runtime paths, diagnostics, tests, and operator
      documentation.
    shared_validation_truth:
      intent:
      - Avoid parallel implementations of the same consistency question.
      - Make standalone validators and production flows agree on the same facts when
        they inspect the same unchanged state.
      rules:
      - 'SHOULD: When a production flow and a standalone validation or diagnostic
        tool answer the same consistency question, prefer one shared fact-collecting
        helper or equivalent single source of validation truth.'
      - 'SHOULD: The shared validation helper should return structured facts and
        reasons rather than only a boolean.'
      - 'SHOULD: Callers should translate the shared facts into context-specific policy
        decisions such as fail-closed, fail-open, retry, warning-only, rollback, or
        operator escalation.'
      - 'MUST: Do not duplicate materially identical validation logic across runtime
        code, CLI validators, tests, and documentation when a shared helper is practical.'
      - 'MUST: If a validator is only a point-in-time check and does not lock or reserve
        state, document that boundary in operator-facing documentation.'
      review_questions:
      - Which code paths answer the same consistency question?
      - Is there one fact source, or are runtime and validator logic drifting apart?
      - Does policy live at the caller level rather than inside generic fact collection?
      - Are the validator's limitations documented for operators?
    scenario_test_oracles:
      intent:
      - Ensure scenario tests prove the operator-visible outcome, not only that a
        particular internal exception or branch was reached.
      rules:
      - 'SHOULD: Scenario tests for operational automation should assert result
        classification, reason code or status code, persisted state, external side
        effects, and recovery posture where relevant.'
      - 'SHOULD: Tests for fail-closed systems should prove that ambiguous or unknown
        states do not accidentally proceed as success.'
      - 'SHOULD: When operator summaries, logs, or status reports are part of the
        recovery contract, tests should assert the most important operator-facing
        fields.'
      - 'MAY: Pure exception assertions are acceptable for narrow helper tests, but
        scenario tests should additionally check the externally meaningful state.'
      examples_of_operator_visible_outcomes:
      - success versus red/failure classification
      - retry exhausted versus nonretryable failure
      - paused versus unpaused or equivalent safety posture
      - persisted state and history artefact changes
      - validation status and human-readable reasons
    test_double_realism:
      intent:
      - Keep test doubles faithful to the protocol surfaces that production code
        actually consumes.
      rules:
      - 'MUST: When runtime code classifies external tool behaviour from argv, exit
        code, stdout, stderr, returned JSON, or remote-store state, tests should
        model those surfaces explicitly instead of replacing them with bare booleans.'
      - 'SHOULD: Test doubles should model call order and state changes when the
        production path depends on them.'
      - 'SHOULD: Include drift tests for unknown or changed output when the production
        system is expected to fail closed on unrecognised tool behaviour.'
      - 'MAY: Higher-level mocks are acceptable for isolated unit tests when protocol
        parsing or external-surface classification is not under test.'
      review_questions:
      - Does the fake expose the same success/failure signals as the real integration
        path?
      - Are stdout, stderr, return codes, JSON fields, or remote-store mutations relevant
        to the code under test?
      - Would a changed real tool message be caught by at least one fail-closed or
        unknown-output scenario?
    cross_references:
    - general_rules.scenario_review_rules
    - general_rules.doc_code_consistency
    - general_rules.testing
  review_and_test_guidance:
    canonical_owner: general_rules.review_and_test_guidance
    intent:
    - General review guidance for using test results, coverage, and risk-based gaps
      during patch series.
    coverage_review_policy:
      intent:
      - Use coverage reports to identify semantic risk gaps, not merely to chase a
        numeric percentage.
      rules:
      - 'SHOULD: Treat coverage as a review instrument that points to untested behaviour,
        not as a standalone proof of correctness.'
      - 'SHOULD: Prioritise uncovered operator-critical, fail-closed, rollback, recovery,
        ambiguity-handling, validation, and state-transition paths over low-risk
        formatting or defensive branches.'
      - 'MUST: When citing coverage in a review, name the highest-value missing cases
        and classify them as blockers, follow-ups, or accepted gaps.'
      - 'MAY: Use numeric coverage targets when a project requires them, but do not
        let the number replace scenario and risk review.'
      outputs_when_used:
      - coverage command and result
      - most relevant uncovered functions or paths
      - prioritised test candidates
      - accepted gaps with reason and review trigger if deferred
    cross_references:
    - general_rules.scenario_review_rules
    - general_rules.collaboration_protocol.testing_and_validation_gates
  patch_series_lifecycle:
    canonical_owner: general_rules.patch_series_lifecycle
    intent:
    - Final coherence checks for multi-file patch series before RC, PR handoff, bundle
      publication, or final sign-off.
    rc_artifact_family_check:
      intent:
      - Verify a multi-file patch series as one coherent artefact family before calling
        it RC-ready.
      required_checks:
      - 'MUST: Compile, parse, or syntax-check all changed executable and configuration
        artefacts with the cheapest reliable tool available.'
      - 'MUST: Run the full relevant test suite or explicitly state why it is not run,
        and record the exact command and result.'
      - 'MUST: Check that documentation, examples, CLI commands, tests, wrappers,
        configuration files, and delivered bundles reference the current artefact
        names and versions.'
      - 'MUST: For any renamed identifier, search the current artefact family for the
        old identifier and verify that no stale references remain, unless a legacy
        reference is deliberately documented.'
      - 'SHOULD: Check for unresolved placeholders, TODO/FIXME markers, broken fenced
        code blocks, unbalanced inline markup, and trailing whitespace where applicable.'
      - 'MUST: Verify that the delivered bundle or handoff set contains the intended
        current artefacts and not stale intermediate versions.'
      renamed_identifier_examples:
      - script filenames
      - module paths
      - CLI commands
      - resource names
      - job names
      - config keys
      - feature flags
      - test filenames
      - documentation examples
      notes:
      - The concrete identifiers are project-specific; the general rule is to search
        for stale references after any rename.
      - Documentation and wrapper scripts are common places for stale names to remain.
      - Project status files may record the latest RC check command and result, but
        they do not replace the check itself.
    cross_references:
    - general_rules.project_status_artifact
    - general_rules.doc_code_consistency
    - general_rules.documentation_markdown.quality_gates
    - general_rules.collaboration_protocol.deliverables_order
  collaboration_protocol:
    base_version_rule:
    - Unless explicitly requested otherwise, the basis for a new version is ALWAYS
      the currently operative full version for the active patch block (normally the
      immediate predecessor when that full version is currently available).
    - 'MUST: The operative_baseline for a patch block is the immediate predecessor
      only if that predecessor exists as a currently available full version; otherwise
      the assistant must first obtain it via re-upload or reconstruct and republish
      it as a reconstructed_working_baseline.'
    - 'MUST: Every patch is a unified diff exactly from <old> to <new> (immediate
      predecessor). No patches against "older baselines" without explicit operator
      instruction.'
    - 'MUST: Do not produce duplicate versions or parallel variants of the same version
      number.'
    - 'MUST: Version numbers are monotonically increasing; each new file version is
      exactly the next patch state.'
    base_version_cross_ref: The rule "no work against older baselines" also appears
      under general_rules.preflight_for_new_script_patch_series.checklist.missing_files_and_expiry
      and general_rules.iterative_patch_series.rules; canonical owner is general_rules.collaboration_protocol.base_version_rule.
    version_bump_rule:
    - When a file with version a.b.x is changed, the new version MUST be a.b.(x+1).
    - 'Default patch-series convention: only the third numeric segment is incremented
      unless the operator explicitly requests a different scheme.'
    - 'If the source filename is unversioned, the first patched full version MUST rename
      it to <basename>-0.0.1.<ext> (example: somefile.some-ending -> somefile-0.0.1.some-ending).'
    - 'If the source filename already carries a version a.b.x, the patched full version
      filename MUST be renamed to a.b.(x+1) and the internal artefact version MUST
      match exactly.'
    - 'If the source filename uses a non-standard/non-numeric scheme (example: somefile-v02a.some-ending),
      preserve that source stem and append the assistant-managed numeric patch suffix
      before the extension (example: somefile-v02a-0.0.1.some-ending).'
    - No suffixes like '-fixed'. Every fix is a new numeric version (e.g. 0.9.39 ->
      0.9.40).
    - 'MUST: Each artefact has exactly one authoritative concrete version declaration
      inside the file. Use either a dedicated VERSION/read-only variable, metadata field,
      or a top-of-file version comment when the format has no native field; not more than one.'
    - 'MUST: The full-version filename and that one internal version-bearing declaration,
      if present, match exactly for every delivered patched artefact.'
    - 'MUST: When the source artefact already contains an internal version declaration,
      update it in the same patch as the filename bump; do not leave filename and
      internal version temporarily inconsistent.'
    - 'MUST: Do not add a second concrete version declaration elsewhere in the same artefact
      just for convenience, traceability, or commentary.'
    - 'MUST: Auxiliary notes such as previous-version tracking or migration breadcrumbs
      stay version-neutral inside the artefact body unless the file format/runtime makes
      that impossible and the reason is explicitly documented.'
    - If a runtime/file format requires additional materialised version strings, they
      are derived copies and MUST be generated or validated from that one authoritative
      declaration, not maintained independently.
    git_workflow:
    - Applies only when the assistant works directly in a local Git repository rather
      than only through downloadable artefacts.
    - Every change produces a new incremented version (e.g. 0.9.80 -> 0.9.81).
    - When the repository keeps superseded versioned artefacts in-tree, move them
      to the repository archival path (for example old/) before committing.
    - A single commit MAY contain multiple changed files.
    - The commit message must clearly describe all included changes.
    - Use Conventional Commit format when the repository/operator expects it.
    deliverables_order:
    - Applies to content-changing steps; review-only steps follow review_only_step_semantics.
    - First, machine-readable change plan (YAML/JSON).
    - 'Then the patch file (unified diff). Naming scheme: <artifact>-<old>-to-<new>.patch.'
    - Then the new full version of the changed main file(s) (full download).
    - Then a short diff summary (text), without removing diagnostic code.
    - 'MUST: Reference patch and full version(s) as download links.'
    - 'MUST: Before calling a content-changing step delivered, verify that every referenced
      patch/full artefact actually exists in the current workspace, that the filename
      matches, and that the response links target those existing artefacts.'
    - 'MUST: If any expected artefact is missing, invalid, or misnamed, mark the step
      incomplete instead of implying delivery.'
    - 'MUST (guidelines patches): In every response to guidelines changes, explicitly
      confirm that yaml.safe_load succeeded; otherwise do not deliver.'
    - 'Cross-ref: Canonical yaml.safe_load requirement lives under guidelines_machine_readability.guidelines_patch_self_check.'
    versioned_patch_bundle_delivery:
      canonical_owner: general_rules.collaboration_protocol
      intent: Make patch delivery reconstructable across threads while keeping the
        immediate predecessor relationship auditable.
      rules:
      - 'SHOULD: When downloadable files are delivered for a patch block, provide
        them as one plainly versioned bundle ZIP rather than as scattered loose
        files.'
      - 'MUST: The bundle ZIP filename uses a monotonically increasing numeric
        version and no informal suffixes such as checked, final, fixed, latest,
        or new.'
      - 'MUST: The bundle ZIP is the authoritative delivery artifact for the patch
        block when present.'
      - 'MUST: Fullfiles inside the bundle remain versioned according to the normal
        artefact-versioning rules.'
      - 'MUST: The bundle contains unified diffs against the immediate predecessor
        for each changed versioned fullfile.'
      - 'MUST: The bundle contains a manifest and a SHA256 checksum file for the
        delivered bundle contents.'
      - 'MUST: The bundle must not rely on files that are available only in chat
        history; a new thread should be able to continue from the latest uploaded
        bundle plus its handoff.'
      - 'MUST: Unversioned convenience files may be included only when they are part
        of the documented operator workflow, their provenance is explicit, and
        they are reproducibly derived from versioned fullfiles or declared generated
        outputs.'
      - 'MUST: The manifest states the relationship between each unversioned convenience
        file and its authoritative source. If that relationship cannot be stated
        precisely, the unversioned file must not be included.'
      example_bundle_name: project-rc01-patchblock59-0.0.59.zip
      recommended_bundle_contents:
      - versioned fullfiles on the bundle root
      - diffs/ directory with unified diffs against the immediate predecessor
      - manifest listing included files and their versions
      - SHA256SUMS.txt
      - updated project status file when the series uses one
      - updated handoff file when the series uses one
      - updated transition prompt when applicable
    external_review_tooling_artifacts:
      canonical_owner: general_rules.collaboration_protocol
      intent: Allow reproducible static analysis in review environments that do not
        already provide the required tools.
      rules:
      - 'MAY: The operator may provide a small external tooling artifact, such as a
        Debian package or tarball containing a static-analysis tool, when the review
        environment does not provide that tool.'
      - 'MUST: Tooling artifacts are review inputs, not runtime bundle contents, unless
        the operator explicitly changes the release scope.'
      - 'MUST: Tooling artifacts are named plainly, include the tool/upstream version
        when useful, and include a SHA256 checksum file.'
      - 'SHOULD: Handoffs for shell-script patch series state whether ShellCheck was
        run, which ShellCheck version was used, and whether a reusable ShellCheck
        artifact is available or how to recreate it.'
      - 'SHALL: Review environments using a supplied ShellCheck artifact should extract
        the package once, verify the checksum once, and call the extracted binary
        directly from a temporary tool root instead of repeatedly attempting package
        installation.'
      - 'SHALL: Run ShellCheck with an explicit finite file list. If the command times
        out or the output is too large, split by script family and record exactly
        which groups were checked.'
      - 'SHALL: Reuse the same extracted ShellCheck binary throughout one patchblock
        review. Do not repeatedly rediscover the tool path or re-extract the artifact
        after it has already been verified.'
      - 'MUST: Validation summaries distinguish clean runs, listed findings, and checks
        not run because the artifact/tool was unavailable.'
      shellcheck_artifact_example:
      - mkdir -p ~/Desktop/shellcheck-artifact
      - cd ~/Desktop/shellcheck-artifact
      - apt download shellcheck
      - sha256sum shellcheck_*.deb > SHA256SUMS.txt
      - tar -czf shellcheck-<version>-artifact.tar.gz shellcheck_*.deb SHA256SUMS.txt
      review_container_usage_example:
      - tar -xzf shellcheck-<version>-artifact.tar.gz
      - sha256sum -c SHA256SUMS.txt
      - mkdir -p /tmp/shellcheck-root
      - dpkg-deb -x shellcheck_*.deb /tmp/shellcheck-root
      - /tmp/shellcheck-root/usr/bin/shellcheck --version
    review_checklist_per_patch:
      purpose: Short checklist for reviews per intermediate patch to detect typical
        regression issues early.
      checklist:
      - '[ ] Versioning: exactly +1 patch number, no suffixes, old/ move correct.'
      - '[ ] Deliverables: patch + full download of new version, links present.'
      - '[ ] Prechecks: predecessor_precheck and guideline_compliance_precheck were
        both stated for this block, or N/A was explicitly explained for a review-only
        step.'
      - '[ ] Delivery gate: all material guideline_gates are filled; no relevant gate
        remains open or fail unless the operator explicitly approves a named deferred_with_reason
        exception before delivery.'
      - '[ ] Cleanup-only blocks: cleanup_patch_guardrails were either run or explicitly
        marked not_applicable.'
      notes:
      - If a point is not applicable, explicitly mark as N/A in the diff summary.
      - 'For guidelines patches additionally: confirm yaml.safe_load succeeded.'
      - 'Cross-ref: Penelope-specific checklist items live under penelope_specific.review_checklist_per_patch.'
    review_only_step_semantics:
    - Audit/review/planning-only steps MAY deliver plan/report artefacts without a
      patch or new full version when no file content changed in that step.
    - 'MUST: Such a step explicitly say that no content change was delivered and therefore
      no diff/new full version exists for that step.'
    - 'MUST: If a review-only step finds concrete issues, the next substantive step
      either delivers a fix patch or explicitly explains why no code/doc/guideline
      change is required.'
    review_finding_classification:
    - 'MUST: In predecessor reviews, review-only steps, and audit reports, classify
      each substantive finding explicitly as one of: hard_bug_or_contradiction, real_consolidation_need,
      or style_or_compression_idea.'
    - 'MUST: Treat hard_bug_or_contradiction and real_consolidation_need as patch-relevant
      findings; style_or_compression_idea alone does not justify an immediate patch
      unless the operator explicitly prioritises it.'
    - 'SHALL: When no finding rises above style_or_compression_idea, state explicitly
      that no immediate code/doc/guideline patch is required.'
    - 'SHALL: Keep the classification brief and operator-facing so later handoffs
      can distinguish bug-fix pressure from optional cleanup ideas.'
    large_change_protocol:
    - 'MUST: For larger/more complex changes, first deliver a change/diff plan (machine-readable,
      YAML/JSON).'
    - 'MUST: Split the plan into suitable patch blocks only when needed to avoid oversized
      patches, unstable retries, or unreviewable scope.'
    - 'MUST: Each delivered patch state increments the last version number (a.b.x
      -> a.b.(x+1)).'
    - 'MUST: Do not force atomised one-step-per-response sequencing when a slightly
      larger coherent patch block is more stable and reviewable.'
    - 'SHALL: When a multi-step plan is chosen, state the next logical step, but do
      not create extra steps merely to keep the sequence mechanically uniform.'
    - 'SHALL: Where possible, plan patch blocks so that a reboot/end-to-end test is
      only needed at the final step.'
    - 'Example: Plan with steps 1/2/3 -> user requests step 1 -> assistant delivers
      patch + new version and names the next logical block if one remains.'
    patch_block_sizing:
    - 'MUST: Size patch blocks so they remain operationally stable: not so small that
      they mainly create artefact/download churn, and not so large that they become
      timeout- or retry-prone.'
    - 'SHALL: Prefer one clearly delimited contract/architecture/topic kernel per
      patch block.'
    - 'Before drafting a change plan, explicitly sanity-check block size against:
      thematic cohesion, expected artefact count, and execution stability in one response.'
    artefact_economy:
    - 'SHALL: Minimise artefact count without sacrificing reviewability or reconstructability.'
    - Do not split work into extra patch steps when the split adds mainly download
      churn or expiry risk rather than review value.
    prompt_and_patch_economy:
      canonical_owner: general_rules.collaboration_protocol.prompt_and_patch_economy
      intent: Treat operator prompts, review attention, and artefact churn as real
        workflow costs alongside code size and runtime risk. Prefer a meaningful
        batch_or_package_size rather than atomistic micro-patches or overgrown mixed
        bundles.
      rules:
      - 'For cleanup-only work, prefer one coherent review-only shortlist plus one
        safe patch_block per touched_phase over long one-helper-per-patch micro-series.'
      - 'Default to a meaningful batch_or_package_size: large enough that one patch_block
        closes a coherent kernel and reduces total prompt/review churn, but small
        enough that blast_radius, validation, and rollback remain easy to understand.'
      - 'Do not spend multiple content-changing patch blocks on style_or_compression_idea
        findings alone when the expected benefit is trivial relative to the added
        prompt, artefact, and review churn, unless the operator explicitly requests
        exhaustive cleanup anyway.'
      - 'If several cleanup findings share one touched_phase, one cheap path_precheck,
        and one review narrative, batch them into a single patch_block when this stays
        reviewable and lowers overall operator overhead.'
      - 'If cleanup findings span different risk classes, different phase_stoplines,
        or different execution paths, keep them separate even when batching would
        save prompts.'
      - 'When the operator explicitly prioritises cleanup, still apply prompt economy
        by preferring a compact backlog plus the next best kernel over rediscovering
        and patching tiny style-only items one by one.'
    cleanup_patch_guardrails:
      canonical_owner: general_rules.collaboration_protocol.cleanup_patch_guardrails
      intent: Prevent helper proliferation, low-value cleanup churn, and cleanup-induced
        regressions in active patch series.
      helper_addition_rules:
      - 'Before adding a helper, wrapper, or tiny abstraction during cleanup/refactoring,
        state whether it exists for multi-call reuse, boundary normalization, contract
        isolation, or testability; otherwise prefer delete, inline, or unify.'
      - 'Single-use helpers that only rename arguments, forward one call, or build
        a tiny literal without an independent contract are presumed unjustified unless
        the operator explicitly prefers that structure.'
      - 'If a helper is introduced mainly for readability, say which concrete reader
        burden it removes; abstracting away a single obvious call sequence is not
        enough by itself.'
      helper_survival_test:
      - 'A helper, wrapper, or mini-abstraction should normally survive review only
        if at least one of the following is true: it has more than one real callsite,
        it protects a contract or error boundary, it isolates provider/language-specific
        variation, or it makes a touched phase materially easier for a reviewer to
        read without adding a new mental jump.'
      - 'If a helper remains with exactly one callsite after the patch, treat it as
        a delete_or_inline candidate in the same patch_block or capture it explicitly
        in the cleanup backlog with a reason to keep it.'
      naming_precision_gate:
      - 'Generic orchestration names such as run/process/workflow/pipeline/helper/print
        or short technical shorthands such as ctx are presumed weak unless the rest
        of the name makes the concrete responsibility obvious.'
      - 'For cleanup-only naming work, prefer names that tell a reviewer what object
        is handled, what action happens, and what important side effect or boundary
        is involved.'
      cleanup_only_prechecks:
      - 'Before delivering a cleanup-only or helper-removal patch, explicitly run and
        state: resttreffer_or_callsite_check, undefined_reference_or_self_call_scan
        appropriate to the language, internal_version_consistency_check when the artefact
        carries a version literal, and a similar_path_review for sibling callers or
        parallel phases that may still depend on the same pattern.'
      - 'In dynamic languages, compile or parse success is not enough after delete_or_inline
        work; explicitly scan for stale method/function callsites that may survive
        syntax checks but still fail at runtime.'
      - 'If one of those cleanup-only prechecks is not applicable, mark it explicitly
        as not_applicable instead of silently omitting it.'
      cleanup_block_sizing_rules:
      - 'Reorder-only/grouping patches and delete_or_inline patches should normally
        be separate patch blocks; combine them only when the touched_phase and review
        stopline are genuinely the same and the combined diff is easier to review
        than two separate steps.'
      - 'Choose a meaningful batch_or_package_size instead of the smallest possible
        diff. A cleanup batch is well-sized when one precheck set, one review narrative,
        and one rollback story cover the whole block without hand-waving.'
      - 'After removing or moving a helper, review not only the edited callsite but
        also sibling paths that previously used or mirrored the same helper pattern.'
      - 'If a cleanup-only review finds only style_or_compression_idea items with weak
        net benefit, prefer a review-only result or backlog note over an immediate
        content-changing patch.'
      - 'If the operator explicitly wants ongoing cleanup, keep searching only while
        the next block still shows a credible net benefit across code size, helper
        count, function count, or reviewer readability; do not continue by default
        once the series is only redistributing code.'
      cleanup_equilibrium_rules:
      - 'For cleanup-only work, judge net benefit across at least these dimensions
        when practical: total line count, function count, helper-class count, and
        touched-phase reviewer readability.'
      - 'A cleanup-only patch is normally justified only if at least one of those
        dimensions improves and the others do not regress without an explicit rationale.'
      - 'Growth in total line count, function count, or helper-class count is presumed
        unjustified for cleanup-only work unless the patch first fixes a direct predecessor
        blocker or makes reviewer readability materially better in the touched phase.'
      - 'If two consecutive cleanup-only blocks show only weak net benefit, require
        an explicit review-only stop_or_continue decision before another content-changing
        cleanup patch.'
    refactoring_delta_reporting:
    - 'MUST: For consolidation/refactoring patches, briefly state whether the result
      is net_shorter, net_clearer_similar_size, or functionally_necessary_despite_growth.'
    - 'SHALL: Where practical, report before/after line counts and byte counts for
      each changed main artefact.'
    - 'SHALL: For cleanup-only work, also report before/after function counts and
      helper-class counts for each changed main artefact when practical and not misleading.'
    - 'SHALL: For cleanup-only work, classify touched-phase reviewer readability as
      better, same, or worse; if this is not obvious from the diff, give a one-line
      reason.'
    - 'MUST: If such size metrics are omitted because they would be misleading or
      disproportionately noisy, say so explicitly instead of implying that they were
      unchanged or unmeasured.'
    - 'SHALL: Keep this reporting compact; it is evidence for the simplification claim,
      not a licence to add ceremonial prose.'
    conflict_triage_and_design_priority:
    - 'SHALL: Prefer avoiding competing goals by clarifying scope, narrowing the patch_block,
      or asking the operator when a targeted clarification is realistically available
      and would materially improve the result.'
    - 'MUST: If competing good goals cannot be avoided, name the conflict explicitly
      and state the chosen priority or tie-break rule in the plan/output.'
    - 'MUST: Correctness and explicit operator requirements outrank convenience, cosmetic
      elegance, and premature optimisation.'
    - 'SHALL: When multiple solutions can produce a correct result, prefer the one
      that is simpler, uses less persistent state, avoids redundancy, and tends to
      consume less CPU, memory, storage, and I/O.'
    - 'MUST: Before adding a helper, abstraction layer, compatibility branch, or wrapper,
      explicitly check whether deletion, inlining, or unification removes more complexity
      than the new layer would.'
    - 'SHALL: Avoid gold-plating and unnecessary knobs; do not add configuration,
      abstraction, or branching that is not required by the current contract or a
      clearly justified near-term need.'
    - 'SHALL: In dev/non-production patch series, remove compatibility ballast once
      no active scenario still needs it; do not preserve old branches purely out of
      historical inertia.'
    - 'MUST: Apply the simplicity preference with an explicit oversimplification check:
      do not remove required safety, diagnosability, operator control, migration correctness,
      or maintainability merely to make the patch shorter or leaner.'
    - 'SHALL: In tie cases between two otherwise valid designs, prefer the one with
      fewer moving parts and the smaller long-term operational and resource footprint,
      unless the operator explicitly prefers a different trade-off.'
    reversibility_blast_radius_and_transition_complexity:
    - 'SHALL: When multiple correct solutions remain after normal conflict triage,
      prefer the one with the smaller blast_radius and the easier rollback or recovery
      path.'
    - 'SHALL: Prefer changes that localise failure modes, keep rollback scope narrow,
      and avoid making unrelated artefacts or runtime paths contingent on the same
      change unless the contract requires it.'
    - 'SHALL: Minimise persistent and cross-run state; introduce new durable state,
      caches, mirrors, or coordination files only when they are required for correctness,
      diagnosability, resumability, or an explicit contract.'
    - 'SHALL: Prefer a single_source_of_truth over mirrored or duplicated state. If
      duplication or derived state is introduced, state the owner, derivation direction,
      and cleanup or consistency mechanism explicitly.'
    - 'MUST: transition_complexity needs an exit condition. Any intentionally introduced
      migration shim, compatibility bridge, transitional mirror, dual-write phase,
      or temporary branch structure must name its removal target or retirement condition.'
    - 'SHALL: Treat operator cognitive load as a real cost alongside CPU, memory,
      storage, and I/O. Prefer solutions that are easier to review, explain, operate,
      and recover from, provided correctness and required control are preserved.'
    - 'MUST: Do not choose a superficially reversible or minimal-state design if it
      weakens required safety checks, observability, operator control, or contractual
      correctness; apply the same oversimplification check used for general simplicity
      preferences.'
    - 'Cross-ref: Rule-classification and audience-boundary questions still follow
      structure_and_scope.rule_layering_model and structure_and_scope.audience_boundary.'
    governance_and_override_handling:
    - 'MUST: Before each patch block, restate the hard baseline, the currently governing
      guidelines, any explicit operator overrides, and whether a pending guidelines/governance
      patch is a blocker for the requested code patch.'
    - 'MUST: If a blocker exists, either resolve it first or state the explicit operator
      override that permits continuing despite it.'
    - 'MUST: Do not silently mix current guidelines, decided-but-not-yet-patched target
      state, and reconstructed intermediate states.'
    - If a new target state is already explicitly decided but guideline patches are
      still pending, either treat it as an explicit operator override or patch the
      guidelines first; the choice must be named, not implied.
    patch_block_precheck_discipline:
    - 'MUST: Before each content-changing patch_block, run and label a predecessor_precheck
      and a guideline_compliance_precheck separately; do not collapse them into one
      unlabeled status note.'
    - 'MUST: The predecessor_precheck state whether the direct predecessor introduced
      regressions, missing artefacts, invalid delivery, or another concrete blocker
      that should be fixed before new thematic work continues.'
    - 'MUST: The guideline_compliance_precheck evaluate the material items from the
      current series_compliance_matrix and mark them explicitly as pass, fail, open,
      deferred_with_reason, or not_applicable.'
    - 'MUST: A green predecessor_precheck does not imply guideline compliance, and
      a green guideline_compliance_precheck does not imply runtime safety; if both
      matter, state both.'
    - 'SHALL: If a known compliance fail remains open, restate it briefly in the status
      block until it is fixed or explicitly deferred by the operator.'
    - 'MUST: When a patch intentionally fixes a known compliance fail, name that fail
      explicitly instead of reporting only a generic clean precheck.'
    - 'MUST: When a patch_block touches a top-level runtime/operator phase (for example
      install apply, backup-setup apply, samba apply, or another end-to-end operator
      path), the predecessor_precheck must include a named path_precheck for that
      touched phase in addition to syntax/parse checks.'
    - 'MUST: The path_precheck name the touched phase and a phase_stopline, and state
      whether the predecessor was reviewed all the way to that stopline or intentionally
      stopped earlier with reason.'
    - 'MUST: For single-file bundles that contain embedded generated-tool templates,
      predecessor review must distinguish setup-runtime definitions from names that
      merely appear inside heredoc/template text; text presence is not sufficient
      evidence that a runtime function exists.'
    content_changing_patch_block_delivery_gate:
      canonical_owner: general_rules.collaboration_protocol.content_changing_patch_block_delivery_gate
      intent: Make guideline compliance a release gate, not background advice.
      rules:
      - 'MUST: No content-changing patch_block may be delivered until the material
        guideline_gates for that patch_block are explicitly filled in the plan, status
        block, compliance matrix, or equivalent operator-facing delivery evidence.'
      - 'MUST: The filled guideline_gates include at minimum operative_baseline, series_guideline_scan,
        series_compliance_matrix, predecessor_precheck, guideline_compliance_precheck,
        touched_phase or phase_stopline when applicable, runtime_definition_audit when
        generated code/source/trap/mktemp boundaries are touched, blast_radius, and
        validation_claims.'
      - 'MUST: Do not publish a release ZIP, patch ZIP, or replacement full bundle
        while any relevant guideline_gate is still fail or open.'
      - 'MUST: A deferred_with_reason gate is deliverable only when the reason is explicit,
        the gate is non-blocking for the current patch_block, and the operator has not
        required it as a blocker.'
      - 'MUST: If predecessor_precheck finds a direct-predecessor regression, invalid
        delivery, or closely related blocker, deliver a narrowly scoped fix_patch first;
        do not start a new thematic patch_block until that predecessor issue is resolved
        or explicitly overruled by the operator.'
      - 'MUST: Validation summaries distinguish static checks, generated-artifact checks,
        runtime path checks, and intentionally not-executed expensive checks; a green
        syntax or ShellCheck result must not be presented as evidence for an unexecuted
        runtime path.'
      - 'SHALL: When the patch touches source, BASH_SOURCE, trap, mktemp, heredoc-generated
        code, installed helpers, or setup/apply phases, include a collateral-damage
        review that asks which existing call sites or later runtime paths depend on
        the old execution context.'
      cross_references:
      - general_rules.collaboration_protocol.patch_block_precheck_discipline
      - general_rules.collaboration_protocol.review_checklist_per_patch
      - general_rules.collaboration_protocol.phase_stopline_rule
      - general_rules.generated_script_rules.runtime_definition_audit
    operator_override_traceability:
    - 'SHALL: When an operator override governs the current patch block, restate it
      in one short labelled line in the plan/output so later reconstruction can distinguish
      override from baseline guideline text.'
    operator_facing_status_line_discipline:
    - 'MUST: Before delivering a patch_block, provide a compact operator-facing status
      line or equivalent short status block that makes the current execution basis
      legible without forcing the operator to reconstruct it from surrounding prose.'
    - 'MUST: This status line/status block name at minimum the operative_baseline,
      the governing guideline version or rule scope when relevant, any explicit_operator_override
      currently in force, and the next intended patch_block or review action.'
    - 'SHALL: If a named decision_record_light is governing the current patch_block,
      restate its label in the status line/status block rather than only in longer
      prose.'
    - 'SHALL: If a blocker exists or has just been resolved, include its status explicitly
      (for example blocker/open, blocker/resolved, or override-in-effect) instead
      of leaving that state implicit.'
    - 'SHALL: Keep the operator-facing status discipline compact and stable across
      follow-up blocks so handoffs, reconstructions, and quick reviews can identify
      the current state with low cognitive load.'
    - 'MUST: Do not let the status line/status block contradict the detailed plan,
      decision record, or delivered artefacts; if they differ, the detailed artefact-level
      data wins and the inconsistency must be corrected explicitly.'
    status_plan_delta_discipline:
    - 'SHALL: In addition to the operator-facing status line/status block, include
      a compact status_delta whenever this materially reduces reconstruction effort.'
    - 'MUST: The status_delta identify, at minimum, the most relevant change since
      the direct predecessor and any high-value status_invariant that intentionally
      remains unchanged when omission could invite drift assumptions.'
    - 'SHOULD: Keep the status_delta short (typically one to three concise items),
      focused on operator-relevant deltas rather than repeating the full plan.'
    - 'MUST: If nothing material changed in the governing baseline/decision/override
      state, say so explicitly instead of implying invisible churn.'
    - 'SHALL: When a patch_block is primarily a fix_patch or metadata repair, the
      status_delta should say that the thematic contract is unchanged unless the fix
      also alters behaviour.'
    - 'MUST: Do not let the status_delta contradict the detailed plan, diff summary,
      or delivered artefacts; if a contradiction appears, correct the short status
      text explicitly.'
    reconstruction_and_expiry_handling:
    - Only actually available full versions count as hard baselines.
    - Missing or non-downloadable intermediate states must not be silently assumed.
    - If reconstruction is used, it MUST be deterministic from the last reliable full
      version plus documented patch/review content and explicit operator overrides.
    - A reconstructed intermediate state is not a hard baseline until the assistant
      republishes it as a full downloadable version.
    - 'MUST: When the operator provides a concise operator-held/fullfile list for a
      handoff or new thread, treat that list as the authoritative initial availability
      baseline for the new thread unless the operator explicitly corrects it later.'
    - 'MUST: If newer claimed/generated follow-on states are not operator-held or not
      uploaded in the new thread, do not skip over them implicitly; continue from the
      newest actually available full predecessor or explicitly reconstruct/republish
      the needed intermediate state before the next ordinary patch_block.'
    generated_artifact_availability_failures:
    - 'MUST: When a generated artefact appears unavailable, first diagnose whether
      the problem is (1) generation/write failure, (2) link/upload/handoff failure,
      or (3) session expiry / loss of a formerly available artefact state.'
    - 'MUST: State the diagnosed case explicitly before choosing relink, regenerate,
      or reconstruct.'
    - 'MUST: Distinguish explicitly between claimed delivery state and verified current
      availability; do not collapse them into one status line.'
    - 'SHALL: If the artefact still exists intact in the current workspace, prefer
      re-linking/re-publishing it over regenerating it.'
    - 'MUST: After generation or re-publication, verify file existence, filename,
      and reference target before marking the artefact delivered again.'
    - 'MUST: Regenerate or reconstruct only when the artefact is actually missing,
      invalid, or otherwise not recoverable by re-linking/re-publishing.'
    - Do not describe an unavailable download as a generation failure unless file
      existence/validity has been checked first.
    thread_hygiene_and_handoff:
    - 'SHALL: Actively watch for thread growth/fragility and suggest a new thread
      when context size, artefact expiry, or repeated reconstructions start to threaten
      stable execution.'
    - 'MUST: When recommending a thread switch, provide a compact handoff prompt template
      instead of only free-form prose.'
    - 'MUST: The generic handoff template name at minimum the working mode, hard baselines,
      operative_baseline, current patch_block, next recommended patch_block, open
      findings/blockers, still-governing assumptions or overrides, and reconstruction
      notes for missing_intermediate_state cases.'
    - 'MUST: When the operator provides a current operator-held/fullfile list for the
      handoff, treat that list as the authoritative starting upload set for the new
      thread rather than implying availability of newer thread-local artefacts that
      were not confirmed as downloaded.'
    - 'MUST: The generic handoff template separate required re-upload artefacts from
      optional supporting artefacts whenever the next thread depends on uploaded files.'
    - 'MUST: When prior artefact problems exist, the handoff must distinguish the
      last verified hard baseline from claimed but unverifiable follow-on states.'
    - 'MUST: Claimed but unverifiable follow-on states must not be presented as hard
      baselines.'
    - 'SHOULD: Keep handoff prompts compact and reconstruction-oriented; include only
      the context needed to continue safely, not a bloated transcript dump.'
    - 'SHOULD: When a current project status artefact exists, name its version in
      the handoff and describe only the delta since that milestone unless the status
      file is stale or unavailable.'
    - 'MUST: Use a stable generic section structure for handoffs unless the operator
      explicitly requests a different format.'
    - 'MUST: Deliver handoff responses with both (1) a downloadable handoff file and
      (2) a copyable handoff prompt in a fenced code block.'
    - 'MUST: If the operator requests a handoff but does not explicitly provide the
      current download/operator-held file state, ask for that state before issuing
      the final handoff package.'
    - 'SHALL: Accept a concise operator-held/fullfile list as sufficient download-state
      confirmation; do not require per-file acknowledgement for every earlier artefact
      unless ambiguity remains.'
    - 'MAY: When immediate thread fragility forces a provisional handoff before the
      operator can answer, mark it explicitly as provisional and state that operator-held
      file status is still unconfirmed.'
    - 'MUST: Add a brief operator-facing note that states which files should be uploaded
      in the new thread and which newer artefacts, if any, must not be assumed available.'
    - 'MUST: When a reconstructed_working_baseline, canonical merge, or republished
      interim full version becomes the accepted continuation base, the handoff name
      that artefact explicitly as next_linear_base and state the next_expected_patch
      that should follow from it.'
    - 'MUST: After such a next_linear_base is named, older parallel artefacts from
      the same line must be marked as superseded/non-predecessor for ordinary future
      patch_blocks unless a later explicit operator override says otherwise.'
    - Project-specific handoff payload extensions belong in the project section, not
      as duplicate generic rules.
    recommended_template_sections:
    - Goal / current patch series
    - Working mode / hard rules in force
    - Files to upload in the new thread (required hard baselines)
    - Optional supporting artefacts
    - Current governing versions / operative baselines
    - Next linear base / next expected patch (when a reconstructed or republished
      baseline governs continuation)
    - Open findings / TODOs / blockers
    - Reconstruction notes / still-governing assumptions
    - Next recommended patch_block
    - Touched phase / phase_stopline
    - Cheap path_precheck for the touched phase
    - Subsystem audit trigger status (if any)
    template_heading_rule:
    - Use an explicit heading equivalent to "Files to upload in the new thread" for
      required hard baselines.
    - Keep optional supporting artefacts under a separate heading so necessity vs.
      convenience is visible at a glance.
    - Place claimed-vs-verified file availability notes under the file-upload/reconstruction
      sections rather than inventing a separate ad-hoc heading unless the operator
      requests one.
    - Place deferred-but-valuable insights under the existing open-findings or reconstruction
      sections with explicit status labels rather than as transcript appendices.
    handoff_file_truth_rule:
    - 'MUST: Distinguish explicitly among (a) verified current-workspace artefacts,
      (b) files the operator should upload in the new thread, and (c) claimed/generated
      follow-on artefacts not confirmed as operator-held.'
    - 'MUST: When link/download fragility exists, name the last verified operator-held
      fullfiles explicitly and do not imply that the latest linked artefacts are available
      in the next thread.'
    - 'SHALL: Treat only files actually uploaded into the new thread as available
      there unless the operator explicitly confirms additional successful downloads.'
    - 'MUST: Final handoff file-upload instructions must be grounded in the operator-confirmed
      download state when that confirmation was requested; do not guess missing operator-held
      status.'
    deferred_insight_preservation_rule:
    - 'MUST: Preserve deferred-but-valuable insights in compressed handoff form when
      later continuation would plausibly benefit from them.'
    - 'MUST: Mark carried-forward items as one of active_next_block_item, deferred_follow_up,
      or rejected_or_superseded_direction.'
    - 'MUST: Record the reason for deferral or rejection whenever omission would risk
      blindly reopening the issue in a later thread.'
    next_step_suggestions_and_missing_file_handling:
    - 'SHALL: Actively suggest the next sensible patch_block or review step when this
      helps keep the series moving.'
    - 'SHALL: Actively point out missing files or artefacts when the operator could
      realistically provide or re-upload them.'
    - 'MUST: Do not silently assume unavailable files or intermediate states.'
    - 'MUST: If a missing_intermediate_state is required, explicitly choose between
      requesting/re-uploading the file and deterministic reconstruction from the hard_baseline
      plus documented patch/review content and explicit_operator_override.'
    - 'MUST: Apply this decision ladder explicitly: (1) decide whether exact historical
      fidelity matters for the current patch block, (2) decide whether the operator
      could realistically provide/re-upload the file, (3) decide whether deterministic
      reconstruction is already authorised and operationally preferable, (4) then
      choose request/re-upload or reconstruction and state that choice.'
    - 'SHOULD: Prefer a direct request for the missing file when exact historical
      fidelity matters more than speed.'
    - 'SHOULD: Prefer deterministic reconstruction when the operator has already allowed
      it and waiting for the file would unnecessarily stall progress.'
    - Asking for a missing file is encouraged; blocking on it is not mandatory if
      a valid deterministic reconstruction path exists.
    testing_depth_by_risk:
    - 'MUST: Run cheap tests for every delivered patch block.'
    - 'SHALL: Add expensive tests when the patch changes runtime semantics, boot/install/unlock
      behaviour, persistence/state migration, or another high-risk execution path.'
    - 'SHALL: If expensive tests are not run for a semantically risky patch block,
      say so explicitly and state why the chosen cheap tests are considered sufficient
      for this patch_block.'
    - 'MUST: If a patch touches a generated-tool install path, cheap tests must include
      artifact-level proof for the touched installed artifacts (not only producer-script
      syntax or --help output).'
    - 'MUST: For single-file generator bundles, when the touched path changes or depends
      on embedded non-shell payloads, generated helper bodies, or another emitted artefact
      family, cheap tests must include type-appropriate validation of the rendered artefact
      or extracted payload (for example python -m py_compile, json/yaml parsing, or
      systemd/unit verification when applicable); outer producer-script syntax alone is
      insufficient.'
    - 'SHALL: For single-file bundles with many embedded tools, cheap tests should
      prefer a path_precheck that reaches the named phase_stopline over isolated point
      checks of the immediately edited function.'
    review_depth_by_risk:
    - 'SHALL: Match the predecessor review depth and validation narrative to the risk
      and blast radius of the current patch_block.'
    - 'SHALL: For wording/cleanup-only patches, review at least syntax/parse validity,
      intended scope boundaries, and unintended obligation-level changes.'
    - 'SHALL: For workflow/governance patches, additionally review owner placement,
      scope layering, cross-section conflicts, and override handling.'
    - 'SHALL: For runtime/script patches, additionally review the relevant execution
      path(s), state transitions, and cheap_test coverage tied to the changed behaviour.'
    - 'MUST: For high-risk patch blocks, explicitly state either which expensive_test
      is required/performed or why it is deferred for this step.'
    - 'SHALL: For single-file bundles with embedded generated tools or large heredoc
      sections, review the touched runtime path with a runtime_definition_audit so
      that setup-runtime functions/callers are not confused with names that exist
      only inside generated artifacts.'
    - 'MUST: If a patch changes or depends on a generated-tool install path, the review
      must state the cheap proof used for the generated artifacts up to the relevant
      phase_stopline (for example rendered runner/helper/unit validation).'
    - 'MUST: For single-file generator bundles, when the fix claim depends on embedded
      non-shell payloads or generated helper emitters, the review must state whether
      the supporting cheap proof came from rendered artefacts, extracted-payload validation,
      or operator truth-surface testing; outer producer-script syntax alone is not
      enough to describe that path as working.'
    decision_record_light:
    - 'SHALL: When a patch_block introduces or relies on a cross-artefact architecture/contract
      decision, include a short named decision record in the plan/output.'
    - 'MUST: A decision record names at minimum the decision label, the scope, the
      affected artefacts, and whether it changes a baseline contract or acts as an
      explicit_operator_override.'
    - 'SHALL: Reuse the same decision label across follow-up patch blocks until the
      decision is fully absorbed into the relevant artefacts/guidelines.'
    - 'SHALL: If a later patch_block depends on an earlier named decision, restate
      the decision briefly instead of rediscovering it implicitly.'
    rule_lifecycle_review:
    - 'MUST: At the end of a series or larger cleanup block, briefly review whether
      any newly stabilised rule belongs in general_rules, penelope_specific, or only
      in the series-local handoff context.'
    - 'SHALL: Promote a rule to general_rules when it is broadly reusable across projects;
      keep it project-specific when it depends on Penelope semantics; keep it local
      when it remains context-bound.'
    - 'SHALL: Demote or relocate a rule when it no longer belongs at its current scope;
      do not fossilise local workarounds in general_rules.'
    language_and_output_boundary:
    - Operator chat communication may use the operator's preferred natural language;
      produced code, comments, identifiers, guidelines, and technical documentation
      remain in English unless the operator explicitly defines a different artefact
      language.
    terminology_normalisation:
    - 'MUST: Prefer the canonical terms defined under structure_and_scope.term_definitions
      over ad-hoc synonyms.'
    - 'SHALL: Use patch_block as the normative delivery unit, fix_patch for direct-predecessor
      repair, operative_baseline for the concrete current work base, reconstructed_working_baseline
      for a republished deterministic rebuild, and handoff for a thread-transition
      package.'
    - 'MUST: Use patch_block as the default workflow term; avoid mixing it interchangeably
      with step, micro-patch, or bundle when the normative unit of work is meant.'
    - 'MUST: Use hard_baseline, reconstructed_working_baseline, and missing_intermediate_state
      consistently for baseline status.'
    - 'SHALL: When legacy or mixed-language terms remain in older text, either replace
      them in cleanup patches or mark them as legacy aliases instead of introducing
      fresh synonyms.'
    - 'SHALL: Use blast_radius, single_source_of_truth, and transition_complexity
      when discussing rollback scope, duplicate-state design, or temporary migration
      structures, instead of inventing new ad-hoc labels.'
    - 'SHALL: Use status_delta and status_invariant for compact predecessor-relative
      change summaries instead of inventing fresh ad-hoc labels for ''what changed''
      and ''what stayed the same''.'
    diagnostics_preservation:
    - 'As long as the root cause has not been found: do NOT remove or "simplify" diagnostic/logging
      code.'
    - 'When Grok/other tools suggest removing code: only accept if functional equivalence
      + diagnostic value are preserved.'
    iterative_patch_series:
      note: '"Fallback" in these guidelines refers to runtime/ad-hoc fallback behavior;
        for patch series NEVER fallback to guessed context, assumed intermediate states,
        or old uploads without an explicit baseline/reconstruction decision.'
      goal: Stable, traceable patch series without regression cascades.
      precheck_previous_step_rule:
      - Before each new patch_block, the immediately preceding delivered state MUST
        be briefly reviewed (at minimum parse/syntax check plus a brief plausibility
        check appropriate for the artefact).
      - The precheck is documented in the change plan (e.g. precheck_of_previous_patch)
        and if findings exist, a fix patch for the last step is created first.
      change_plan_requirements:
      - Each patch series patch_block contains a section precheck_of_previous_patch,
        provided an immediate predecessor delivered state exists.
      - The precheck names at minimum the base checks performed (e.g. yaml.safe_load,
        bash -n) and a brief verdict (OK/finding).
      - If a problem is found, no new topic step is started; a targeted fix of the
        previous step comes first.
      - The short operator-facing status for each patch_block SHOULD include a status_delta
        when predecessor-relative change/invariance would otherwise be easy to miss.
      - When compatibility policy materially governs the current work, the plan/status
        MUST name the compatibility_stance (for example current-only/latest-only/no-compatibility
        mode) and identify any explicit operator override that establishes it.
      - When a patch_block touches an area with known historical aliases, schema upgrades,
        old config shapes, or compatibility branches, the plan MUST include a compact
        legacy_census naming the in-scope legacy elements and classifying each as
        removed_now, intentionally_kept_with_reason, or deferred_with_reason.
      - For top-level runtime/operator phases, the precheck names the touched phase,
        the chosen phase_stopline, and the cheap path_precheck performed against that
        path.
      - For single-file bundles with embedded generated tools, the precheck or review
        notes whether runtime_definition_audit was needed and what it covered.
      - When a subsystem_audit_block is triggered, the change plan must explicitly
        say so instead of presenting the step as an ordinary local fix patch.
      rules:
      - Break patch series into clearly delimited, operable steps. Avoid both atomically
        tiny steps that only create artefact/download churn and oversized steps that
        raise timeout/retry risk.
      - After each step, briefly describe the next planned step in 1-3 bullet points
        and let the operator request the next patch with a brief prompt (e.g. "continue").
      - When an intermediate step fails, first deliver ONE pure bugfix patch that
        resolves the error; no further refactors/features in the same patch.
      - 'MUST: Ordinary patch_block delivery after a handoff or re-entry continue from
        the direct predecessor of the accepted operative_baseline/next_linear_base,
        not by jumping back to an older hard_baseline merely because newer artefacts
        were once linked in an earlier thread.'
      - 'MUST: If the needed direct predecessor is missing, explicitly choose between
        re-upload/re-publish and deterministic reconstruction/republish before resuming
        ordinary linear patching.'
      - New patches are ALWAYS created based on the immediate predecessor version
        (old -> new). No skipping over multiple versions unless the operator explicitly
        provides a different baseline file.
      - 'If a required file is no longer available: do not fall back to older versions.
        Either request the exact file again or, if the operator has explicitly allowed
        reconstruction, recreate the missing intermediate state deterministically
        from the last reliable full version plus documented patch content and then
        publish that reconstructed full version before further follow-up patches.'
      - 'Each patch must make the following clearly visible in the response: base
        version, target version, purpose, affected files, and download links for patch
        + full version(s).'
      - Before the next topic patch, review the immediately preceding patch; if findings
        exist, first create a pure fix patch against the latest state.
      - In current-only/latest-only patch series, if the touched area still contains
        compatibility branches, migration shims, legacy aliases, or old schema/form
        parsing, prefer removing them in the same patch_block unless a documented
        blocker or explicit operator override keeps them.
      - Do not preserve legacy branches merely because they were once an accepted
        transition seam; once the active compatibility_stance is current-only, any
        intentionally retained legacy element needs an explicit reason in the plan/status
        or review.
      - After an agreed change step, produce the patch promptly against the confirmed
        baseline; no long runs without explicit baseline update.
      - The last full version remains the operative baseline for the next step and
        must be kept available.
      - When a patch_block touches a top-level runtime/operator phase, the series
        plan MUST record a phase_stopline for the touched path and reuse or intentionally
        extend that stopline in follow-up patches until the phase is stable again.
      - If the same touched phase produces a second trivial runtime regression of
        the same family (for example command not found, unexpanded technical tokens,
        readonly/source-order conflict, generator stdout leakage, or another obviously
        mechanical runtime failure), the next step MUST be a subsystem_audit_block
        rather than another local micro-fix patch.
      - A subsystem_audit_block MUST review the whole touched execution chain to the
        declared phase_stopline, not only the last failing line or the last modified
        function.
    canonical_owner: general_rules.collaboration_protocol
    owner_scope_note:
    - Canonical owner for patch workflow, version discipline, deliverables, and baseline
      rules.
    - Parallel statements in separate workflow/patch blocks should be avoided or carried
      only as cross-ref.
    guidelines_patch_review:
    - Before every guidelines patch, review the immediate predecessor guidelines version
      like a strict pairing/git-review partner, not only as a syntax check.
    - The review must actively look for redundancy, ambiguity, contradictions, owner
      drift, wording that hides the real obligation level, and unintended normative
      change.
    - Treat the predecessor review as a constructive critical pass: point out contradictions,
        unclear wording, quality problems, and hidden assumptions as a careful colleague
        would during a tough git review.
    - Before every guidelines patch, inspect the available recent context relevant
      to the current series, not just the most recent prompt.
    - Prefer reviewing at least the last 3-5 relevant prompts/messages when they are
      available in the current thread; after a thread transition, the latest handoff
      package MAY serve as the recent-context substitute.
    - If the recent prompts/messages show repeated corrections, workflow drift, or
      newly stabilised rules, evaluate whether they belong in the guidelines, the
      documentation, or only in the local series context.
    - If the review finds a clarity/redundancy defect in the immediate predecessor
      guidelines file, create a focused fix patch first before adding further guideline
      changes.
    detective_review_heuristics:
    - Treat the immediate predecessor patch as a likely regression source until disproven; do not assume the newest patch is trustworthy merely because it is newest.
    - Treat the latest visible failure as a possible downstream symptom rather than the root cause; inspect omitted path segments, state transitions, and contract boundaries before localising the fix.
    - During review, actively look for ballast and regression attractors, including dead branches, duplicate helpers, silent fallbacks, stale compatibility remnants, redundant generated/runtime split logic, and operator-surface drift.
    - When a regression chain repeats within one series, explicitly ask which earlier patch step, omitted path segment, or preserved ballast most likely introduced or amplified the failure before drafting the next patch.
    - When reviewing a newly produced patch, assume the previous reviewer may have missed something material; run a constructive adversarial pass rather than a confirmation pass.
    thread_transition_detective_precheck:
    - At every thread transition, re-verify the actually uploaded baseline against the claimed handoff baseline before trusting continuation state.
    - Assume missing uploads, expired artefacts, unverifiable intermediate states, and stale local memories are more likely than perfect continuity; prefer explicit re-checks over conversational carry-over.
    - Re-check strategic rejected directions, deferred-but-governing insights, fragile runtime assumptions, and expensive truth-surface plans before resuming code changes in a new thread.
    - During baseline comparison after a thread switch, actively look for evidence that the last claimed patch introduced self-version drift, doc/code drift, missing artefacts, or other signs of a partially landed step.
    end_of_series_review:
    - At the end of a patch series, explicitly review whether documentation updates
      are needed.
    - At the end of a patch series, explicitly review whether guidelines updates are
      needed.
    - 'MUST: For documentation-bearing series, record an explicit doc_sync_decision
      before declaring the series or larger cleanup block complete: required_now,
      deferred_to_series_end, or not_needed.'
    - 'SHOULD: A pure script-version bump without operator-visible semantic change
      does not require an immediate documentation patch when the documentation body
      already stays version-neutral and only the central version list would drift
      temporarily.'
    - 'MUST: If a patch changes operator-visible semantics, CLI contract, prerequisites,
      warnings, defaults, paths, or recovery behaviour, the same patch block must
      either update the documentation or explicitly mark the documentation follow-up
      as an open required step.'
    - Classify newly stabilised rules from the series as guidelines-worthy, documentation-worthy,
      or series-local only.
    - Classify assistant-behaviour/process rules into guidelines and human-facing
      operational guidance into documentation; do not patch operator documentation
      merely to encode assistant workflow rules.
    status_and_decision_naming_stability:
    - 'MUST: Once a short operator-facing label is introduced for a decision_record_light,
      blocker state, override state, or recurring status concept, keep that label
      stable across follow-up patch blocks unless there is a concrete ambiguity or
      classification error that requires renaming.'
    - 'SHALL: Prefer a small, reusable label vocabulary over ad-hoc rewordings, so
      the operator can track the series state across reviews, reconstructions, and
      handoffs without remapping synonyms.'
    - 'MUST: If a previously used label is renamed, explicitly map old label -> new
      label and state why the rename was necessary.'
    - 'SHALL: Do not rename a stable label merely for stylistic variation.'
    - 'SHOULD: Reuse the same short labels in the status line/status block, decision
      record, plan, and diff summary when they refer to the same governing state.'
    - 'MUST: If two existing labels partially overlap but are not identical, either
      keep their scopes explicitly distinct or consolidate them in a dedicated cleanup
      patch; do not let near-synonyms drift implicitly.'
    uncertainty_and_claim_strength_discipline:
    - 'MUST: Distinguish practical claim classes when it matters for patch correctness
      or operator decisions: verified_claim, reconstructed_claim, inferred_claim,
      and operator_decided_state.'
    - 'SHALL: Prefer the simplest wording that preserves the true claim strength;
      do not turn a reconstruction or inference into an apparently verified fact.'
    - 'MUST: When a statement depends on a reconstructed working baseline, an unavailable
      earlier artefact, or a recent operator override, say so explicitly if the difference
      matters to the current patch_block or review.'
    - 'SHALL: Use lightweight phrasing rather than academic taxonomy in normal outputs;
      only add the extra qualifier needed to avoid misleading certainty.'
    - 'MUST: If exact historical fidelity is unknown, do not imply byte-identical
      proof. State that the result is reconstructed, inferred, or operator-decided
      as appropriate.'
    - 'SHALL: For routine low-risk statements, avoid cluttering the output with repetitive
      certainty labels when the source is obvious from the operative_baseline and
      delivered artefacts.'
    - 'MUST: When uncertainty affects a design choice, blocker decision, test claim,
      or migration statement, surface it explicitly in the status line, plan, or review
      rather than burying it in prose.'
    - 'SHALL: Keep the rule pragmatic: the goal is trustworthy communication and correct
      operator decisions, not a formal evidence taxonomy for every sentence.'
    path_precheck_protocol:
      canonical_owner: general_rules.collaboration_protocol.path_precheck_protocol
      intent: Prevent follow-up patches from reviewing only the last edited line while
        missing regressions deeper in the same touched operator path.
      rules:
      - A path_precheck is a cheap, explicitly named predecessor review of the touched
        runtime/operator path up to a declared phase_stopline.
      - A path_precheck does not need to prove the whole walkthrough, but it must
        reach far enough that the predecessor patch is plausibly usable for the next
        patch_block.
      - For apply/install/update paths that generate or install persistent artifacts,
        the path_precheck should normally include the full generated-artifact subphase,
        not stop at producer-script syntax.
      - For single-file generator bundles, if the touched path includes embedded non-shell
        payloads or generated helper families, the path_precheck should include rendered-artefact
        or extracted-payload validation for those changed payloads when a type-appropriate
        validator exists; outer-script syntax alone is normally insufficient.
      - If the assistant intentionally chooses a shorter stopline, the reason must
        be stated explicitly.
      - When the touched path automatically hands off from one operator/runtime phase
        into a second phase (for example backup -> verify, verify -> unmount, or
        renderer -> refresh helper), the path_precheck should name the handoff boundary
        explicitly (for example before/after lock release, marker cleanup, dashboard
        refresh, or unmount) instead of describing the path as one opaque success block.
    runtime_definition_audit:
      canonical_owner: general_rules.collaboration_protocol.runtime_definition_audit
      intent: Avoid false confidence when single-file bundles contain large heredoc/template
        bodies with names that look like normal runtime functions.
      rules:
      - For single-file bundles with embedded generated tools, do not treat plain
        text presence of a function/helper name as evidence that the setup/runtime
        path can call it.
      - 'Review must distinguish at minimum: setup-runtime definitions, generated-artifact-only
        definitions, and cross-boundary helpers deliberately shared through the common
        library.'
      - When a runtime failure could be caused by this ambiguity, the next patch must
        audit the whole relevant call chain rather than only the immediately failing
        line.
    subsystem_audit_block:
      canonical_owner: general_rules.collaboration_protocol.subsystem_audit_block
      trigger_examples:
      - Repeated trivial runtime regressions in the same touched phase.
      - Evidence that local fixes keep surfacing new command-not-found, token-leak,
        readonly/source-order, or generator wiring failures in the same path.
      - Evidence that the assistant may be reasoning from incomplete context because
        the file mixes runtime code and embedded generated artifacts.
      must:
      - Pause ordinary micro-fix patching for that phase and perform a wider audit
        of the touched subsystem to the declared phase_stopline.
      - State the audit scope, the concrete touched path, and the classes of failure
        being hunted.
      - For single-file generator bundles, include emitted artefact families and embedded
        non-shell payloads that lie on the touched path to the phase_stopline; do
        not stop at the outer producer function when the real failure could sit in
        rendered helpers or embedded scripts.
      - Resume ordinary patch sizing only after the audited phase has a plausible
        cheap path_precheck again.
    phase_stopline_rule:
      canonical_owner: general_rules.collaboration_protocol.phase_stopline_rule
      rules:
      - Every content-changing patch_block that touches a top-level runtime/operator
        phase must name a phase_stopline in the plan or status block.
      - The phase_stopline identifies where the review/test context intentionally
        stops for this block.
      - When a later patch extends the same touched phase, restate or update the phase_stopline
        instead of silently shrinking or moving it.
  scenario_review_rules:
    canonical_owner: general_rules.scenario_review_rules
    intent: Generic review method for complex systems with multiple paths, modes,
      or operational states.
    rules:
    - Review complex systems scenario by scenario, not only file by file or function
      by function.
    - Explicitly name prerequisites for each scenario.
    - Name the relevant code path or flow for each scenario.
    - Define the expected behaviour for each scenario.
    - Define the failure behaviour for each scenario.
    - After individual scenarios, perform a global consistency pass.
    minimum_outputs:
    - List of scenarios considered with short description
    - Prerequisites/inputs per scenario
    - Code path or flow per scenario
    - Expected behaviour / how the good target state is recognisable
    - Failure behaviour / visible failure signals
    - Global brief conclusion with residual risks and open drift points
    review_questions:
    - Are all relevant modes/paths covered or are there blind spots?
    - Is it clear which prerequisites activate a scenario?
    - Is it clear how success, warning case, and hard error are distinguished?
    - Are there contradictions between individual scenarios or against global system
      behaviour?
  upgrade_rules:
    canonical_owner: general_rules.upgrade_rules
    scope: General safety principles for stateful tools and setup, update, and upgrade
      paths.
    rules:
    - Rerun safety must be explicitly evaluated and maintained for stateful tools.
    - Runtime data must not be implicitly overwritten.
    - Missing runtime artefacts may be created when creation is the safe default.
    - Logs must not be implicitly deleted.
    - Persistent state must not be implicitly reset.
    cross_reference:
    - Penelope-specific stricter operational rules live under penelope_specific.backup_upgrade_rules.
  generated_script_rules:
    canonical_owner: general_rules.generated_script_rules
    scope: Generic review and consistency rules for artefacts generated from heredocs,
      templates, macros, or generator logic.
    rules:
    - Generated artefacts must be reviewed explicitly as real artefacts, not only
      the generator code.
    - Generated artefacts must match runtime checks and runtime assumptions.
    - The generator/runtime contract must be explicitly validated.
    - When a generated artefact or helper family embeds another language or structured
      payload, validation should use a type-appropriate parser or validator against
      the rendered artefact or extracted payload where practical; outer generator syntax
      alone is not equivalent proof.
    cross_reference:
    - Project-concrete generator/runtime bindings live under penelope_specific.generated_script_constraints.
  doc_code_consistency:
    canonical_owner: general_rules.doc_code_consistency
    scope: Generic consistency check between documentation and implemented behaviour;
      focus is matching document content against real implementation, not pure markdown
      structure.
    rules:
    - Documentation must match the code and the real operational modes in content.
    - After a patch series, an explicit code-vs-docs consistency pass must be performed.
    - Paths, tool names, config keys, and versions must be specifically checked against
      the code.
    - Differences between operational modes must be correctly reflected in documentation.
    - Header, filename, and version information must not contradict each other when
      they reflect implementation facts.
    minimum_checks:
    - Paths
    - Tool names and artefact names
    - Config keys and defaults
    - Versions and compatibility notes
    - Mode/scenario-based behaviour descriptions
    timing:
    - after thematically related patch series
    - before release or sign-off of a new full version
  credential_variable_naming:
    canonical_owner: general_rules.credential_variable_naming
    intent: Stable naming rules for top-level operator-editable cleartext credential
      carriers.
    rules:
    - Top-level operator-editable cleartext credential carriers MUST use the `CRED_`
      prefix.
    - This includes credential-bearing edit variables even when they are declarative
      arrays/lists rather than scalar password assignments.
    - Non-secret identifiers and routing variables MUST NOT gain a `CRED_` prefix
      merely because they appear next to credentials.
    - Persisted runtime password files and other storage artefact names MUST NOT be
      renamed solely to add `CRED_`.
    examples:
      prefixed_edit_variables:
      - CRED_ADMIN_PASSWORD
      - CRED_BACKUP_PASSWORD
      - CRED_SERVICE_TOKEN
      - CRED_ARCHIVE_USERS
      - CRED_MANAGED_SHARES
      unprefixed_non_secret_identifiers:
      - ADMIN_USER
      - TARGET_HOST
      - HOST_SCOPE_NAME
      - INTERNAL_USER
      unprefixed_runtime_secret_files:
      - system_pw
      - service_token_file
      - archive_pw
    review_and_documentation_rules:
    - Documentation, review checklists, and project-specific recovery notes MUST keep
      examples and variable lists aligned with the current `CRED_` naming scheme.
    - Concrete project-specific example lists belong in the project section, not as
      normative general examples.
  bash_best_practices:
    interpretation:
    - Safety/correctness rules outrank formatting/style preferences on conflict.
    - Style preferences here are still intentional general defaults to keep code compact,
      consistent, and reviewable across projects.
    general:
    - 'Shebang: ''#!/usr/bin/env bash'' for all bash scripts.'
    - 'Minimum version: Bash >= 4.0. If not guaranteed, check at script start (BASH_VERSINFO)
      and abort with clear error message.'
    - 'Strict mode is mandatory: ''set -Eeuo pipefail''. Exceptions must be justified
      directly in code.'
    - 'MUST NOT: use ''set +e''. Capture expected non-zero status with explicit
      guarded branches, e.g. ''if command; then ... else rc=$?; ... fi''. Prefer
      ''die'' for fatal errors. Use explicit ''|| true'' only for intentional best-effort cleanup.'
    - 'Maximum line length: 150 characters (SHALL).'
    - 'When changing existing code: change as little as possible, except for clear
      bugs/inconsistencies; do not remove diagnostic/logging code before root cause
      is found.'
    - 'SHALL: Document external dependencies (binaries) in the header and/or check
      early via require_cmd (with clear error message).'
    syntax_and_formatting:
    - 'Indent: 2 spaces, no tabs.'
    - 'Inline comments: exactly two spaces between code and # (e.g. VAR="x"  # comment)'
    - Use blank lines sparingly within functions/blocks; prefer no blank lines inside
      a function unless they separate conceptual blocks, and keep at most one blank
      line between functions.
    - 'Strings: double quotes (") by default. Single quotes ('') only for literals.'
    - 'Spacing: consistent (e.g. ''if [[ "${var}" == "value" ]]; then'').'
    - 'SHALL: Do not compress excessively (no long '';'' chains). Few blank lines
      within blocks, but keep line breaks for long/complex commands (readability,
      diff, ShellCheck).'
    variables:
    - 'Always quote: "${var}" instead of $var (including in tests, strings, arrays).'
    - 'Command substitution: var="$(cmd)" (no backticks).'
    - 'Local variables: for command substitution prefer separate declaration and assignment
      (local x; x="$(cmd)").'
    - 'Constants: use ''readonly'' (e.g. SCRIPT_VERSION).'
    - 'Naming: exported/environment variables UPPERCASE; local variables lowercase.'
    - 'Hostname variables: do not use a generic ENV variable ''HOST'' as input (collision-prone).'
    - 'Model lists as arrays; for key/value: associative arrays (declare -A).'
    - 'When IFS is changed: save the old value and ALWAYS restore it.'
    - 'SHALL: Use locale only selectively for parsing/sort (e.g. LC_ALL=C sort), not
      necessarily globally for the entire script.'
    functions:
    - 'Validate parameters: ''${1:?Error: <MESSAGE>}'' for required arguments or ''${1:-default}''
      for defaults.'
    - Return only for exit status; return data via echo or name reference (declare
      -n).
    - Design functions to be idempotent (Create/Modify/Delete).
    - Keep functions focused and reviewable; if a function grows well past ~50 lines,
      justify why splitting it would add churn or reduce clarity.
    - Descriptive function names (create_user_dir, parse_config).
    - 'SHALL: Use function names consistently within a repository/project; if a repository
      defines a canonical helper vocabulary, document that vocabulary project-specifically
      instead of hard-coding it into the general rules.'
    - 'SHALL: Prefix conventions for function names:'
    - '  - ''require_'': checks that abort with die() on failure (require_root, require_cmd)'
    - '  - ''ensure_'': operations that establish a target state (ensure_dir, ensure_file)'
    - '  - ''validate_'': checks with return value or conditional die (validate_shell_script)'
    - '  - ''is_'': boolean predicates with return 0/1 (is_mounted)'
    - '  - ''write_'': generators for code blocks (write_log_functions_block_bash)'
    - 'SHALL: In single-file generator scripts that emit multiple runtime tools, shared
      lock/state/json helper families SHOULD be emitted once via common helper blocks
      instead of duplicated inline in each generated tool, unless the behaviours intentionally
      diverge.'
    - '  - ''inject_'': functions that insert macros into files (inject_log_functions_macro_if_present)'
    - 'Testability: avoid hidden global side effects; pass required inputs explicitly
      via parameters.'
    conditionals_and_loops:
    - Prefer ''[[ <EXPRESSION> ]]'' over ''[ <EXPRESSION> ]''.
    - Use negations sparingly; prefer positive conditions (readability).
    - Descriptive loop variables (e.g. ''for file_path in <LIST>; do <BODY>'').
    - 'SHALL: No constructs of the form ''producer | while read''. Use process substitution
      or mapfile instead (while read -r <VAR>; do <BODY>; done < <(producer)).'
    error_handling_and_logging:
    - 'Log to stderr with clear prefixes: INFO:, WARNING:, ERROR:.'
    - 'Standard format: [HH:MM:SS] <LEVEL>: <TEXT> (LEVEL: INFO, WARNING, ERROR).'
    - 'Standard functions: ts() for timestamp, log() for INFO, warn() for WARNING,
      die() for ERROR+exit.'
    - No compatibility aliases or migration-only logging wrappers in active code unless
      explicitly approved for a documented reason.
    - Use ts(), log(), warn(), die() directly; emit non-fatal ERROR lines explicitly
      at the call site when needed.
    - 'Exit codes: 0 success, 1 general error, 2 invalid parameters (and further project-specific
      codes must be documented).'
    - Usage block at the top of the script (usage + exit codes).
    - trap for cleanup (EXIT) and controlled error handling (ERR, SIGINT, SIGTERM).
      Cleanup functions must themselves be robust (not throw new errors).
    - 'SHALL: Set TZ early when deterministic local timestamps matter across script
      phases or generated environments; if a project requires a specific timezone,
      define it project-specifically.'
    shellcheck_and_code_quality:
    - Canonical owner for ShellCheck requirements; cross-ref from linting_and_preflight
      and testing.preflight_checks.
    - 'MUST: Run ShellCheck when it is available in the active environment (recommended:
      shellcheck -S error <script>).'
    - 'MUST: If ShellCheck is unavailable, say so explicitly instead of implying that
      ShellCheck passed.'
    - 'MUST: When ShellCheck is unavailable, still run the available syntax checks
      and perform a manual high-value review against common ShellCheck-equivalent
      failure classes, especially SC1090, SC1091, SC2154, SC2034, SC2155, SC2086,
      and SC2016.'
    - 'MUST: Do not claim a script is ShellCheck-clean unless ShellCheck was actually
      run.'
    - 'MUST: ERROR-level issues must be fixed; scripts with errors are not production-ready.'
    - 'SHALL: WARNING-level issues should be reviewed and fixed where possible.'
    - 'ShellCheck disable comments:'
    - '  - MUST be last resort only: prefer rewriting the code in a ShellCheck-clean way when that is reasonably possible.'
    - '  - MUST appear directly BEFORE the affected line (not at the end of the line)'
    - '  - Format: ''# shellcheck disable=SC####'' (with SC number)'
    - '  - MUST be justified by a specific reason unless the surrounding context already makes the reason unambiguous.'
    - '  - MUST NOT be used to hide findings that can be fixed with clearer quoting, control flow, variable naming, or explicit validation.'
    - '  - Prefer ShellCheck source directives over disable comments for sourced files when the source path is dynamic, generated, or provided by the runtime environment.'
    - '  - Standard cases requiring disable are narrow and must still be justified:'
    - '    - SC2034 for Bash nameref target variables when ShellCheck cannot model caller-visible writes; the comment must state the nameref reason.'
    - '    - Project-specific cases where a rewrite would make the code less correct or less clear; document the reason directly on the disable comment.'
    - '  - NEVER disable: SC2086 (unquoted expansion), SC2046 (word splitting), SC2006
      (legacy backtick command substitution)'
    - 'Whitespace/compactness:'
    - '  - SHALL: No double blank lines (maximum 1 blank line between functions/blocks)'
    - '  - SHALL: Prefer compact functions with as few blank lines as clarity permits'
    - '  - Orientation metrics/tools are optional aids, not hard gates'
    heredocs_and_embedded_shell:
    - 'Heredocs with shell payload: prefer ''<<''EOF'''' (single-quoted delimiter)
      for literal payload.'
    - Tab stripping (''<<-EOF'') only when deliberate; otherwise avoid to prevent
      unintended format/indent issues.
    - In ERR/trap logic, do not use multi-line ANSI-C quotes (e.g. `$''<MULTILINE>''`)
      and no mixed quotes in pattern matches in `[[ <EXPRESSION> ]]`; keep sanitising
      on a single line.
    - Heredoc payloads must not be dumped to the log on error; use ''(heredoc omitted)''
      instead.
    - Shell payloads, including generated heredocs, MUST NOT use legacy backtick command substitution; use $() command substitution. Markdown prose files may still use backticks for inline code or fenced blocks.
    - 'SHALL: Name heredoc delimiters uniquely and descriptively (e.g. EOF_FSTAB,
      EOF_UNIT_LOGCOPY), not generically EOF. Continue to prefer single-quoted delimiters.'
    linting_and_preflight:
    - 'Required: ''bash -n <script>''.'
    - 'ShellCheck requirements: see general_rules.bash_best_practices.shellcheck_and_code_quality
      (canonical owner).'
    io_and_tempfiles:
    - Prefer process substitution, pipes, or mapfile when they avoid temporary files.
    - Create temporary files only when they are genuinely needed (for example atomic
      publish, multi-step staging, or a tool interface that requires a path).
    - 'When temporary files are necessary: use ''mktemp'' and clean up safely via
      trap (no hardcoded /tmp filename).'
    security_hardening:
    - 'MUST: eval is forbidden. Use arrays, case dispatch, or parameter expansion
      instead.'
    - 'MUST: When a script has dummy secrets in the config block (edit-before-run),
      a warning MUST appear directly above: replace before execution, store securely
      in an external password manager or secure vault, record the effective values
      externally once the system is accepted for use, do not commit/share.'
    - 'MUST: Secrets must never appear in logs (not even via ERR trap). No set -x
      in sensitive paths; when in doubt use set +x.'
    - 'SHALL: Prefer a project-defined redacted xtrace toggle over raw bash -x. When
      xtrace is active, MUST route xtrace output through BASH_XTRACEFD redaction (best
      effort). For secret expansion in pipelines/printf: { set +x; <secret command>; set -x; }.'
    - 'MUST: Build commands with variable parts preferably as arrays (no string concatenation).'
    - 'MUST: Validate dangerous inputs (device paths, UUIDs, mountpoints, hostnames,
      unit names) before use (pattern/whitelist; e.g. [[ -b <DEVICE> ]] and regex
      for UUID/hostname).'
    destructive_actions:
    - 'MUST: Before the first destructive command (wipefs/sgdisk/luksFormat/mkfs),
      output a compact plan: detected disks (name, size, model, serial) and planned
      steps per target.'
    - 'MUST: In interactive mode, ask a confirmation question (yes/no), default =
      abort; only yes allows continuation.'
    - 'When NON_INTERACTIVE=1 is set: skip the question but log a WARNING and output
      the plan anyway.'
  systemd:
    rules:
    - 'Do not manually symlink units. Always: install to /etc/systemd/system + systemctl
      daemon-reload + systemctl enable --now.'
    - 'After installation: check FragmentPath (systemctl show -p FragmentPath <unit>),
      log systemctl cat <unit>.'
    - 'On errors: include systemctl status --no-pager in logs.'
  documentation_markdown:
    canonical_owner: general_rules.documentation_markdown
    purpose: General, project-independent rules for markdown documentation (reading
      guidance, operator-friendliness, structure, navigation, and markdown consistency).
    boundary_note:
    - This section governs structure, navigation, reading guidance, and markdown hygiene
      of documentation.
    - The content reconciliation of documentation against implementation lives under
      general_rules.doc_code_consistency.
    structure_and_navigation:
      toc:
      - 'MUST contain a table of contents (TOC) near the beginning (after title and
        brief introduction).'
      - 'MUST match the actual headings.'
      - TOC SHALL cover the main chapters and the most important operator runbooks/quicklinks.
      - TOC SHALL use clickable local links (anchors) and be updated after structural
        changes.
      heading_hierarchy:
      - 'MUST maintain a consistent heading hierarchy (no jump from ## to # mid-document).'
      - 'SHALL use # only for the document title; then ## for chapters, ### for subchapters
        etc.'
      numbering:
      - 'MUST either be consistently numbered (1, 1.1, 1.2 etc.) or use no numbers
        at all.'
      - 'MUST NOT have subchapters without a parent chapter (e.g. ''''2.1'''' without ''''2'''').'
      chapter_order:
      - 'SHALL place runbooks/typical processes early; reference details later.'
      - 'SHALL have troubleshooting as its own chapter (not hidden in an appendix).'
      - 'SHALL NOT have the changelog as the largest block at the very top; prefer
        a short summary at the top, full detail further down or at the end.'
      changelog_structure:
      - 'MUST keep the changelog under one chapter heading only (for example `## Change
        log`).'
      - 'MUST NOT create per-release headings inside the changelog.'
      - 'MUST keep only a single `Change log` entry in the TOC; do not add per-release
        TOC subentries.'
      - 'SHALL maintain changelog entries as a flat list with optional indented bullet
        details.'
      - 'SHALL avoid manual per-release anchors when the changelog is intentionally
        maintained as a flat list.'
    operator_friendliness:
      runbooks:
      - 'SHALL contain a chapter ''Typical workflows'' / ''Runbooks'' (3-6 most frequent
        workflows).'
      - 'Each runbook SHALL contain: purpose, prerequisites, steps, ''Expected result
        / What good looks like''.'
      - Runbooks SHALL contain concrete commands (copy/paste-ready) and use consistent
        paths/artefact names.
      post_install_checklist:
      - 'SHALL contain a short post-install checklist (approx. 5 minutes).'
      - Checklist SHALL cover only the most important verifications (network/SSH,
        mounts, services, logs, security checks).
      troubleshooting:
      - 'MUST contain a troubleshooting chapter structured as ''Symptom -> Check ->
        Fix/Next step''.'
      - 'SHALL contain a compact ''''After FAIL run:'''' list with a few standard commands.'
    content_consistency:
      single_source_of_truth:
      - 'MUST treat canonical paths/artefacts as single source of truth (no historical
        alternatives in main text).'
      - 'MUST describe current operator behavior directly; do not use runbook labels
        that refer to prior fixes, temporary patches, or historical step repairs in
        the main operator path.'
      - 'MAY carry legacy/alternatives only in clearly marked, brief ''''Legacy'''' / ''''Appendix''''
        sections.'
      - 'MUST maintain a central "Current tool versions" list (listing all top-level
        bundles/tools) and update it at releases.'
      - 'SHALL reference script calls in body text as `<toolname>-<version>.sh`; concrete
        current version numbers belong only in the central version list; main text,
        examples, and operational prose MUST stay version-neutral or use installed
        target paths.'
      - 'MUST clarify in the docs: tools installed via bundle heredoc **inherit** the
          bundle version (no separate SemVer maintenance in text).'
      - 'Cross-ref: Penelope-specific bundle names for the version list live under
        penelope_specific.documentation_markdown_extensions.'
      scenario_consistency_checks:
      - Recovery runbooks MUST describe the operator decision points explicitly (source
        selection, snapshot selection, rerun decision).
      - Examples MUST respect runtime validation constraints (for example lowercase
        hostnames when the code validates hostnames that way).
      - Path examples and repository layouts MUST match the implemented code exactly.
      terminology:
      - 'SHALL maintain a brief ''''Terms/Glossary'''' section when there are multiple
        technical terms or abbreviations.'
      - 'MUST use terminology consistently (same terms for same concepts; no synonymous
        variable names in body text).'
      defaults_and_risks:
      - 'MUST clearly mark destructive defaults (e.g. data loss) in immediate proximity
        to their first occurrence.'
      - 'SHALL explicitly name opt-in/opt-out semantics (defaults, flags, config values).'
      file_identity_and_anchors:
      - 'MUST: Header version and filename must carry the same document version.'
      - 'MUST: Local anchors and TOC targets must not contain stale version remnants.'
      - 'SHALL: For automatic TOC generation use only genuine chapter headings; maintain
        changelog entries preferably as lists rather than headings.'
    style_and_format:
      code_blocks:
      - 'MUST present commands in fenced code blocks (```bash).'
      - 'SHALL write short paths/variables inline in backticks (`/path`, `VAR`).'
      introductions:
      - 'SHALL have 1-3 introductory sentences per main chapter (purpose, audience,
        when relevant).'
      markdown_hygiene:
      - 'MUST ensure balanced backticks (no ''''hanging'''' code spans).'
      - 'SHALL avoid long paragraphs; use lists/sub-items instead.'
    quality_gates:
      diff_review:
      - 'MUST perform a diff review against the direct predecessor version before every
        publication.'
      - Changes MUST correspond to the expected scope; unexpected changes are blockers.
      pattern_scan:
      - 'MUST perform a simple pattern scan (e.g. placeholders, unwanted file/path
        patterns).'
      - 'SHALL additionally spot-check TOC/anchor consistency on document updates.'
      - 'SHALL specifically cross-check header/file version and TOC/anchor consistency.'
      syntax_checks:
      - 'MUST use simple syntax checks for accompanying scripts/YAML files (e.g. bash
        -n, sh -n, YAML parse).'
      - 'MUST verify at least once parser-based that the file can be loaded before
        delivering new YAML files (no pure visual checks).'
      yaml_validation:
      - 'Python: python -c ''import yaml; yaml.safe_load(open("<file>"))'' (if available)'
      - 'yq: yq eval <file> (if installed)'
    recommended_commands:
      diff:
      - diff -u <old.md> <new.md> | less
      - git diff --word-diff -- <file.md> | less
      grep_scan_examples:
      - grep -nE '___PENELOPE_[A-Z0-9_]+___' <file.md>
      - grep -nE '(standalone|old/|\.\/[^ ]+\.sh)' <file.md>
      - grep -nE '<projectname>-.*-[0-9]+\.[0-9]+' <file.md>
  testing:
    preflight_checks:
    - 'Before execution, a syntax check MUST run: ''bash -n <script-name>-<version>.sh''.'
    - 'ShellCheck: see general_rules.bash_best_practices.shellcheck_and_code_quality
      (canonical owner) for all ShellCheck requirements.'
    - 'When a script executes shell code via heredoc (e.g. chroot <<''EOF''): extract
      the heredoc payload and check it separately with ''bash -n'' (CI/preflight).'
  code_review:
    accept_if:
    - Measurably increases robustness or diagnostic quality (e.g. better checks, more
      context in log, more consistent paths).
    - Does not remove any diagnostic path while the bug is still unresolved.
    reject_if:
    - Cosmetic / simplifying, but reduces logs or removes existing debug hooks.
    - Changes behaviour without proof (missing verification/logs).
  assistant_workflow_hardening:
    context_acquisition:
    - 'MUST: Before analysing and changing a file, perform a one-time preflight scan:
      (a) non-ASCII characters in code artefacts, (b) ellipsis indicators in the source
      text (three consecutive ASCII dots and Unicode ellipsis U+2026). Treat the result
      as an invariant for further processing.'
    - 'MUST: If the preflight scan finds no ellipsis indicators in the source text,
      ellipses appearing later in tool output must be treated as a truncation/preview
      artefact. In this case, do not re-check "is this genuine?" but immediately load
      a larger contiguous source text block from the original (at least 200 lines
      of context or complete section).'
    - 'MUST: Before any change to a file, first extract a contiguous, sufficiently
      large source text block from the original (typically: complete YAML section
      or a window of at least 150 lines) and patch only on the basis of this block.'
    - 'MUST: On signs of truncation/omission in tool output (e.g. cut-off lines, missing
      indentation, incomplete quoting pairs), reload context from the source larger
      before making changes.'
    - 'MUST NOT: Reconstruct or guess missing text from truncated output; reload from
      source instead (larger block or complete file).'
    - 'SHALL: For structured formats (YAML, systemd units), prefer working section
      by section: load section completely, change, reinsert; no ''line surgery'' based
      on individual snippets.'
    text_integrity:
      code_artifacts_ascii_only_policy:
      - 'MUST: Executable scripts, systemd units, initramfs scripts, and configuration
        files generated via heredoc must be ASCII-only. No typographic special characters.'
      - Documentation (markdown) may remain UTF-8; the ASCII-only rule applies to
        code and config artefacts.
      ascii_three_dots_policy:
      - 'MUST avoid three consecutive ASCII dots in the repository (including in comments
        and documentation).'
      - 'Use explicit ASCII placeholders instead: <OMITTED>, <TRUNCATED>, <SERIAL>,
        <PARAMS>, <VALUE>, or clear formulations (etc., and so on).'
      - Do not use the Unicode ellipsis character (U+2026) as a replacement.
      - When three consecutive ASCII dots appear in a diff, MUST treat this as a possible
        truncation/merge artefact and verify by reloading the source location.
      - 'EXCEPTION: In guidelines YAML files, the literal three-dot marker may appear
        in documentation examples (e.g. sentinel_example blocks like ''# BEGIN MANAGED
        BLOCK / <OMITTED> / # END MANAGED BLOCK'') as illustrative placeholders, provided
        they appear in a clearly example-marked context and not in executable code
        artefacts.'
    post_write_artifact_validation:
      principles:
      - 'Every persistent file created via heredoc MUST be validated immediately after
        writing: (1) placeholder/version stamping checked, (2) file type/shebang checked,
        (3) syntax check best-effort appropriate for file type.'
      - For persistent installable artefacts, failed shebang/syntax checks MUST follow
        the owning script's explicit severity policy; when the failure would leave
        an invalid released artefact on disk, the run must abort.
      - 'MUST ensure after writing that no placeholders or macro tokens remain (e.g.
        ___PENELOPE_INSTALL_VERSION___ or other project-specific technical tokens).
        For released/installable artefacts this is fail-fast by default unless the
        owning script documents an explicit per-check downgrade with rationale.'
      - 'SHALL: Validators must not suppress error messages. On non-zero exit code,
        write stderr stdout as diagnostic to the log (or output as warning).'
      checks:
        shell:
        - 'bash scripts: ''bash -n <file>'' (or ''bash -n -- <file>'').'
        - 'POSIX sh: ''sh -n <file>'' for ''#!/bin/sh'' (where available).'
        - 'ShellCheck: ''shellcheck -x <file>'' (if available); findings follow the
          owning script''s explicit severity policy and are release-blocking only
          where that policy says so.'
        systemd:
        - 'systemd units/timers/mounts: ''systemd-analyze verify <file>'' (if available).'
        python:
        - 'Python: ''python3 -m py_compile <file>'' (if available).'
  patterns:
    artifact_validation_pipeline:
      purpose: Pattern for generating files (heredocs/templates) with deterministic
        validation and token hygiene.
      steps:
      - write artifact to target path (atomic where possible)
      - inject/expand macros and placeholders
      - set ownership/mode (chmod/chown) as required
      - ensure_no_unexpanded_tokens (fail under strict verify)
      - type-specific validation (shell/systemd/unit/etc.)
      - log the installed path, mode, and validator result
      validators:
        shell_scripts:
        - validate_shell_script (dash -n -> sh -n -> bash --posix -n)
        systemd_units:
        - validate_systemd_unit (systemd-analyze verify)
        generic_text:
        - validate_generated_file
        - ensure_no_unexpanded_tokens
      notes:
      - For released/installable Penelope artefacts, the pipeline is fail-fast on
        validation/token errors unless an explicit per-check downgrade is documented
        with rationale.
      - Keep validators close to the write site so failures are attributable to the
        producing block.
    troubleshooting_runbook:
      structure:
        log_locations: Where persistent/runtime logs are stored; include fallbacks.
        quick_commands: Minimal commands to extract summary and key evidence.
        evidence_chain: Ordered checks to distinguish failure classes.
        router_notes: 'If applicable: MAC-first, hostname-second guidance.'
        escalation: What to capture first to avoid expensive repro cycles.
      recommended_fields:
      - purpose
      - where_are_the_logs
      - quick_commands
      - evidence_chain
      - router_visibility_notes
      - escalation_when_reproducing_is_costly
    fast_iteration_mode:
      purpose: Accelerate iterative debugging by refreshing only a bounded subset
        of artifacts (e.g., initramfs scripts) with strong safety guards.
      core_requirements:
      - explicit flag to enable (e.g., --initramfs-only)
      - hard non-goals (no disk partitioning/formatting/cryptsetup changes, no grub
        install)
      - path allowlist for what may be modified
      - must run validation pipeline for all changed artifacts
      - must log the exact set of modified files and the initramfs rebuild command
        invoked
      expected_artifact_classes:
      - initramfs-tools hooks and scripts
      - dropbear-initramfs configuration
      - project-specific initramfs config files
      - logging targets and logcopy units (if in scope)
    early_boot_network_diagnostic_profile:
      purpose: Minimal, structured early-boot diagnostics to debug 'host not visible
        on LAN' and remote-unlock failures.
      contracts:
        state_file: net.state (key=value) as single source of truth
        summary_block: Two SUMMARY lines emitted from state_file
        identity_block: DHCP identity hints (hostname/client-id) + MAC/iface correlation
        router_evidence: GW/ARP snapshot and gw_ping result (best-effort)
        console_hint: One-line /dev/console operator hint with ipv4/gw/ssh target
          (no secrets)
        minimal_userspace_constraints:
          purpose: Ensure that early-boot/initramfs diagnostics also work in minimal
            userspaces (BusyBox/klibc) and do not fail due to missing tools or fragile
            pipes.
          must:
          - Initramfs scripts must be POSIX-sh compatible (no bashisms).
          - No dependency on head/tail/awk/sed/cut/ss/netstat/route/ethtool unless
            explicitly copied into initramfs and their presence is logged.
          - Parsing "first line/first match" must be done tool-free via read/while-read
            (not via "| head -n 1").
          - Pipelines must not abort boot-critically on "no matches" (grep in pipelines
            only best-effort, e.g. "grep <pattern> <file> || true", or completely as read-loop).
          should:
          - Where possible use /proc backends (e.g. /proc/net/route, /proc/net/tcp{,6},
            /proc/uptime) instead of external tools.
          - Tool inventory/MISSING list is purely diagnostic and must not trigger
            a hard fail.
          - When N lines are to be logged, use a POSIX line limiter (counter+while-read)
            instead of head/tail.
          reference_snippets:
            first_line_from_file: IFS= read -r first < /path/to/file 2>/dev/null ||
              first=""
            line_limiter: i=0; while IFS= read -r l; do echo "$l"; i=$((i+1)); [ "$i"
              -ge 80 ] && break; done
            first_match_from_cmd: 'out=""; while IFS= read -r l; do case "$l" in *pattern*)
              out="$l"; break ;; esac; done <<EOF

              $(cmd 2>/dev/null)

              EOF'
    initramfs_dropbear_unlock:
      purpose: Pattern for remote unlock of encrypted root via dropbear in initramfs
        (LAN), with deterministic diagnostics and log persistence.
      diagnostics_based_on: general_rules.patterns.early_boot_network_diagnostic_profile
      requirements:
      - Default scenario is remote unlock via SSH; physical access (keyboard/monitor)
        must not be assumed.
      - Recovery must be remote-first by default: no per-boot manual GRUB edits or
          kernel boot parameters may be required.
      - Avoid long DHCP retry loops that delay boot (target: bounded attempts, max
          ~30s DHCP wait per boot stage), and always log backoff/timing.
      - If the DHCP client returns non-zero but a non-linklocal IPv4 and a default
        route are present, treat networking as usable (guard) to keep SSH unlock reachable.
      - Minimize dhcpcd hook surface in initramfs (prefer -C/--nohook for non-essential
        hooks like resolv.conf/hostname/wpa_supplicant) to avoid WEXITSTATUS failures.
      - Prefer LAN-only (Ethernet) operation; WLAN out-of-scope for early-boot unlock
        unless explicitly supported.
      - Interface discovery must be robust (predictable names) and tolerate timing/PHY
        settle.
      - Link/DHCP may be time-critical; limited retries/backoff are allowed when explicitly
        logged.
      - Dropbear must start before waiting for unlock; listening on expected port
        must be verified and logged.
      - Unlock path must be accessible via SSH (cryptroot unlock / forced command
        or equivalent).
      - Module/firmware checks should be kernel-aware (target /lib/modules) and accept
        compressed firmware variants.
      persistence_strategy:
      - Always log first to /run/initramfs/<project>/ (runtime source of truth).
      - If an unencrypted backup mount is available (e.g., /root/_backup), copy logs
        there immediately (timestamp + latest).
      - After unlock/boot, mirror logs to persistent /var/log/<host>/; on failure,
        emit a clear pointer to the backup location.
    tools_and_fallback_policy:
      intent: Initramfs is a minimal userspace; diagnostics must not depend on optional
        tools.
      must:
      - Tool availability must not be assumed; command inventory from penelope-initramfs-diag.log
        is the contract (OK/MISSING) and must guide the implementation.
      - 'MUST: Tool availability is domain-specific (live|chroot|initramfs). Per domain,
          check and deterministically log before use (present/missing).'
      - Parsing preferably tool-free (POSIX read-loops) or via /proc backends (e.g.
        /proc/net/route, /proc/net/tcp{,6}, /proc/uptime).
      - If a tool is to be used that is not guaranteed to be present (e.g. ping, ss,
        netstat, route, ethtool, head, tail, awk, sed, cut), it MUST be explicitly
        copied into the initramfs via an initramfs hook AND be marked in the log as
        copied/missing.
      - If an optional tool is missing, the result MUST be logged as "skipped(no <tool>)";
        it must never be fatal merely because a diagnostic tool is absent.
      should:
      - Check dropbear listening preferably via /proc/net/tcp{,6}; gateway via /proc/net/route;
        IPv4 via /run/net-*.conf or /proc/net/fib_trie.
      - Optional tools (e.g. ping) are purely diagnostic and must not introduce recovery
        semantics.
    template_and_macro_injection:
      purpose: Pattern for safe templating/macro injection into scripts and config
        files without breaking permissions or leaving placeholders behind.
      requirements:
      - Prefer in-place overwrite (write temp + cat/redirect) over mv/rename that
        can drop mode bits; re-apply chmod/chown deterministically after injection.
      - Use explicit sentinel comments around injected blocks so they are idempotent
        and easily replaceable.
      - 'MUST: When inject_block_into_file() updates previously managed content, pre-clean
        or normalize stale managed blocks first; do not rely on a second inject_block_into_file()
        call to refresh content after the original token/sentinel has been consumed.'
      - After injection: ensure_no_unexpanded_tokens and type-specific validation
          must run; failures that would leave an invalid persisted artefact must be
          fatal unless an explicit per-check downgrade is documented with rationale.
      - Avoid complex/nested heredocs where possible; if used, validate the generated
        artifacts on disk (not only the producer script).
      - 'MUST: Generated scripts must not depend on functions/variables of the producing
        install script; they must be self-contained or source penelope-common.sh.'
      recommended_structure:
        producer_flow:
        - render template/heredoc to target
        - apply placeholder substitutions (apply_placeholders)
        - pre-clean or normalize stale managed blocks / restore the expected injection
          token if needed
        - inject_block_into_file using sentinels
        - set mode/owner
        - ensure_no_unexpanded_tokens
        - validate artifact (shell/systemd/etc.)
        sentinel_example:
        - '# BEGIN MANAGED BLOCK'
        - '<OMITTED>'
        - '# END MANAGED BLOCK'
      notes:
      - For large/complex changes split into multiple patches and keep each injection
        site small and attributable.
      - Log the target path, the sentinel id, and the validator command/result.
    script_plus_common_library_bundle:
      purpose: Pattern for shipping an executable script together with a common library
        file that provides shared functions and policy checks.
      contract:
        bundle_files:
        - primary script (e.g., penelope-install-X.Y.Z.sh)
        - common library with stable name (e.g., penelope-common.sh)
        sourcing_convention:
        - SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        - source "${SCRIPT_DIR}/penelope-common.sh"
        naming_rules:
        - The common library filename in the bundle must remain stable (no version
          suffix in the sourced path).
        - Versioned copies (if needed) are archival only (e.g., under old/), never
          the primary source target.
      validation:
      - Both files must be executable/readable as appropriate and pass validate_shell_script
        (where applicable).
      - If the library changes, ensure backward compatibility for public helper functions
        or update all call sites in the same patch set.
      notes:
      - Keep the bundle self-contained: no implicit dependencies on cwd; always resolve
          relative paths via SCRIPT_DIR.
    idempotent_setup_update_semantics:
      purpose: Pattern for installers/provisioners that may be re-run safely (idempotent)
        and that separate setup from update operations.
      must:
      - Re-running the installer must not destroy existing state unexpectedly; destructive
        operations must be explicit and guarded.
      - When writing files, preserve/restore permissions deterministically and move
        previous on-disk revisions to an archive path (e.g., old/) when replacing
        (this refers to file backups, not script-version fallback).
      - All actions must log what changed (path, previous state, new state) and what
        was skipped.
      should:
      - Provide a fast iteration mode (e.g., initramfs-only refresh) guarded by strict
        whitelists and prohibitions.
      - Fail fast when validation or token hygiene fails in a way that would leave
        persisted state unclear or invalid; any downgrade requires an explicit per-check
        rationale.
      notes:
      - Prefer small, reversible steps; each patch should have a tight scope and clear
        rollback path.
    common_library_functions_and_override_contract:
      purpose: Pattern for designing and evolving common shell helper functions used
        by multiple scripts.
      api_contract:
        stability: Functions used across scripts are treated as a public API; changes
          must be backward compatible or updated at all call sites in the same patch
          set.
        naming: Use clear, verb-based names; avoid ambiguous globals; prefer passing
          values via args and returning via stdout/exit codes.
        error_handling: Do not mask return values (avoid SC2155 patterns); propagate
          failures unless explicitly best-effort.
        development_phase_rule: During active development, remove compatibility aliases
          and migration shims once all call sites are updated in the same patch set;
          keep the API surface minimal.
      override_rules:
      - Project-specific scripts may override behavior only via well-defined variables
        or wrapper functions documented in guidelines.
      - Avoid implicit sourcing order dependencies; if overrides are needed, document
        the required source order.
      examples:
      - 'validate_shell_script: choose validator by shebang; dash -n -> sh -n -> bash
        --posix -n'
      - 'ensure_no_unexpanded_tokens: fatal unless the caller documents an explicit
        downgrade with rationale'
      versioning:
        must:
        - 'If penelope-common.sh changes: use SemVer (MAJOR.MINOR.PATCH). Breaking/incompatible
          API changes -> increment MAJOR (e.g., 1.3.x -> 2.0.0). New backward-compatible
          functions -> increment MINOR (e.g., 1.3.x -> 1.4.0). Fixes or non-API changes
          -> increment PATCH (e.g., 1.3.1 -> 1.3.2).'
        - Keep the filename stable as penelope-common.sh; do not encode version in
          the filename used by source.
        cross_ref: 'Penelope-specific versioning rules: penelope_specific.common_library.parameters.common_library.versioning
          (canonical owner for Penelope SemVer details).'
        should:
        - Prefer using PENELOPE_COMMON_VERSION in at least one log/diagnostic marker
          to avoid SC2034 and to make runs auditable.
  windows_openssh:
    canonical_owner: general_rules.windows_openssh
    private_key_permissions:
    - Windows OpenSSH checks ACLs (NTFS); 'chmod' in Git Bash typically does not set
      these correctly.
    - Prefer placing private keys under '%USERPROFILE%\.ssh' and restricting permissions
      via 'icacls' to SYSTEM, Administrators, and the user.
    - The '.ssh' directory itself must not have broad principals (Everyone/Users/Authenticated
      Users) with write/read rights.
  shell_safety:
    set_flags:
    - Scripts must run with 'set -Eeuo pipefail'.
    - Scripts must not relax strict mode with 'set +e'; expected failures must be
      represented as guarded branches or explicit best-effort commands.
    sudo_handling:
    - No 'exec sudo <scriptname>' without an absolute/relative path that is guaranteed
      to exist.
    - 'Prefer: cleanly abort when not root (with clear message), or restart logic
      with ABSOLUTE path ($0) and preservation of environment variables.'
    - 'When restart logic is used: first check that ''sudo'' exists and that $0 is
      executable/findable.'
    err_trap_logging:
    - 'ERR trap may log ''BASH_COMMAND'' only sanitised: single-line, truncated (e.g.
      200-400 characters), without heredoc contents (heredoc omitted).'
    - On errors, never print entire script/heredoc blocks to the install log.
    pipefail_pitfalls:
    - 'With ''set -o pipefail'' do not build verification pipelines that interpret
      a missing match as an error and thus produce false negatives (classic: ''lsinitramfs
      | grep -m1 <PATTERN>'').'
    - 'Instead: buffer output (command substitution) and then ''grep -q'', or selectively
      disable pipefail locally in a subshell.'
guidelines_machine_readability:
  must:
  - The guidelines file must remain YAML-parseable at all times (no syntax/indent
    errors, no unbalanced quotes, no tabs).
  - Every change to penelope-guidelines must verify YAML parseability before delivery.
  - On every change to penelope-guidelines, the assistant must explicitly confirm
    in the response that yaml.safe_load on the delivered new guidelines file succeeded;
    otherwise the patch must not be delivered.
  should:
  - Run a short parse check in the CI/release flow (fail-fast).
  - 'Example Python check: python -c ''import yaml,sys; yaml.safe_load(open(sys.argv[1]));'' <guidelines.yaml>'
  - 'Example yq check: yq -e ''.'' <guidelines.yaml>'
  - 'On parse error: abort release/build (STRICT_VERIFY equivalent for guidelines).'
  guidelines_patch_self_check:
    canonical_owner: guidelines_machine_readability
    must:
    - Run yaml.safe_load on the newly generated guidelines file and confirm in the
      response.
    - Update meta.version and meta.previous_version consistently.
    - Verify that a versioned guidelines filename, if used, matches meta.version exactly
      and that meta.previous_version names the direct predecessor.
    - Name the patch scope (which sections were intentionally changed).
    - For cleanup/wording patches, explicitly confirm that no silent semantic change
      was intended.
    should:
    - Briefly diff for unintended obligation level changes (MUST/SHALL/SHOULD/MAY).
    - For structural patches, also check canonical owner/cross-ref fields.
penelope_specific:
  scope_boundary:
    canonical_owner: penelope_specific
    includes:
    - Project architecture, components, variables, paths, and artefacts
    - Heredoc/bundle generation, initramfs/dropbear/logging contracts
    - Penelope-specific runbooks, smoke tests, and release policy
    excludes:
    - General patch/review/shell rules (live under general_rules)
    references_general_rules:
    - collaboration_protocol
    - shell_safety
    - testing
    - code_review
    - upgrade_rules
    - generated_script_rules
    - doc_code_consistency
    - scenario_review_rules
    - documentation_markdown
    duplication_handling:
    - Penelope-specific rules may concretise general_rules but must not contradict
      them.
    - When both layers mention the same rule family, keep the generic rule canonical;
      Penelope-specific text is normative only for Penelope parameters, paths, artefacts,
      or runtime semantics.
    derived_layer_rule:
    - penelope_specific is the derived Penelope layer; do not restate general text
      without added project value.
    canonical_sections_for_project_topics:
      architecture_and_components: project_architecture
      variables_and_tokens: project_variables
      bundling_and_heredocs: bundling
      initramfs_unlock_and_logging: initramfs_dropbear_unlock
      release_and_bundle_policy: release_bundle_policy
      lifecycle_and_operation_model: script_operation_governance
      install_layout_and_storage_roles: install_layout_config_model
  script_quick_audit_mapping:
    based_on: general_rules.script_quick_audit
    project_specific_additions:
    - Initramfs/BusyBox environment: use only available tools or explicitly copy/log
        as skipped.
    - Heredoc-generated files: check token expansion and validate type-specifically.
    - Deliverables/patch names must follow Penelope conventions (artefact versioning
      + old-to-new.patch).
    - Continue-series baseline/expiry behaviour is owned by general_rules.preflight_for_new_script_patch_series
      and general_rules.collaboration_protocol; do not restate it here with different
      semantics.
    - For overlaps, check structure_and_scope.known_overlaps_registry and conflict_resolution_order;
      do not duplicate generic rules.
    placement_rule:
    - Keep only Penelope-specific additions here; change generic criteria in general_rules.script_quick_audit.
    wording_clarity_and_placement_mapping:
      canonical_owner: penelope_specific
      references_general_rule: general_rules.script_quick_audit.wording_clarity_and_placement
      penelope_specific_additions:
      - Penelope file name patterns and deliverables remain project-specific (e.g.
        penelope-install-X-to-Y.patch).
      - Initramfs/Dropbear/installer validation policy meanings may only be normatively
        defined in penelope_specific; general_rules may only name them as a category.
      - For continue-series baseline/expiry behaviour, use the canonical generic rules
        and add Penelope-specific payload only when a concrete project artefact or
        workflow detail must be named.
  install_strictness_and_abort_policy:
    canonical_owner: penelope_specific
    applies_to:
    - penelope-install and install/initramfs-related scripts generated from it
    principles:
    - Strict checks should always run by default; severity (fatal/warn/best-effort)
      is to be set explicitly per check.
    - Problems that can endanger later stable operation or SSH unlock are fatal and
      must not run as warn-only.
    - Debug/diagnostic code must not indirectly lower the severity classification
      by providing missing initialisation/fallbacks.
    fatality_boundary_examples:
      fatal:
      - Everything that endangers bootability, initramfs function, dropbear start,
        network in initramfs, or cryptroot-unlock/wrapper path.
      - Inconsistencies that can impair the reliability of later SSH unlock or its
        security-relevant configuration.
      - Errors that bring persisted Penelope configuration/artefacts into an unclear
        or partial state when doing so endangers operability.
      warn_only_possible_with_explicit_rationale:
      - Observability/comfort topics only when it is proven that later operation and
        SSH unlock are not endangered.
    review_requirements:
    - For every new warning in the install path, explicitly check and document why
      it does not violate the abort boundary.
    - For refactorings (e.g. strict_mode removal), clearly distinguish between "checks
      always run" and "severity class per check".
    post_install_manual_steps:
      canonical_owner: penelope_specific.install_strictness_and_abort_policy
      rules:
      - 'MUST: AnyDesk is configured without automatic unattended password; no ANYDESK_PW
        variable in the installer. Full access/unattended is set manually in the GUI
        after the first GNOME login (set-password + "no confirmation").'
      - 'MUST: Firstboot is not started automatically as a systemd service. Operator
        runs penelope-firstboot.sh manually in the terminal after the first admin
        user login (GUI context).'
      - 'MUST: Automatically triggered initramfs-log persistence remains a separate
        post-boot service path (`penelope-initramfs-logcopy.service` -> `/usr/local/sbin/penelope-copy-initramfs-logs.sh`);
        generated helper headers/comments and operator docs must not conflate it with
        the manual `${TARGET_HOST}-firstboot.sh` step.'
      - 'SHALL: The installer''s final operator-facing completion output must mirror
        the canonical post-install sequence explicitly enough to prevent drift: reboot
        -> manual `${TARGET_HOST}-firstboot.sh` -> early verify -> backup-setup ->
        samba-setup -> late verify. A plain `sudo reboot` ending is insufficient
        once these steps are mandatory in the current runbook.'
  install_strictness_refactoring_path:
    canonical_owner: penelope_specific
    based_on: general_rules.strictness_refactoring_policy
    applies_to:
    - penelope-install
    - penelope-common (only when shared helpers for severity/checks are introduced
      or adjusted)
    project_specific_requirements:
    - Risks to later stable operation or SSH unlock must not be hidden by toggle=0;
      such checks are to be classified as fatal.
    - strict_mode-like global lax-mode switches (that set all checks to warn-only)
      are to be treated as migration artefacts until their uses are inventoried and
      converted per check to explicit severity classes.
    - 'Legacy documentation or comments that still describe a Penelope installer runtime
      toggle named STRICT_VERIFY must be treated as stale until aligned. The current
      target model is: checks always run, severity is defined per check, and no generic
      operator lax-mode toggle is assumed.'
    - Debug/diagnostic code must not count as evidence of robustness during the inventory
      if it influences the normal path.
    refactoring_sequence:
    - Align docs and guidelines with target model (checks always, severity per check).
    - Inventory uses in installer/common and classify each location.
    - Initially only deprecate legacy toggle (e.g. notice/ignored) before removing
      branches.
    - Reduce branches step by step; per patch only clearly delimited groups of checks.
    - Plan expensive end-to-end tests (install/reboot/ssh-unlock) only after cheap
      validations and log checks per step.
    review_outputs:
    - Change plan with affected toggle locations
    - Classification table per check/branch
    - Explicit list of fatal checks with SSH unlock/operation reference
  script_operation_governance:
    canonical_owner: penelope_specific
    applies_to:
    - penelope-install
    - penelope-backup-setup
    - penelope-samba-setup
    intent:
    - Define one cross-script lifecycle model for Penelope while keeping script-specific
      interfaces and destructive boundaries explicit.
    - Keep the operator vocabulary consistent across scripts: fresh bring-up, inspect,
        apply config, upgrade tooling, rotate secrets, and recover/reattach are the
        canonical operation classes.
    core_strategy:
      config_and_logic_separation:
      - Operator-editable configuration SHOULD live outside the program logic in dedicated
        files or trees instead of inline FIRST EDIT sections when the script reaches
        a stable day-2 domain model.
      - Credentials SHOULD be kept separate from topology/config values, ideally as
        individual secret files or another equally explicit secret-bearing surface.
      - When legacy inline edit sections still exist, treat them as a transitional
        model rather than the preferred long-term design.
      fresh_bring_up_rule:
      - Fresh bring-up SHOULD use an explicit scaffold/init step whenever the script
        externalizes operator-managed config or secret placeholders into files.
      - The scaffold/init step SHOULD seed placeholders and templates, then exit before
        the first real destructive or verify/apply action.
      live_state_rule:
      - Once a running system already has effective live config and secret material,
        routine reruns/upgrades MUST reuse that live state as the canonical source
        of truth unless a narrower explicit reset/recreate interface is chosen.
      - Restored live config from backup MUST be treated the same way as locally pre-existing
        live config; do not silently replace it with shipped defaults.
      upgrade_and_schema_rule:
      - Routine upgrades MUST focus on tooling refresh, validation, and narrowly scoped
        config extension/repair instead of ad-hoc structural rewrites.
      - Structural format changes belong in one explicit, named upgrade seam keyed
        by an equally explicit schema/version marker when the script owns a structured
        operator config surface.
      secret_safety_rule:
      - Routine reruns/upgrades MUST NOT silently rotate, recreate, or overwrite non-empty
        effective secret material.
      - Secret rotation is a separate explicit operator action, ideally via a dedicated
        command or tool.
      recovery_boundary_rule:
      - Non-secret recovery bundles or staged recovery copies are tooling/workspace
        artefacts only and MUST NOT be treated as the canonical storage location for
        effective live config or secrets.
      - Recovery/reattach flows SHOULD restore live operator state to its canonical
        target path first, then use sanitized recovery tooling as temporary workspace
        only.
    operation_classes:
      fresh_bring_up:
      - Establish a new Penelope-managed domain on a fresh target or after an explicit
        reset/scaffold step.
      inspect:
      - Read or validate the declared/effective model without destructive provisioning,
        secret rotation, or implicit apply side effects.
      apply_config_changes:
      - Reconcile operator-edited config/secret inputs into the managed live state
        of an already installed domain.
      upgrade_tooling:
      - Install a newer bundle version or refresh generated artefacts while preserving
        established operator state unless an explicit reset/recreate interface says
        otherwise.
      rotate_secrets:
      - Change effective credentials intentionally and explicitly; never as a hidden
        side effect of a routine rerun.
      recover_or_reattach:
      - Reattach tooling to restored live state or recover a domain by restoring its
        canonical config/secrets first and then rerunning the owning tool in a non-destructive
        reuse mode.
    operator_facing_consistency_rules:
    - Penelope SHOULD reuse the same operation vocabulary across scripts even when
      the concrete subcommands or flags differ.
    - Documentation and completion text MUST distinguish clearly between fresh bring-up,
      upgrade tooling, apply-config, and secret-rotation paths.
    - Do not describe a script as a general in-place updater when its canonical role
      is still provisioning/reinstall.
    script_role_matrix:
      penelope_install:
        canonical_role:
        - penelope-install is the host provisioning/reinstall owner, not the general-purpose
          day-2 config-apply tool for running systems.
        - Non-destructive install-bundle behavior on running systems MUST stay behind
          explicitly named and narrowly allowlisted planes.
        preferred_operation_classes:
        - fresh_bring_up
        - recover_or_reattach
        restricted_operation_classes:
        - apply_config_changes is not the normal role of a plain penelope-install
          rerun.
        - upgrade_tooling on a running system is allowed only through explicitly named
          non-destructive install planes such as initramfs-only or managed-artifacts-only.
      penelope_backup_setup:
        canonical_role:
        - penelope-backup-setup is the rerunnable domain owner for the backup stack
          on an already installed system.
        preferred_operation_classes:
        - fresh_bring_up
        - upgrade_tooling
        - apply_config_changes
        - recover_or_reattach
        restricted_operation_classes:
        - rotate_secrets remains an explicit operator action and MUST NOT be folded
          into a normal rerun.
      penelope_samba_setup:
        canonical_role:
        - penelope-samba-setup is the rerunnable domain owner for the managed Samba
          model on an already installed system.
        preferred_operation_classes:
        - fresh_bring_up
        - inspect
        - apply_config_changes
        - upgrade_tooling
        - rotate_secrets
        - recover_or_reattach
        restricted_operation_classes:
        - Routine Samba day-2 actions MUST remain non-destructive at the OS/data level
          unless a future dedicated cleanup interface is introduced explicitly.
    cross_reference_detailed_sections:
    - install_operation_planes
    - backup_upgrade_rules
    - samba_upgrade_rules
  install_operation_planes:
    canonical_owner: penelope_specific
    applies_to:
    - penelope-install
    intent:
    - Keep the destructive provisioning plane explicit while exposing only narrow,
      explicitly named non-destructive install-bundle planes on running systems.
    current_contract:
      destructive_default:
      - A normal penelope-install run remains the destructive install/reinstall path
        with partitioning/filesystem semantics unchanged.
      initramfs_only_plane:
      - '`--initramfs-only` is the narrow non-destructive day-2 / diagnostic plane
        inside penelope-install.'
      - It MUST be limited to initramfs/Dropbear refresh and validation on a plausible
        existing target system (running host or prepared chroot).
      - It MUST NOT require CRED_MASTER_PW or CRED_LOGIN_PW to be changed away from
        change-me, because that mode does not consume the install-time FIRST EDIT
        secrets.
      - It MUST explicitly log FAST_ITERATION_MODE=1 and the skipped destructive/install
        planes.
      - It MUST run update-initramfs plus lsinitramfs/inventory evidence and log a
        short updated-path list.
      managed_artifacts_only_plane:
      - '`--managed-artifacts-only` is a separate non-destructive install-bundle plane
        for a strict allowlist of installer-owned generated target artifacts.'
      - It MUST require a plausible installed Penelope target context and MUST refuse
        ambiguous Live-USB/provisioning contexts.
      - It MUST explicitly log FAST_ITERATION_MODE=1, the concrete artifact allowlist,
        and the skipped destructive/install planes.
      - It MUST NOT require CRED_MASTER_PW or CRED_LOGIN_PW to be changed away from
        change-me, because that mode does not consume the install-time FIRST EDIT
        secrets.
      - 'Phase 1 allowlist: `/etc/ssh/sshd_config.d/50-penelope-hardening.conf`, `/usr/local/sbin/penelope-rotate-masterpw-dropbear.sh`,
        `/usr/local/sbin/penelope-verify-security.sh`, `/usr/local/sbin/${TARGET_HOST}-firstboot.sh`,
        `/usr/local/sbin/penelope-copy-initramfs-logs.sh`, `/bin/penelope-cryptroot-unlock-wrapper`,
        `/etc/dropbear/initramfs/dropbear.conf`, `/etc/initramfs-tools/scripts/init-premount/dropbear`.'
      - It MUST rebuild initramfs only when one of the allowlisted initramfs-owned
        artifacts changed, and MUST persist a changed/unchanged manifest plus lsinitramfs
        evidence when a rebuild occurred.
      - It MUST NOT rewrite `/etc/dropbear/initramfs/authorized_keys` or silently
        rotate Dropbear/LUKS secrets.
      verify_layout_contract_plane:
      - '`--verify-layout-contract` is a separate non-destructive install preflight
        plane for role/profile/sizing verification before a destructive reinstall/preserve
        run.'
      - It MAY read the operator-edited install layout config and current disk state,
        but MUST stop before confirmation, repartitioning, mkfs, luksFormat, debootstrap,
        or other destructive install steps.
      - It MUST reuse the same recreation-policy parsing and profile-verification
        scaffold that the destructive install/reinstall path uses before destructive
        steps.
      - It MUST print the resulting install plan and persist a small manifest/log
        bundle for operator review.
      - It MUST NOT require CRED_LOGIN_PW to be changed away from change-me; CRED_MASTER_PW
        SHALL be required when preserved encrypted roles must be verified against
        existing LUKS targets.
    non_goals:
    - Do not silently broaden a normal penelope-install rerun into a generic in-place
      updater for running systems.
    - Do not use `--initramfs-only` as a backdoor for partitioning, mkfs, luksFormat,
      debootstrap, or grub-install.
    - Do not use `--managed-artifacts-only` as a shortcut for partitioning, reinstall,
      arbitrary host-policy rollout, or secret rotation.
    future_expansion_rule:
    - If Penelope later expands the broader non-destructive install-bundle plane,
      keep it behind its own explicit interface/allowlist and documentation instead
      of stretching `--initramfs-only` or silently broadening the phase-1 managed-artifacts
      contract.
  install_layout_config_model:
    canonical_owner: penelope_specific
    applies_to:
    - penelope-install
    intent:
    - Define the canonical operator-facing storage-role vocabulary separately from
      the physical install layout profile that realizes it.
    - Move disk/partition/sizing choices toward operator-editable install config without
      turning them into routine day-2 apply-config inputs on a running system.
    logical_storage_roles:
    - /boot/efi
    - /boot
    - /
    - /home
    - /_archive
    - /_backup
    core_rules:
    - The canonical Penelope storage contract is defined first by these logical roles,
      not by one example pair of disk capacities.
    - Disk selection, partition placement, and sizing policy belong to the operator-edited
      install/provisioning config surface.
    - While inline installer variables still exist for these values, treat them as
      a transitional representation of install config rather than the preferred long-term
      model.
    - Physical realization SHOULD be expressed through explicit install layout profiles
      (for example single-disk, two-disk, later additional explicit profiles) instead
      of hard-coding one hardware example into project semantics.
    - The shipped current layout profile and its sizing defaults MUST be documented
      as implementation-specific defaults, not as immutable Penelope architecture
      law.
    - The current shipped default MAY name one concrete operator-default hardware
      example (currently the two-disk profile with an approx. 2 TB system/home disk
      plus an approx. 4 TB archive/backup disk), provided the guidelines and documentation
      keep that example clearly subordinate to the general roles-and-profiles model.
    destructive_plane_boundary:
    - Install layout config is consumed by the destructive provisioning/reinstall
      plane of penelope-install and MAY also be read by a narrower explicit verification-only
      preflight interface.
    - Non-destructive install planes such as --initramfs-only and --managed-artifacts-only
      MUST NOT evaluate, apply, or reinterpret disk/partition/sizing config.
    - A verification-only preflight plane MAY interpret install layout config and
      current disk state, but it MUST remain strictly non-destructive.
    recovery_and_restore_alignment:
    - Recovery, backup, and operator documentation SHOULD speak in terms of logical
      storage roles and mountpoints first, then map them to the current shipped layout
      profile where needed.
    current_phase_1_direction:
    - Phase 1 may introduce an explicit layout-profile/config seam before broader
      profile support exists; failing loudly for unsupported future profile names
      is acceptable and preferred over implicit guessing.
    current_phase_2_direction:
    - A narrow operator-edited install layout config file is an acceptable next seam,
      provided it is explicitly scoped to the destructive provisioning/reinstall plane.
    - The first external layout config schema MAY remain deliberately small (for example
      profile selector, system/data disk paths, and current shipped sizing defaults)
      before broader profile support exists.
    - The installer SHOULD be able to scaffold a template for this config explicitly
      instead of requiring blind manual transcription from inline defaults.
    - If an external layout config file is supported, unsupported profile names MUST
      fail loudly and there MUST be no silent fallback guessing.
    - Non-destructive install modes such as `--initramfs-only` and `--managed-artifacts-only`
      MUST NOT read or evaluate the install layout config file.
    current_phase_3_direction:
    - The first real profile expansion SHOULD be `single-disk` plus the existing `two-disk`,
      while keeping the canonical logical storage roles unchanged.
    - The shipped installer/template set MAY continue to default to the operator's
      current primary hardware profile (currently `two-disk`) even while additional
      profiles are introduced.
    - Before selective preserve/recreate is enabled for `single-disk`, the installer
      MAY temporarily restrict `single-disk` to full recreation only, provided it
      fails loudly and documents the restriction.
    - The external layout config schema MAY add only the minimum additional sizing
      keys needed for the first extra shipped profile (for example `HOME_SIZE_GIB`
      for `single-disk`) instead of prematurely generalising to a full custom layout
      language.
    - Future profiles such as `custom` SHOULD remain explicit reserved seams until
      their role-placement and preserve/recreate semantics are concretely designed.
    current_phase_4_direction:
    - '`single-disk` selective preserve/recreate MAY be enabled once it is implemented
      as a fixed-layout-only path.'
    - Fixed-layout-only means: same selected profile, unchanged role-partition order/mapping,
        no repartitioning, no resizing, and successful verification of the existing
        role layout before destructive steps begin.
    - In `single-disk` preserve mode, requested config/sizing values are not just
      desired state; they are also a verification contract against the already existing
      on-disk layout.
    - If the requested `single-disk` run implies profile drift, placement drift, sizing
      drift, or unverifiable preserved role targets, the installer MUST abort loudly
      instead of guessing or migrating in place.
    - The operator-facing preserve vocabulary SHOULD remain role-based (`system`,
      `home`, `_archive`, `_backup`) even when the physical layout is a shared single
      disk.
    current_phase_5_direction:
    - Once one profile has a safe fixed-layout preserve path, the installer SHOULD
      lift the verification/refusal mechanics into a reusable profile-verification
      scaffold instead of keeping them as a one-off special case.
    - Profile-specific preserve verification MUST fail loudly when no explicit contract
      is registered; do not silently infer a nearly matching layout.
    - Reusable verification scaffolding SHOULD separate: expected verification targets,
        expected partition count, expected PARTLABEL mapping, expected size contract,
        and profile-specific refusal/help text.
    - Future profiles such as `four-disk` or later named profiles SHOULD plug into
      the same pre-destructive verification path once their concrete contracts are
      designed.
    current_phase_6_direction:
    - Once the reusable profile-verification scaffold exists, the shipped default
      `two-disk` selective preserve/recreate path SHOULD also use it instead of relying
      only on historical partition-presence checks.
    - In `two-disk` selective preserve/recreate, fixed-layout verification SHOULD
      run only for preserved disks; disks selected for full recreation MAY still be
      repartitioned.
    - In `two-disk` preserve mode, requested config/sizing values for a preserved
      disk are not just desired state; they are also a verification contract against
      the already existing on-disk layout of that preserved disk.
    - If the requested `two-disk` preserve run implies sizing drift, missing PARTLABELs,
      partition-count drift, or unverifiable preserved targets on a preserved disk,
      the installer MUST abort loudly instead of repartitioning that preserved disk
      heuristically.
    current_phase_7_direction:
    - Once the profile-verification scaffold is used by the shipped `single-disk`
      and `two-disk` preserve paths, Penelope SHOULD expose a narrow non-destructive
      `--verify-layout-contract` preflight that runs the same verification and plan-rendering
      logic without destructive steps.
    - '`--verify-layout-contract` MAY read the external install layout config file,
      because that mode is verification-only rather than a running-system maintenance
      plane.'
    - '`--verify-layout-contract` MUST persist a small manifest/log bundle so the
      operator can compare requested layout intent with actual disk reality before
      a real reinstall/preserve run.'
    - If preserved encrypted roles are part of the requested policy, `--verify-layout-contract`
      SHOULD verify them against the provided `CRED_MASTER_PW` instead of pretending
      that placeholder credentials are sufficient.
    current_phase_8_direction:
    - The first shipped multi-disk expansion beyond the default `two-disk` profile
      MAY be `three-disk`, interpreted canonically as `system` on DISK_SYS, `home`
      on DISK_HOME, and `archive+backup` on DISK_DATA.
    - '`three-disk` selective preserve/recreate MAY be enabled once it is implemented
      as a verification-first fixed-layout path.'
    - In `three-disk` preserve mode, the system disk MAY remain always-recreated,
      while preserved `home` and/or data disks must verify against the registered
      three-disk fixed-layout contract before destructive steps begin.
    - In `three-disk` selective preserve/recreate, preserved disks MUST NOT be repartitioned
      or resized during the preserve run; fully recreated disks MAY still be repartitioned.
    - If the requested `three-disk` preserve run implies profile drift, sizing drift,
      partition-count drift, missing PARTLABELs, or unverifiable preserved role targets
      on a preserved disk, the installer MUST abort loudly instead of guessing or
      migrating in place.
    current_phase_9_direction:
    - Phase 9 is currently intentionally skipped as a numbered roadmap slot; there
      is no separate shipped transition contract between the first `three-disk` preserve
      direction and the later fixed-layout refusal/reporting refinements.
    - A future patch MAY reuse the phase-9 slot only if it introduces a genuinely
      separate layout-contract step rather than merely elaborating phase 8 or phase
      10 text.
    current_phase_10_direction:
    - Fixed-layout refusal paths SHOULD report, in one operator-facing message, the
      failing profile, the concrete drift/unverifiable reason, a one-line contract
      summary, and the safe next step (keep the preserved layout unchanged, switch
      to `RECREATION_TARGET_LIST=all`, or use a separate migration workflow).
    - '`--verify-layout-contract` SHOULD persist the same contract summary, preserved
      verification targets, and next-step hint in its manifest/log output whenever
      fixed-layout verification is required.'
    current_phase_11_direction:
    - The next shipped named profile MAY be `four-disk`, interpreted canonically as
      `system` on DISK_SYS, `home` on DISK_HOME, `archive` on DISK_ARCHIVE, and `backup`
      on DISK_BACKUP.
    - The first shipped `four-disk` step MAY remain provisioning/full-recreation-only
      while the profile shape itself is established in the installer, documentation,
      and layout-config template.
    - If `four-disk` is shipped before selective preserve/recreate semantics are implemented,
      the installer MUST fail loudly when the operator requests a non-`all` recreation
      policy for `four-disk`.
    current_phase_12_direction:
    - '`four-disk` selective preserve/recreate MAY be enabled once it is implemented
      as a verification-first fixed-layout path.'
    - In `four-disk` preserve mode, the system disk MAY remain always-recreated, while
      preserved `home`, `archive`, and/or `backup` disks must verify independently
      against the registered four-disk fixed-layout contract before destructive steps
      begin.
    - In `four-disk` selective preserve/recreate, preserved disks MUST NOT be repartitioned
      or resized during the preserve run; fully recreated disks MAY still be repartitioned.
    - If the requested `four-disk` preserve run implies profile drift, sizing drift,
      partition-count drift, missing PARTLABELs, or unverifiable preserved role targets
      on a preserved disk, the installer MUST abort loudly instead of guessing or
      migrating in place.
    current_phase_13_direction:
    - '`--verify-layout-contract` SHOULD persist requested recreate targets, requested
      preserve targets, and fixed-layout verification targets explicitly in role vocabulary
      so the operator can compare requested intent with current disk reality at a
      glance.'
    - Whenever fixed-layout verification is required, the persisted verify manifest/log
      output SHOULD enumerate, per verification target, the concrete disk path, role
      summary, expected partition count, expected PARTLABELs, and size-contract summary.
    - Fixed-layout refusal paths SHOULD report preserve targets and verification targets
      in addition to the concrete drift reason, one-line contract summary, and safe
      next step.
  review_checklist_per_patch:
    canonical_owner: penelope_specific
    extends: general_rules.collaboration_protocol.review_checklist_per_patch
    purpose: Penelope-specific review checklist items to append to the generic versioning/deliverables
      checks on every intermediate patch.
    checklist:
    - '[ ] Heredocs/scripts: after every shell heredoc, ensure_no_unexpanded_tokens
      + validate_shell_script (dash/sh/bash) executed.'
    - '[ ] Non-shell heredocs: ensure_no_unexpanded_tokens + type-specific validator
      (e.g. validate_systemd_unit) executed.'
    - '[ ] Common library: if penelope-common.sh changed, PENELOPE_COMMON_VERSION
      bumped by +1.'
    - '[ ] Initramfs observability: net.state keys unchanged/compatible (if affected).'
    - '[ ] Initramfs observability: SUMMARY NET+DROPBEAR contract unchanged (if affected)
      and derived exclusively from net.state.'
    - '[ ] Initramfs POSIX: initramfs scripts remain POSIX-sh (no bashisms).'
    - '[ ] Initramfs tools: no head/tail/awk/sed/cut dependencies in initramfs (or
      explicitly copied + logged).'
    - '[ ] Initramfs pipelines: no fragile grep/head pipes; no-match must not trigger
      a hard error.'
    - '[ ] Initramfs logs: contain boot_id + install/common version header; net.state
      contains the same meta keys.'
    - '[ ] Initramfs tools/fallback policy: if an optional tool (ping/ss/netstat/route/ethtool/head/tail/awk/sed/cut)
      is used, it is either explicitly copied into the initramfs + logged as copied/missing,
      or the result is marked as skipped(no <tool>); /proc fallbacks are preferred.'
    - '[ ] Console operator hints: contain no secrets (no private keys, no passwords,
      no complete authorized_keys).'
    - '[ ] Diagnostics preservation: no removals/abbreviations of logs without replacement,
      especially on debug patches.'
    - '[ ] For single-file setup bundles with generated tools, confirm that every
      newly or currently called setup-runtime helper exists in the setup-runtime layer,
      not only inside generated tool templates.'
    - '[ ] If a top-level apply/install phase was touched, name the touched phase
      and the reviewed phase_stopline explicitly.'
    - '[ ] If a generated-tool install path was touched, provide one cheap path_precheck
      that reaches the named phase_stopline and proves the rendered artifacts are
      actually produced/validated there.'
  preflight_for_new_penelope_script_patch_series:
    canonical_owner: penelope_specific
    based_on: general_rules.preflight_for_new_script_patch_series
    intent:
    - Keep this section compact: only Penelope-specific additions belong here.
    - Do not restate generic baseline/versioning/expiry rules already owned by general_rules.
    project_specific_additions:
    - Deliverables must follow Penelope naming conventions (for example penelope-<artifact>-<old>-to-<new>.patch
      plus the new full version).
    - For heredoc-generated scripts, name planned standalone extraction/validation
      only when it materially improves review or validation.
    - For initramfs/BusyBox-relevant scripts, state early whether POSIX/tool-subset
      rules are affected.
    - For expensive tests (install/reboot/unlock), name the cheap evidence for the
      current step first and the deferred expensive target explicitly.
    - For Penelope patch series, the initial series_guideline_scan SHOULD name at
      minimum any relevant artefact-language policy, assembled-workdir/runtime contract,
      generated-artifact validation depth, external-config handling expectations,
      and documentation/code/operator-surface sync duties.
    - For Penelope series likely to span a thread switch, the initial scan SHOULD
      also identify which strategic decisions, rejected directions, deferred insights,
      and expensive truth-surface plans must be preserved as series_continuation_state.
    - For Penelope series with repeated regressions or suspicious local follow-up fixes, the initial scan SHOULD explicitly name whether detective_review_heuristics must be applied as a first-class review mode rather than only as an implicit style.
    - For Penelope series with repeated small governance or operator-surface calls,
      the initial scan SHOULD also note whether a series_decision_log will be needed
      to preserve those calls across a thread switch.
    - For single-file setup bundles with embedded generated tools (for example penelope-backup-setup),
      decide explicitly whether the series starts in ordinary patch mode or immediately
      as a subsystem_audit_block.
    - For any touched apply/install phase, name the intended phase_stopline early
      and use it consistently in predecessor checks and cheap proofs.
    cross_reference:
    - Generic baseline, predecessor, expiry, and deliverables discipline are owned
      by general_rules.preflight_for_new_script_patch_series and general_rules.collaboration_protocol.
    - Use this Penelope section only for project-specific additions, not as a second
      copy of the generic start ritual.
  thread_transition_handoff:
    canonical_owner: penelope_specific
    based_on: general_rules.collaboration_protocol.thread_hygiene_and_handoff
    intent:
    - Define only the minimal Penelope-specific payload for a safe thread-transition
      handoff.
    - Preserve not only file baselines but also the still-governing continuation memory
      of an active Penelope series.
    - Generic handoff structure, baseline/expiry discipline, and compactness rules
      remain owned by general_rules.
    required_penelope_fields:
    - Exact filenames for all required Penelope hard baselines of the next patch_block.
    - Current governing full versions for install, backup-setup, samba-setup, common,
      guidelines, and documentation when they are within the active review scope.
    - When the continuation depends on the operator-held file set because newer artefacts
      were not downloadable, name that operator-held set as the initial Penelope upload
      baseline explicitly instead of implying availability of newer thread-local files.
    - Open Penelope findings/TODOs and any operator-decided Penelope assumptions or
      overrides that the next patch_block depends on.
    - When the active Penelope series runs in a non-default compatibility mode (for
      example explicit current-only/latest-only pre-release work), the handoff MUST
      restate that compatibility_stance and name the governing operator decision or
      local rule snapshot.
    - If relevant, a strict split between the last verified Penelope hard baseline
      and any claimed but unverifiable follow-on state.
    - Last operator-held Penelope fullfiles when download/link problems or thread
      fragility make the newest generated artefacts uncertain.
    - Deferred-but-valuable Penelope follow-ups, future patch-series buckets, and
      explicitly rejected/superseded directions when later continuation could otherwise
      lose or accidentally revive them.
    - Any still-open legacy_census findings that remain intentionally deferred and
      materially affect the next patch_block, so they are not silently mistaken for
      accepted long-term design.
    - Reconstruction notes only for Penelope-specific missing intermediate states
      that the next thread might otherwise silently assume.
    - When stable thread- or series-local Penelope policies govern the next patch_block,
      include a compact policy snapshot under the existing generic handoff sections
      rather than inventing a new ad-hoc handoff shape.
    - When the handoff describes a regression chain, suspicious predecessor patch, or likely thread-fragile continuation, include a compact detective snapshot naming the most suspicious predecessor step(s), the most likely omitted path segments, and any ballast or stale assumptions that the next thread should re-check before patching.
    - 'MUST: When the next thread is expected to continue an active Penelope patch
      series, the handoff state whether the next thread should begin with a fresh
      series_guideline_scan or may reuse an already valid one.'
    - 'MUST: When a current series_compliance_matrix already exists or can be inferred
      from the active rules, the handoff carry a compact snapshot of still-open material
      compliance items relevant to the next patch_block.'
    - 'MUST: Carry a compact series_continuation_state for any active Penelope series
      that the next thread is expected to continue.'
    - 'MUST: When the active series accumulated small but governing decisions that
      are easy to lose, carry a compact series_decision_log in the handoff rather
      than expecting the next thread to recover them from conversational texture.'
    - 'MUST: When the active pre-release line already has known not-yet-landed items
      that are believed necessary before release or before a release-candidate sign-off,
      carry a compact series_prerelease_target_register in the handoff rather than
      leaving those items as vague deferred follow-ups.'
    - 'MUST: When a Penelope reconstructed_working_baseline or canonical merge becomes
      the accepted continuation base, the handoff explicitly name next_linear_base,
      next_expected_patch, and any older same-line artefacts that are now superseded/non-predecessor.'
    continuation_state_minimum:
    - Accepted current strategy/working mode decisions that still govern the next
      patch block.
    - Accepted architecture or operator-surface decisions that should not be silently
      re-litigated in the next thread.
    - Explicitly rejected or superseded directions that must not be accidentally revived.
    - Deferred-but-valuable insights with enough reason/context to be resumed deliberately
      later.
    - The validation strategy currently in force (for example assembled-workdir smokes,
      real entrypoint checks, expensive truth surfaces deferred).
    - The next expensive or authoritative truth surfaces still pending (for example
      live install/reboot/unlock/operator test).
    - Any known open compliance findings that are still active and not merely cosmetic.
    decision_log_minimum:
    - Small but governing decisions that would be easy to forget because they are
      narrower than architecture but stronger than mere style preferences.
    - Decisions about when manual merge is preferred over automation, when `--force`
      is required, or when an existing effective config remains canonical.
    - Explicit blocker-vs-follow-up classifications that would change the next patch
      choice or pre-live-test order if silently lost.
    - Any accepted non-goal for the active series that the next thread might otherwise
      silently reopen.
    prerelease_target_register_minimum:
    - Any not-yet-landed item already judged necessary before first release or before
      release-candidate sign-off.
    - The classification for each item (for example must_land_before_release, release_candidate_gate,
      or deferred_post_release).
    - The current status for each item (for example open, in_progress, pending_gate,
      passed, or superseded).
    - A short reason why the item still matters and what kind of completion would
      count as done enough for the current release line.
    - Any item that was once treated as a mere deferred follow-up but has since been
      reclassified as release-critical.
    - A note when the current likely next patch bucket intentionally differs from
      the prerelease target order, so the drift is explicit rather than silent.
    handoff_reentry_protocol_contract:
    - 'MUST: Provide a short handoff_reentry_protocol that tells the next thread how
      to regain the correct governing baseline, continuation state, and precheck discipline
      before the next content-changing patch block.'
    - 'MUST: The handoff_reentry_protocol distinguish file/baseline verification from
      continuation-state verification; a new thread must not assume that correct uploads
      alone imply correct strategic memory.'
    - 'SHALL: Include a copyable next-thread prompt or equivalent compact restart
      checklist when operator workflow would otherwise depend on remembering several
      separate re-entry steps.'
    policy_snapshot_rule:
    - The snapshot SHALL contain only still-governing Penelope local policy decisions
      that materially affect the safe continuation of the next patch_block.
    - Place the snapshot content under the generic handoff sections "Working mode
      / hard rules in force" or "Reconstruction notes / still-governing assumptions"
      unless the operator explicitly requests a different placement.
    - Do not restate generic rules already owned by general_rules unless a Penelope-local
      narrowing, override, or stronger project stance is the active governing rule.
    documentation_sync_handoff_rule:
    - If documentation sync was intentionally deferred, the handoff MUST classify it explicitly as one of: baseline_still_valid,
        version_table_sync_deferred, or operator_relevant_doc_follow_up_required.
    - Treat version_table_sync_deferred as a deferred sync note, not as a contradiction
      or blocker, unless the next patch_block depends on the concrete current version
      literals.
    - Treat operator_relevant_doc_follow_up_required as an open required follow-up,
      not as an optional polish item.
    recommended_policy_snapshot_topics:
    - Current compatibility stance for the active Penelope series when it differs
      from the generic default (for example dev/non-production no-compatibility mode).
    - Canonical secret placeholder policy and any still-governing secret-management
      contract for install/backup/samba.
    - Produced-artefact language/stylistic constraints when they materially govern
      the next patch_block.
    - The active series_guideline_scan or a note that the next thread must refresh
      it before new content-changing work.
    - The active series_compliance_matrix snapshot, including still-open material
      compliance items (for example language compliance, workdir/runtime-contract
      drift, or documentation/code/operator-surface mismatch) when relevant.
    - The active series_continuation_state snapshot: accepted decisions, rejected
        directions, deferred insights, current validation strategy, and next expensive
        truth surfaces.
    - The active series_decision_log snapshot when the current series already accumulated
      small but governing decisions that are not fully obvious from the larger continuation-state
      headings.
    - The active series_prerelease_target_register snapshot when the current pre-release
      line already has known not-yet-landed items that must survive the thread switch
      as explicit release goals.
    - Documentation TOC or structure discipline when recent documentation patches
      depend on it remaining explicit and synchronised.
    - Documentation sync state when a Penelope series intentionally deferred a pure
      version-list update or still owes an operator-relevant documentation follow-up.
    - Legacy-census findings or intentionally deferred legacy removals when they are
      still governing the next patch_block.
    compact_context_rule:
    - Do not dump full prior prompts or full assistant answers into the handoff.
    - Carry over only still-governing Penelope context: required baselines, active
        project goal, open findings, required assumptions, deferred-but-valuable follow-ups,
        and the next recommended patch_block.
    - If prior prompts/answers contain important unresolved Penelope TODOs, assumptions,
      accepted future series goals, or rejected directions, compress them into short
      bullet points instead of transcript replay.
    delivery_contract_rule:
    - Deliver a downloadable Penelope handoff file and a copyable next-thread prompt
      in a fenced code block.
    - State explicitly that the next thread may assume only the files actually uploaded
      there, not merely the latest artefacts claimed/generated in the old thread.
    operator_download_state_rule:
    - If the operator requests a Penelope handoff without naming the currently operator-held
      Penelope fullfiles, explicitly ask for that download state before finalising
      the handoff.
    - Treat a simple operator-supplied fullfile list (for example via ls output or
      a concise pasted list) as sufficient confirmation unless there is still file-identity
      ambiguity.
    - If a provisional Penelope handoff is unavoidable, mark it as provisional and
      separate assumed latest thread artefacts from operator-confirmed Penelope files.
    deferred_context_rule:
    - Keep deferred Penelope insights compact but actionable; preserve the decision,
      reason, and most likely future patch-series bucket when known.
    - Do not present deferred follow-ups as active blockers unless the next patch_block
      actually depends on them.
    canonical_split_rule:
    - Keep generic handoff headings and template structure in general_rules.collaboration_protocol.thread_hygiene_and_handoff.
    - Keep only Penelope payload extensions here.
  high_level_goals:
  - After reboot, the host must be visible on the LAN and unlockable via SSH/Dropbear
    (without local keyboard).
  - On malfunction, logs must be persisted such that root-cause analysis is possible
    without a reproduction marathon.
  project_architecture:
    components:
    - 'penelope-install: Ubuntu 24.04 installer with LUKS2 + Dropbear'
    - 'penelope-firstboot: Manual post-install host-finalisation step executed after the first reboot'
    - 'penelope-backup-setup: Restic-based backup system installer'
    - 'penelope-backup: Runtime backup runner'
    - 'penelope-usb-disk-setup: USB backup-disk preparation and registration tool installed by backup-setup'
    - 'penelope-offline-recover: Offline full-restore helper installed by backup-setup'
    - 'penelope-rotate-external-restic-passwords: External USB repo password rotation helper installed by backup-setup'
    - 'penelope-walkthrough-assistant: Optional bundle/workdir operator-guidance helper'
    - 'penelope-*: Additional installed or bundle-local ops helpers'
  layout_invariant:
    canonical_owner: penelope_specific
    required_mounts:
    - /
    - /home
    - /_archive
    - /_backup
    violation: exit
    install_storage_roles_reference:
    - The broader install storage-role vocabulary is owned by install_layout_config_model;
      this invariant is the running-system mount subset relied on by backup/runtime
      tooling.
  samba_role_model:
    canonical_owner: penelope_specific
    normal_server_profile:
    - '`penelope-samba-setup` is part of the standard Penelope bring-up after `penelope-backup-setup`.'
    - 'Documentation, runbooks, README text, installer completion output, and verifier expectations MUST treat Samba bring-up as part of the normal Penelope workflow rather than as an optional profile branch.'
    verifier_expectations:
    - 'The installed verifier SHOULD warn when backup setup is already present but no managed Samba include exists.'
    - 'The installed verifier SHOULD verify `/etc/samba/smb.conf`, active Penelope include wiring, successful `testparm -s`, and `smbd` enabled + active.'
  dashboard_rules:
    terminology_contract:
    - Use "Backup-Dashboard" as the canonical functional term for the backup-status
      artefact tree and its Samba exposure.
    - Avoid mixing synonymous labels such as "dashboard" or "operator dashboard" when
      the Backup-Dashboard is meant.
    - Public/user-facing documentation must distinguish clearly between the Backup
      Disk Operator (dashboard-only) and the Operator (SSH/admin).
    canonical_owner: penelope_specific
    canonical: /var/lib/penelope/backup-dashboard
    export_share_name: backup_dashboard
    export_user: backup_dashboard
    export_mode: ro
    export_is_direct_canonical_share: true
    mirror_allowed: false
    role_model:
      backup_disk_operator:
      - The Backup Disk Operator is a dashboard-only physical USB-disk handler without
        SSH/admin access.
      - The Backup Disk Operator may insert and remove already registered USB backup
        disks but does not inspect /etc/penelope/*, backup.conf, or shell logs.
      - The Backup Disk Operator decides only from the Backup-Dashboard signal files
        whether a named disk must stay attached, may be removed, or requires operator
        help.
      operator:
      - The Operator has SSH/admin access and owns disk preparation/registration,
        allow-list management, troubleshooting, and hold-resolution.
      - Operator-only runbooks may reference /etc/penelope/usb-backup-disks.conf,
        lsblk, backup.log, and event/status JSON files.
    responsibility_contract:
      backup_setup:
      - penelope-backup-setup is the canonical owner of backup-dashboard content generation.
      - penelope-backup-setup owns /var/lib/penelope/backup-dashboard as the canonical
        backup-dashboard path.
      - penelope-backup-setup writes backup-dashboard artefacts directly into the
        canonical backup-dashboard path.
      - penelope-backup-setup may define BACKUP_DASHBOARD_DIR in /etc/penelope/backup.conf;
        this remains the canonical backup-dashboard path used by the backup tooling.
      - Documentation/guidelines must not imply a separate mirrored publish path for
        the dashboard.
      samba_setup:
      - penelope-samba-setup is the canonical owner of Samba/export semantics for
        the direct canonical backup-dashboard export.
      - penelope-samba-setup owns provisioning/alignment of declared local non-login
        Samba principals and, when enabled, the dedicated local non-login backup_dashboard
        backup-dashboard-export user. The built-in `internal` name is a shared
        resource at /home/internal, not a login-capable Samba principal in the fresh model.
      - The dedicated backup_dashboard export user should remain a technical SMB principal
        only; exporting the canonical backup-dashboard path does not require a mirrored
        backup-dashboard tree or a managed backup-dashboard home directory.
      - penelope-samba-setup owns Samba account/password management and ro|rw share
        semantics.
      - penelope-samba-setup may export the canonical backup-dashboard path directly
        as backup_dashboard for user backup_dashboard in ro mode.
      - The dedicated backup_dashboard export user should not be reused for rw internal/archive
        shares or exposed through SAMBA_EXTRA_SHARES.
      - Documentation/guidelines must not imply that penelope-backup-setup provisions
        Samba principals, owns the internal shared resource, or owns Samba share definitions.
    internal_user_signals:
      running_file: INTERNAL_BACKUP_RUNNING.txt
      ok_file: INTERNAL_BACKUP_OK.txt
      error_file: INTERNAL_BACKUP_ERROR_CONTACT_OPERATOR.txt
      stale_file: INTERNAL_BACKUP_STALE_CONTACT_OPERATOR.txt
      stale_after_hours_default: 48
      semantics:
      - INTERNAL_BACKUP_RUNNING.txt means an internal backup run is currently active.
      - INTERNAL_BACKUP_OK.txt means the most recent internal backup completed successfully
        and is still fresh.
      - INTERNAL_BACKUP_ERROR_CONTACT_OPERATOR.txt means the most recent internal
        backup failed or did not finish cleanly; the Backup-Dashboard viewer should
        contact the operator.
      - INTERNAL_BACKUP_STALE_CONTACT_OPERATOR.txt means no fresh successful internal
        backup has been seen within the stale threshold; the Backup-Dashboard viewer
        should contact the operator.
      precedence:
      - RUNNING overrides ERROR_CONTACT_OPERATOR, STALE_CONTACT_OPERATOR, and OK while
        an internal backup is active.
      - ERROR_CONTACT_OPERATOR overrides STALE_CONTACT_OPERATOR and OK after a failed
        or incomplete internal run.
      - STALE_CONTACT_OPERATOR overrides OK when the last successful internal run
        is older than the stale threshold.
      - OK is shown only when no stronger internal status applies.
      lifecycle:
      - Remove the non-running internal signal files before writing INTERNAL_BACKUP_RUNNING.txt
        at the start of an internal run.
      - Remove INTERNAL_BACKUP_RUNNING.txt before writing a final INTERNAL_BACKUP_OK.txt
        or INTERNAL_BACKUP_ERROR_CONTACT_OPERATOR.txt result.
      - Maintain INTERNAL_BACKUP_STALE_CONTACT_OPERATOR.txt from last-internal.json
        via a local helper/timer so the dashboard stays current even without external
        USB activity.
      communication_model:
      - Backup-Dashboard signal files are the only user-facing communication channel
        for backup state; operator-only artefacts such as /etc/penelope/usb-backup-disks.conf,
        lsblk output, backup.log, and event/status JSON files must stay out of Backup
        Disk Operator runbooks.
      - No automatic mail notification is assumed; the Backup Disk Operator or other
        Backup-Dashboard viewer contacts the operator when a *_CONTACT_OPERATOR.txt
        file is present.
    external_user_signals:
      running_file_pattern: USB_BACKUP_RUNNING_DO_NOT_REMOVE_<DISK_NAME>.txt
      ready_file_pattern: USB_BACKUP_READY_TO_REMOVE_<DISK_NAME>.txt
      reattach_file_pattern: USB_BACKUP_REATTACH_AND_WAIT_<DISK_NAME>.txt
      hold_file_pattern: USB_BACKUP_DO_NOT_REMOVE_<DISK_NAME>_CONTACT_OPERATOR.txt
      semantics:
      - Each allow-listed USB backup disk gets its own user-facing Backup-Dashboard
        signal files keyed by DISK_NAME.
      - USB_BACKUP_RUNNING_DO_NOT_REMOVE_<DISK_NAME>.txt means that named allow-listed
        USB backup drive was detected and the external backup is currently running;
        that drive must not be removed yet.
      - USB_BACKUP_READY_TO_REMOVE_<DISK_NAME>.txt means that named USB backup drive
        may be removed.
      - USB_BACKUP_REATTACH_AND_WAIT_<DISK_NAME>.txt means that named USB backup
        drive is not currently attached after an incomplete or interrupted run; the
        Backup Disk Operator should reattach that same disk and wait for the next
        retry instead of escalating immediately.
      - USB autorun is enabled by default (`ENABLE_USB_AUTORUN="1"`), so for the
        normal allow-listed detached-disk case the next retry should usually be expected
        on reinsert of that same disk rather than only at the next daily internal
        backup schedule.
      - USB_BACKUP_DO_NOT_REMOVE_<DISK_NAME>_CONTACT_OPERATOR.txt means operator
        attention is required for that named USB backup drive; when the disk is still
        present, leave it attached and contact the operator.
      - If neither a READY, REATTACH_AND_WAIT, nor HOLD file exists for a disk after its
        external run, treat that disk as not yet safe to remove and not yet resolved.
      lifecycle:
      - External USB Backup-Dashboard signal files are per disk, keyed by DISK_NAME
        and rendered with a sanitized filename token.
      - Remove the four USB backup signal files for the current disk at the start
        of that disk's external run.
      - Write USB_BACKUP_RUNNING_DO_NOT_REMOVE_<DISK_NAME>.txt immediately after that
        allow-listed USB backup drive is detected and the external backup run starts.
      - Remove USB_BACKUP_RUNNING_DO_NOT_REMOVE_<DISK_NAME>.txt before writing a final
        READY, REATTACH_AND_WAIT, or HOLD result for that same disk.
      - Write USB_BACKUP_READY_TO_REMOVE_<DISK_NAME>.txt only after a successful external
        run and confirmed unmount for that disk.
      - Automatically remove USB_BACKUP_READY_TO_REMOVE_<DISK_NAME>.txt when that
        disk is physically detached or no longer present.
      - If a disk is absent after an incomplete or interrupted external run, dashboard
        refresh or detach reconciliation may replace a stale RUNNING file for that
        same disk with USB_BACKUP_REATTACH_AND_WAIT_<DISK_NAME>.txt.
      - If USB_BACKUP_DO_NOT_REMOVE_<DISK_NAME>_CONTACT_OPERATOR.txt already exists
        for that absent disk, that HOLD state keeps precedence; reconciliation may
        clear a stale RUNNING file for that disk, but it must not downgrade HOLD to
        REATTACH_AND_WAIT.
      - A later external run that actually starts for that same disk supersedes any
        earlier per-disk READY/REATTACH_AND_WAIT/HOLD/RUNNING dashboard state for that disk.
      - If that later run for the same disk reaches READY successfully, the earlier
        per-disk CONTACT_OPERATOR state for that disk is no longer the current
        Backup-Dashboard truth for the Backup Disk Operator.
      - USB_BACKUP_DO_NOT_REMOVE_<DISK_NAME>_CONTACT_OPERATOR.txt is reserved for
        operator-required cases; it is not the default detached-disk aftermath for
        a merely interrupted run.
      - Parallel external USB runs for different allow-listed disks are acceptable
        only when the user-facing dashboard signals remain per disk and independently
        understandable.
      status_json_pattern: last-external-<DISK_NAME>.json
      status_json_rules:
      - External structured status JSON is per disk, keyed by DISK_NAME and rendered
        with a sanitized filename token.
      - There is no single global last-external.json on current systems.
      - The per-disk external status JSON is an operator-facing quick summary, not
        the primary user removal/hold signal.
      operator_ui_note:
      - The Samba share `backup_dashboard` is the user-facing Backup-Dashboard UI
        for the Backup Disk Operator and other non-technical viewers; signal filenames
        must identify the specific USB backup drive directly.
      - 'Backup Disk Operator quick rule: RUNNING = do not remove; REATTACH_AND_WAIT = reinsert the same disk and wait; READY = safe to remove; CONTACT_OPERATOR = stop and contact the Operator.'
      - The Windows/Samba Backup Disk Operator workflow must be understandable from
        the per-disk Backup-Dashboard signal files alone, without requiring JSON or
        log interpretation.
      - The dashboard-only decision surface for external USB runs is RUNNING vs READY
        vs REATTACH_AND_WAIT vs CONTACT_OPERATOR for the named disk.
      - Windows/Samba viewers of the Backup-Dashboard should authenticate with the
        dedicated readonly backup_dashboard account, not with rw internal-share credentials.
      content_rules:
      - External USB Backup-Dashboard signal files SHOULD include `disk_name=<DISK_NAME>`
        in their text body when the current allow-listed disk name is known.
      - The filename remains the canonical removal/hold decision signal; the text
        body is supplemental human-readable context.
    ops_dashboard_artifacts:
      event_log: events-ops.log
      status_json: last-ops.json
      scope:
      - Backup-related operator actions that should also be visible on the dashboard,
        even though they are not normal internal/external backup runs.
      required_events:
      - USB disk registration/preparation success or failure should be recorded as
        ops events.
      - Dedicated external password-rotation success or failure should be recorded
        as ops events.
      semantics:
      - events-ops.log is append-only short operational history for backup-related
        operator actions.
      - last-ops.json is the quick current-state summary of the most recent backup-related
        operator action.
      - These ops artefacts complement events-internal.log / events-external.log;
        they do not replace them.
      communication_model:
      - No mail notification is assumed; Backup-Dashboard viewers still contact the
        operator when the Backup-Dashboard indicates a problem.
  backup_upgrade_rules:
    canonical_owner: penelope_specific
    preserve_logs: true
    preserve_dashboard: true
    preserve_config: true
    preserve_secrets: true
    dashboard_only_communication: true
    operational_model:
    - penelope-backup-setup is an idempotent software/update installer for backup
      tooling.
    - A normal rerun MUST update installed artefacts and append newly introduced config
      keys without silently replacing established operator configuration values.
    - Existing secret files are create-once material and MUST NOT be rotated or reinitialized
      by a routine rerun.
    - Dashboard freshness/status helpers may update user-facing signal files, but
      they do not send mail and do not replace the operator-runbook model.
    normal_rerun_use_cases:
    - upgrade the installed backup tooling bundle
    - reinstall or repair runner/cron/logrotate/systemd/udev/dashboard artefacts
    - append missing config keys introduced by a newer template version
    not_normal_rerun_use_cases:
    - implicit password rotation
    - destructive repository reinitialization
    - silent replacement of existing operator configuration values
    bootstrap_config_tree:
      location: /etc/penelope/backup-setup
      config_file: /etc/penelope/backup-setup/backup-setup.conf
      secrets_dir: /etc/penelope/backup-setup/secrets.d
      examples_dir: /etc/penelope/backup-setup/examples
      example_files:
      - /etc/penelope/backup-setup/examples/backup-setup.conf.example
      - /etc/penelope/backup-setup/examples/secrets.d/system.secret.example
      - /etc/penelope/backup-setup/examples/secrets.d/home.secret.example
      - /etc/penelope/backup-setup/examples/secrets.d/_archive.secret.example
      schema_key: config_schema_version
      current_schema: 1
      scaffold_command: penelope-backup-setup write-config
      semantics:
      - The external bootstrap tree replaces the old inline FIRST EDIT SECTION for
        backup-setup.
      - backup-setup.conf supplies initial values only for creating or resetting /etc/penelope/backup.conf.
      - secrets.d/{system,home,_archive}.secret supply initialization-only values
        only for missing or empty local password files under /root/.config/restic/.
      - examples/ contains templates only and MUST NOT be consumed as active bootstrap
        state.
      - A normal rerun MUST NOT overwrite an existing non-empty restic password file
        merely because the bootstrap secret changed.
      - Once /etc/penelope/backup.conf and /root/.config/restic/* exist, those effective
        live files remain the canonical runtime source of truth for routine reruns/upgrades.
      - The active bootstrap tree remains operator-owned setup input and SHOULD be
        kept aligned by running write-config during update reruns.
      - write-config MUST append newly introduced known bootstrap config keys with
        defaults, without replacing existing operator values.
      - verify-config and apply MUST reject active scaffolded bootstrap secrets that
        still contain the canonical placeholder change-me.
      - '`--reset-config` SHOULD rewrite backup.conf from the current bootstrap config
        tree.'
      placeholder_rule: The canonical shipped placeholder for scaffolded bootstrap
        secrets is change-me.
      persistence_requirement:
      - As soon as the effective restic password files become relied-on credentials
        for a system, the effective values MUST be recorded redundantly outside the
        system (for example in KeePass).
      - Documentation SHOULD repeat this requirement at the first point where the
        bootstrap secret files are introduced, not only in the general recovery section.
      upgrade_seam:
      - Structural changes to the backup bootstrap tree MUST route through one explicit
        schema seam keyed by config_schema_version instead of ad-hoc rewrite branches
        spread through the setup flow.
    external_rotation_model:
      dedicated_tool_required: true
      tool_name: penelope-rotate-external-restic-passwords.sh
      scope_rule: Operate only on external repos under <USB-mount>/<HOST_SCOPE_NAME>/{system,home,_archive}.
      current_password_source: /root/.config/restic/{system_pw,home_pw,_archive_pw}
      previous_password_buffer:
      - /root/.config/restic/system_pw.prev
      - /root/.config/restic/home_pw.prev
      - /root/.config/restic/_archive_pw.prev
      previous_password_semantics:
      - The .prev files are an explicit temporary migration buffer for older external
        USB repos, not a second long-term source of truth for routine backup runs.
      - Per repo, the dedicated rotation tool SHOULD try the current password first,
        then the repo-specific .prev file when present, and only then fall back to
        interactive entry.
      - If the first interactively entered old password succeeds for one repo, the
        tool MAY try that same old password for later repo types before prompting
        again.
      - If the reused interactive old password does not fit a later repo, the tool
        SHOULD reprompt only for that specific repo type.
      - The normal external USB autorun path MUST NOT silently attempt password migration
        by trying both generations during a routine backup run.
      scope_guard:
      - If the selected allow-listed disk does not contain the expected HOST_SCOPE_NAME,
        the tool SHOULD report which scope directories were found on the disk root
        to help the operator diagnose a wrong disk or wrong scope assumption.
      no_op_requirement:
      - If an external repo already accepts the current password generation, the dedicated
        rotation tool MUST leave it unchanged and report that no rotation was needed
        for that target.
    credential_handling_rules:
    - Documentation SHOULD explicitly tell the operator to update KeePass immediately
      whenever Samba per-user secrets, the dedicated Backup-Dashboard export secret,
      `CRED_SAMBA_ARCHIVE_USERS`, or `CRED_MANAGED_SAMBA_SHARES` change effective client credentials.
    - Samba credentials are operationally important client access secrets even when
      they are not bare-metal restore secrets in the same sense as restic passwords.
    recovery_bundle_model:
      location_rules:
      - Successful internal backup runs MUST sync a non-secret recovery bundle to
        /_backup/<HOST_SCOPE_NAME>/_recovery.
      - Successful external backup runs MUST sync the same non-secret recovery bundle
        to <USB-mount>/<HOST_SCOPE_NAME>/_recovery on the selected backup disk.
      content_rules:
      - The recovery bundle MUST contain the offline recovery tool penelope-offline-recover.sh.
      - The recovery bundle MUST contain penelope-common.sh.
      - The recovery bundle MUST contain a non-secret copy of penelope-backup-setup.sh.
      - The recovery bundle SHOULD contain a password-sanitized copy of penelope-install.sh
        when the installer has staged one on the system.
      - The recovery bundle SHOULD contain a password-sanitized copy of penelope-samba-setup.sh
        when the Samba setup has been run on the system.
      - The recovery bundle SHOULD also contain the currently installed backup-side
        helper tools plus a small README and manifest.
      - The recovery bundle MUST NOT contain effective restic passwords or other secrets.
      - The recovery bundle MUST NOT be treated as the canonical restore location
        for live Samba operator state; when present, live Samba config is restored
        separately to `/etc/penelope/samba-setup` from the system backup.
      sanitization_rules:
      - In the recovery-bundle copies, credential-bearing inline edit fields, when
        such fields still exist in a script, should reset to sanitized placeholders
        while structural operator context such as ADMIN_USER, TARGET_HOST, share names,
        usernames, and share paths remains visible.
      - When a setup script externalizes initialization secrets into separate bootstrap/config
        files, the recovery-bundle script copy MUST remain free of embedded effective
        secret values and the external secret files themselves MUST NOT be included
        in _recovery.
      - Install and setup scripts that run on the system SHOULD stage sanitized or
        otherwise non-secret self-copies in a local recovery-stage directory so that
        later backup runs can sync the latest non-secret versions into _recovery.
      operator_model:
      - In a Live-USB recovery situation, operators SHOULD prefer the copy from the
        mounted <repo-base>/_recovery directory instead of relying on the damaged
        system partition.
      - The recovery bundle is tooling-only; the required credentials still come from
        KeePass or another external secure vault.
      - For the current Samba design, operators SHOULD restore `/etc/penelope/samba-setup`
        from the system backup as live state, use the sanitized `_recovery` copy of
        `penelope-samba-setup.sh` only as a temporary local workspace tool, then repopulate
        secrets from KeePass, run `verify-config`, and rerun `apply`.
      - Operators SHOULD copy the sanitized setup scripts to a temporary local directory
        in the Live session, edit them there with values from KeePass, and MUST NOT
        write the edited secret-bearing copies back into _recovery.
      verification_rules:
      - The installed verifier (`penelope-verify-security.sh`) SHOULD check the local
        recovery-stage directory for required staged copies, shell syntax, and the
        relevant non-secret contract for each script copy (for example known sanitized
        credential markers for legacy inline models, or absence of embedded secret-bearing
        legacy vars when the model has moved to external bootstrap files).
      - The installed verifier MUST be phase-aware and MUST NOT assume that `penelope-backup-setup`
        or `penelope-samba-setup` has already run on a fresh install.
      - Before `penelope-backup-setup` has run, absence of the staged `penelope-backup-setup.sh`
        recovery copy SHOULD be informational rather than fatal.
      - Before `penelope-samba-setup` has run, absence of the staged or bundled `penelope-samba-setup.sh`
        recovery copy SHOULD be informational rather than fatal.
      - If `/etc/penelope/backup.conf` exists, the installed verifier SHOULD derive
        the expected internal bundle path `/_backup/<HOST_SCOPE_NAME>/_recovery` and,
        when that bundle exists, verify required files, shell syntax, and the same
        known sanitized credential markers there as well.
      - The verifier implementation SHOULD prefer shared helper logic for local recovery-stage
        checks and internal `_recovery` bundle checks so new required-file or sanitization
        rules do not drift between the two paths.
      - Absence of the internal `_recovery` bundle before the first successful internal
        backup sync SHOULD be informational rather than fatal.
      documentation_rules:
      - Documentation MUST mention the _recovery directory beside internal and external
        repositories.
      - Documentation MUST state clearly that the recovery bundle contains no secrets
        and does not replace KeePass as the credential source.
      - Documentation MUST explain that setup-script copies in _recovery are sanitized
        and should be edited only in a temporary Live-session workspace.
      - Documentation MUST distinguish restored live Samba config under `/etc/penelope/samba-setup`
        from `_recovery` as tooling-only workspace content.
      - Documentation SHOULD provide a minimal Samba restore runbook: restore `/etc/penelope/samba-setup`,
          inspect it with sanitized `penelope-samba-setup.sh`, repopulate secrets
          from KeePass, run `verify-config`, then rerun `apply`.
      - Documentation SHOULD mention that `penelope-verify-security.sh` audits the
        recovery-stage area and, when available, the internal `_recovery` bundle.
    documentation_expectations:
    - Documentation MUST explain that the backup bootstrap secrets are initialization-only
      and do not rotate established repositories during a routine rerun.
    - Documentation MUST include an operator runbook for late external USB disks whose
      repos still use the previous password generation.
    - Documentation SHOULD describe the per-repo fallback order for the dedicated external rotation tool: current
        password, repo-specific .prev, then interactive fallback.
    - Documentation SHOULD mention that the first interactively entered old password
      may be reused for later repo types until a mismatch requires a repo-specific
      reprompt.
    - Documentation SHOULD mention that keeping the previous password generation in
      a secure external vault is useful while not all registered USB disks have been
      migrated yet.
    - Documentation SHOULD describe verify timing as phased checkpoints: early verify
        after install/firstboot, late verify after backup setup and Samba setup, and
        bundle verification after the first successful internal backup sync.
    - Documentation SHOULD state that late verify checks `/etc/samba/smb.conf`, active
      Penelope include wiring, `testparm -s`, and `smbd` enabled + active.
    - Documentation MUST describe the dashboard-visible ops artefacts (`events-ops.log`,
      `last-ops.json`) for USB disk registration and external password rotation.
    usb_disk_registration_model:
      tool_name: penelope-usb-disk-setup.sh
      explicit_modes:
      - --prepare-new creates a new Penelope USB backup disk and is destructive.
      - --register-existing only registers an already prepared Penelope USB backup
        disk on the current system and must be non-destructive.
      disk_name_rules:
      - DISK_NAME is the canonical human-readable disk name for the local allowlist
        entry, the physical disk label, and the per-disk dashboard signal identity.
      - A non-empty DISK_NAME must be provided explicitly or interactively in both
        modes.
      - DISK_NAME must be locally unique on the system at registration time.
      - '`<UUID> <DISK_NAME>` is the required allowlist form for current systems.'
      prepare_new_rules:
      - When preparing a new disk, LABEL should default to DISK_NAME if LABEL is not
        explicitly provided.
      - The tool should instruct the operator to apply the same human-readable name
        as the physical label immediately after preparation.
      register_existing_rules:
      - Registering an existing disk must not silently reformat the device or rewrite
        its filesystem label.
      - The tool should show the current filesystem label for visibility and register
        the UUID plus DISK_NAME on the current system.
      dashboard_event_expectations:
      - Successful or failed USB disk registration/preparation should update the dashboard
        ops event artefacts.
      documentation_rules:
      - Documentation MUST distinguish clearly between creating a new Penelope backup
        disk and registering an existing Penelope backup disk on another system.
      - Documentation SHOULD tell the operator to record both UUID and DISK_NAME and
        to keep the physical label aligned with the allowlist name.
      - Documentation SHOULD tell the operator how to inspect already registered USB
        backup disks locally (for example via `sudo cat /etc/penelope/usb-backup-disks.conf`).
      - Operator-facing templates, completion messages, and runbooks SHOULD avoid
        the bare `penelope-usb-disk-setup.sh` invocation and should show the explicit
        `--prepare-new` vs `--register-existing` modes instead.
  samba_upgrade_rules:
    canonical_owner: penelope_specific
    managed_state_model: true
    source_of_truth: external Samba config directory (default /etc/penelope/samba-setup)
      consumed by penelope-samba-setup
    init_and_upgrade_model:
    - On a fresh Samba bring-up, `penelope-samba-setup write-config` is the mandatory
      first step before the first real `verify-config` / `apply` run.
    - '`write-config` creates missing active files from shipped defaults, appends newly
      introduced known keys to existing active setup config, writes `change-me`
      placeholders only for missing required secrets, writes templates under examples/
      for optional objects, and exits without provisioning Samba state.'
    - If the config tree already exists (for example after restore from backup), reruns/upgrades
      MUST reuse it as the canonical source of truth.
    - Routine reruns/upgrades MUST NOT silently replace established operator config
      values or overwrite non-empty secret files.
    - 'write-config MUST be safe in an update loop: additive for known missing config
      keys, preservative for existing values/secrets, and destructive only for package-owned examples.'
    - 'verify-config and apply MUST reject active Samba secrets that still contain
      the canonical placeholder change-me.'
    active_config_tree:
      root: /etc/penelope/samba-setup
      config_file: /etc/penelope/samba-setup/samba-setup.conf
      examples_dir: /etc/penelope/samba-setup/examples
      example_config_file: /etc/penelope/samba-setup/examples/samba-setup.conf.example
      package_owned_examples:
      - /etc/penelope/samba-setup/examples/samba-setup.conf.example
      - /etc/penelope/samba-setup/examples/users.d/*.conf.example
      - /etc/penelope/samba-setup/examples/shares.d/*.conf.example
      - /etc/penelope/samba-setup/examples/secrets.d/*.secret.example
      package_owned_example_semantics:
      - write-config and apply MAY overwrite files under examples/ to keep blueprints aligned with the installed setup version.
      - write-config and apply MUST NOT treat files under examples/ as active operator state.
      - write-config and apply MUST NOT overwrite active operator config files or non-empty secrets.
      files:
      - samba-setup.conf
      - users.d/*.conf
      - shares.d/*.conf
      - secrets.d/*.secret
      - examples/users.d/*.conf.example
      - examples/shares.d/*.conf.example
      - examples/secrets.d/*.secret.example
      examples_semantics: Files under examples/ are templates only and MUST NOT be
        consumed as active Samba state.
    normal_rerun_use_cases:
    - upgrade the installed samba setup bundle
    - add/remove managed principal files under users.d
    - add/remove extra-share files under shares.d
    - change Samba passwords for managed users by updating exactly the corresponding
      secrets.d/<user>.secret
    - change managed share parameters
    - remove managed shares from the generated Samba configuration
    shipped_default_model:
    - The normal Penelope server profile currently seeds archive principals `p001`
      and `p002` with primary shares `archive_p001` and `archive_p002`.
    - 'The current shipped default Samba model separates identities from resources: `penelope_client` is the standard Windows/Linux workstation identity, `scan` is the scanner/printer service identity, `p001`/`p002` are archive identities with private archive shares and explicit `default_access` semantics, `rawin`/`scan`/`internal` are shared rw resources, and `backup_dashboard` is shared ro.'
    - The fixed `internal` shared resource remains present at /home/internal but is not a login-capable Samba principal and has no active secret in the fresh model.
    - Shipped p-user examples may use `default_access=yes` for Windows-friendly combined workstation/archive credentials; operators may set `default_access=no` for archive-only separation on clients that can manage distinct SMB credentials cleanly.
    - The readonly Backup-Dashboard export `backup_dashboard` is enabled in the shipped
      default config tree for the normal server profile.
    - regenerate the managed include after package or local drift repair
    forbidden_operator_model:
    - Do not treat manual edits inside the generated managed Samba include as the
      normal workflow.
    destructive_boundary:
    - Removing a managed share from the script configuration and rerunning penelope-samba-setup
      removes it from the generated Samba configuration only.
    - Destructive cleanup of Linux users, Samba accounts, directories, or data remains
      a separate conscious operator action unless a future dedicated cleanup mechanism
      is explicitly introduced.
    - Disabling or removing a p-user MUST NOT automatically delete /_archive/<user>,
      /home/<user>, or any other user data directory.
    config_schema_contract:
      current_version: 4
      rules:
      - 'Schema `4` is the current capability/group model: `users.d/*.conf` declares
        managed principals through purpose/capability fields, built-in resources are
        rendered by the setup tool, and `shares.d/*.conf` declares only operator-defined
        extra shares.'
      - The current pre-release line is current-only: older schema layouts are not
          a supported runtime compatibility target and SHOULD be updated in-tree before
          release rather than via bundled migration code.
      - Unknown future schema versions MUST fail loudly instead of guessing compatibility
        semantics.
    managed_share_declaration_formats:
      managed_principal_file:
        location: /etc/penelope/samba-setup/users.d/*.conf
        role: Canonical declaration surface for managed Samba user principals and
          optional private user shares.
        required_keys:
        - user
        - purpose
        field_meanings:
          user: Linux non-login user name and Samba account name to provision/manage.
          purpose: Principal purpose (`client`, `service`, or `admin`).
          default_access: Whether the principal joins the standard Penelope workspace
            access model for rawin, scan, internal, and backup_dashboard.
          private_home: Whether to render a private home share for this principal.
          private_archive: Whether to render a private archive share for this principal.
          extra_groups: Optional comma-separated extra local groups for this principal.
        relationship_rules:
        - Built-in fixed resource names such as `rawin`, `scan`, `internal`, and
          `backup_dashboard` are rendered from the current setup model and are not
          active `shares.d/*.conf` declarations.
        - Private per-user home/archive exports are controlled by the user capability
          flags in the corresponding `users.d/*.conf` file.
      managed_share_file:
        location: /etc/penelope/samba-setup/shares.d/*.conf
        role: Canonical declaration surface for operator-defined extra Samba exports.
        required_keys:
        - kind
        - path
        - share
        - user
        - mode
        field_meanings:
          kind: Share class (`extra`).
          path: Absolute local path exported by Samba.
          share: Visible SMB share name / smb.conf section name.
          user: Already managed principal that owns the export.
          mode: ro or rw.
        relationship_rules:
        - Extra shares remain share-local declarations and must not be used to introduce
          a new managed principal without a corresponding `users.d/*.conf` principal
          file.
        - Extra shares MUST NOT reuse fixed built-in share names owned by Penelope.
      secret_files:
        location: /etc/penelope/samba-setup/secrets.d/*.secret
        role: Per-user Samba credentials kept separate from topology files.
        rules:
        - One live secret file per principal.
        - Secrets MAY be restored from backup or copied from KeePass, but routine
          reruns/upgrades MUST NOT overwrite a non-empty secret file.
        - Missing, empty, unreadable, or placeholder secret files are tolerated only
          for read-only inspection; `apply` must still fail until the effective secret
          is provided.
    documentation_expectations:
    - Documentation SHOULD state that `penelope-samba-setup` is part of the standard
      Penelope bring-up on the installed host.
    - Documentation SHOULD include one short schema example and one realistic worked
      example for an active `users.d/*.conf` principal file and for an active `shares.d/*.conf`
      extra-share file.
    - Documentation SHOULD describe the external Samba setup config tree (`samba-setup.conf`,
      `users.d/*.conf`, `shares.d/*.conf`, `secrets.d/*.secret`) as the canonical
      source of truth and `.example` files as templates only.
    - Worked examples should make it obvious that `share` may intentionally differ
      from the username or default archive share naming convention.
    - Worked examples may use neutral placeholder-style values such as change-me instead
      of production passwords.
  project_variables:
    TARGET_HOST:
      description: Hostname of the installed or to-be-installed target system
      usage: Used by install/initramfs tooling as the system identity for generated
        host-specific artefacts
      migration: TARGET_HOST is the only permitted install-time hostname variable
        (do not use HOST/HOST_NAME)
    HOST_SCOPE_NAME:
      description: Stable backup scope identifier from /etc/penelope/backup.conf;
        may intentionally differ from TARGET_HOST
      usage: Used in backup-setup + runner for log paths, repository namespace, and
        restic --hostname metadata
    host_identity_rules:
    - TARGET_HOST and HOST_SCOPE_NAME are different concepts and must not be collapsed
      into one variable.
    - TARGET_HOST identifies the installed or recovery target system.
    - HOST_SCOPE_NAME identifies the existing backup scope/repository namespace.
    - Recovery and migration workflows may intentionally restore backups from host
      A onto host B.
    - Canonical example: recover asterix backups onto a new target host obelix; keep
        HOST_SCOPE_NAME=asterix for repository/log scope while TARGET_HOST=obelix
        for the installed system identity.
    - Within one historical backup scope, restic snapshot hostname metadata MUST stay
      keyed to HOST_SCOPE_NAME; do not switch it to TARGET_HOST merely because the
      machine was reinstalled or replaced.
    - Documentation and code reviews MUST verify that install-time host identity,
      backup scope identity, and restic snapshot hostname identity are described separately
      and remain aligned with the same contracts.
  backup_layout_rules:
    canonical_owner: penelope_specific.backup_layout_rules
    internal_canonical: /_backup/<HOST_SCOPE_NAME>/<target>
    external_canonical: <repo_root>/<HOST_SCOPE_NAME>/<target>
    unscoped_internal_layout_allowed: false
    compatibility_fallbacks_allowed: false
  recovery_documentation_rules:
    canonical_owner: penelope_specific.recovery_documentation_rules
    scenario_template_must_include:
    - prerequisites
    - source_of_truth
    - code_path
    - expected_behaviour
    - failure_behaviour
    - required_operator_decisions
    recovery_decision_rules:
    - Recovery runbooks MUST start with an explicit operator decision about repository
      source and snapshot.
    - Internal scoped repositories are the default first choice when they are available
      and trusted.
    - External scoped repositories are the fallback when internal recovery is unavailable
      or when the correct recovery point exists only on external media.
    - Runbooks MUST state explicitly that the newest snapshot is not always the correct
      recovery point.
    - Runbooks MUST allow intentional selection of an older known-good snapshot after
      latent corruption.
    - Documentation SHOULD include one explicit recovery/migration example where TARGET_HOST
      != HOST_SCOPE_NAME so operators see how stable backup scope identity behaves
      on differently named new hardware.
    - Documentation MUST describe `penelope-offline-recover --snapshot <snapshot-id|latest>` as an
      explicit CLI decision; do not imply an interactive numbered snapshot chooser
      or timeout-based auto-defaulting unless the current tool really implements it.
  restore_flow_rules:
    canonical_owner: penelope_specific.restore_flow_rules
    must_distinguish:
    - reinstall_with_preserved_backup_partition
    - full_system_restore_from_backup
    rerun_policy:
    - After reinstall, rerun penelope-backup-setup only when operational tooling must
      be reinstalled or reattached.
    - After full system restore, do not imply that rerunning penelope-backup-setup
      is mandatory unless upgrade or regeneration is intentionally desired.
    tooling_first_variant:
    - Treat tooling-first restore order as a constrained fallback, not as the normative
      default.
    - Do not describe tooling-first as safe on a non-empty preserved /_backup unless
      the operator already knows the intended HOST_SCOPE_NAME and already has the
      matching restic password files available from external secure material or another
      verified source.
    - If backup.conf is still missing but the intended scope is already known, documentation
      MAY mention the explicit PENELOPE_HOST_SCOPE_NAME fallback; it MUST also state
      that the run still requires the matching restic passwords for the existing repos,
      that the selected scope must already exist among the detected internal scopes
      on a non-empty preserved /_backup, and that blind bootstrap remains blocked.
    - Backup-side guards SHOULD reject a selected HOST_SCOPE_NAME on a non-empty preserved
      internal /_backup when that scope is not already one of the detected existing
      internal repo scopes on disk.
    - Documentation MUST describe explicit HOST_SCOPE_NAME selection on a non-empty
      preserved internal /_backup as an existing-scope reattach mechanism, not as
      permission to create a fresh internal scope beside historical repos.
    - If tooling is reinstalled before backup.conf itself is restored, rerun penelope-backup-setup
      --keep-config --keep-secrets after restoring backup.conf so the installed tooling
      reflects the restored config file without reinitializing secrets.
    flow_b_preflight_rules:
    - '`penelope-offline-recover` SHOULD resolve repo root, target repos, required
      restic passwords, and snapshot ids for all selected targets before the first
      destructive `mkfs` or `luksFormat` step begins.'
    - If any selected Flow-B target fails repo/password/snapshot preflight, the run
      MUST abort before wiping any selected target.
    - Documentation SHOULD state that target-device presence and obvious mounted-target
      conflicts are checked before destructive restore proceeds.
  credential_redundancy_rules:
    canonical_owner: penelope_specific.credential_redundancy_rules
    must_exist_outside_system:
    - restic passwords
    - dropbear unlock/access credentials
    - admin credentials
    - anydesk credentials
    examples:
    - keepass
    - separate secure vault
    - sealed printed recovery record
    mountpoints:
      _archive: LUKS2 encrypted archive partition (always exactly `/_archive` with
        straight quotes)
      _backup: Unencrypted backup partition (restic repos, logs, diagnostics)
    restic_password_files:
      path_pattern: /root/.config/restic/{system_pw,home_pw,_archive_pw}
      note: No .pw extension
      rotation: Password rotation is done with `restic key passwd` against the repo,
        then update the file
    legacy_migration:
    - 'Current source of truth: `penelope-install-<version>.sh` uses `TARGET_HOST`
      in the config block; do not reintroduce `HOST`/`HOST_NAME` as parallel hostname
      variables.'
    - 'Migration rule: treat install identity (`TARGET_HOST`) and backup scope identity
      (`HOST_SCOPE_NAME`) as separate contracts, especially for recovery onto a differently
      named target host.'
  operator_walkthrough_documentation:
    canonical_owner: penelope_specific.operator_walkthrough_documentation
    applies_to:
    - penelope-documentation
    rules:
    - Documentation SHOULD include one canonical scratch-install walkthrough for the
      current default operator hardware example (currently `two-disk` with an approx.
      2 TB `DISK_SYS` and an approx. 4 TB `DISK_DATA`), while keeping that example
      subordinate to the general roles-and-profiles model.
    - The scratch-install walkthrough SHOULD state explicitly that the Ubuntu Live
      session is used only as the booted environment and that the Ubuntu installer
      itself is not run when Penelope performs the real provisioning.
    - The scratch-install walkthrough SHOULD show the current install edit surfaces explicitly: the
        first-edit section near the top of `penelope-install` plus the generated external
        layout-config template when that seam exists.
    - The scratch-install walkthrough SHOULD include the normal post-install cadence explicitly: preserve
        generated key archives and effective operator config, reboot, remote unlock
        test from a second device, admin login, manual firstboot, early verify, backup
        setup, backup verify, Samba setup, Samba verify, final combined verify.
    - Documentation SHOULD include a separate software-only update walkthrough for
      a running installed system and distinguish clearly between install-bundle maintenance
      (`--initramfs-only` / `--managed-artifacts-only`), backup-setup reruns, and
      Samba `verify-config` / `apply` rerun paths.
    - Walkthrough/update documentation MUST state that secret-bearing Desktop workdirs
      are temporary staging only, that effective credentials and key archives must
      be captured redundantly outside the server, and that a KeePass database on the
      server must not be the only copy.
    - Walkthrough/update documentation SHOULD prefer the extracted runnable bundle
      (for example a `.zip` release bundle on the Desktop) as the simplest default
      runbook, while allowing a Git-based workflow as a later equivalent as long as
      the runnable sibling-bundle rule remains intact.
  common_library:
    based_on_pattern: general_rules.patterns.common_library_functions_and_override_contract
    parameters:
      common_library:
        overview:
        - penelope-common.sh is the central library for all Penelope scripts
        - 'Install path: /usr/local/lib/penelope/common.sh'
        - 'Version: PENELOPE_COMMON_VERSION (readonly in the library)'
        - PENELOPE_COMMON_INSTALL_PATH defines the installation target path
        deployment:
        - 'MUST: penelope-install installs the library into the target via stage_common_lib_into_target()'
        - 'MUST: penelope-backup-setup installs/refreshes the running-system library via install_common_lib()'
        - 'MUST: penelope-samba-setup source-loads the sibling bundle/workdir library from ${SCRIPT_DIR}/penelope-common.sh; it is bundled with the library but is not the current owner of installed-library deployment semantics in these guidelines.'
        - 'SHALL: Installation/refresh occurs early in the workflow, before generating scripts that use the library or before bundle-local helper logic depends on the shared helpers.'
        - 'MUST: All setup scripts source the library itself from their script directory when running from a bundle/workdir.'
        content:
        - 'Logging functions: ts(), log(), warn(), die()'
        - 'Utility functions: require_root(), require_cmd(), ensure_dir(), ensure_file(),
          have(), apt_install(), read_kv_value_from_file(), is_mounted(), generate_pw(),
          part_dev(), install_file_from_heredoc()'
        - 'Heredoc generators: write_log_functions_block_bash/sh(), write_common_guards_block_bash/sh()'
        - 'Macro injection: inject_source_common_macro_if_present(), inject_log_functions_macro_if_present(),
          inject_common_guards_macro_if_present(), inject_known_macros_if_present(),
          inject_block_into_file()'
        - 'Validation: validate_shell_script(), validate_systemd_unit(), validate_generated_file(),
          ensure_no_unexpanded_tokens()'
        - 'String utils: escape_sed_replacement(), apply_placeholders()'
        versioning:
        - Library follows its own versioning (e.g. 1.3.0)
        - Breaking changes require a major version bump
        - New functions require a minor version bump
      function_override:
      - Scripts may override library functions after sourcing
      - 'Example: backup-setup defines its own install_file_from_heredoc() with script-specific
        logic'
      - Override should be documented with a comment
  bundling:
    based_on_pattern: general_rules.patterns.script_plus_common_library_bundle
    parameters:
    - 'MUST: penelope-common.sh MUST be bundled with setup scripts (bundle = 2 files)'
    - 'MUST: Install bundle consists of penelope-install-X.Y.Z.sh + penelope-common.sh'
    - 'MUST: Backup-setup bundle consists of penelope-backup-setup-X.Y.Z.sh + penelope-common.sh'
    - 'MUST: Samba-setup bundle consists of penelope-samba-setup-X.Y.Z.sh + penelope-common.sh'
    - 'MUST: Both files must be in the same directory (script directory)'
    - 'MUST: Setup scripts copy penelope-common.sh from ${SCRIPT_DIR} to the target
      system'
    - 'MUST: The canonical bundle filename of the library is always ''penelope-common.sh''
      (no version-encoded library filenames in the bundle).'
    - 'MUST: Setup scripts always source the library in the bundle from ${SCRIPT_DIR}/penelope-common.sh
      (no version suffix in the source path).'
    - 'MAY: Place versioned copies of the library only as additional archive files
      under old/ (or equivalent); these must not be used as source target.'
    - 'MUST: Library version must match the setup-script API level expected by the runnable bundle/workdir (for example penelope-install 0.9.91 requires the matching common.sh level). A mismatch is a runtime contract error, not merely a packaging preference.'
    - 'MUST: For every versioned setup script release, the published filename version,
      the script''s internal VERSION constant, and all generated version-stamped artefacts
      produced from that script must align exactly. A filename/header mismatch is
      a release bug, not a cosmetic issue.'
    - 'MUST: Before publishing any new versioned setup-script artefact, perform an
      explicit self-consistency check against the actual full file: filename version,
      internal VERSION=/SCRIPT_VERSION declarations, and the version strings emitted
      into generated helper artefacts or banners. Do not rely on the intended patch
      delta alone.'
    - 'SHALL: Distribute both files together when distributing (USB, download, etc.)'
    - 'INFO: Newer library with older setup script is safe (backward compatible)'
    - 'WARNING: Older library with newer setup script causes ''command not found''
      errors'
    - 'MUST: In runnable bundles/workdirs and release bundles, the unversioned sibling
      runtime file penelope-common.sh is the authoritative library actually sourced
      by the top-level scripts; a newer versioned penelope-common-<version>.sh somewhere
      beside it does not satisfy the runtime contract by itself.'
    - 'MUST: When a patch updates the intended current Penelope common-library level
      for runnable bundles/workdirs, update the sibling runtime file penelope-common.sh
      in the same patch set; do not leave it behind the newest intended bundle API
      level.'
    - 'SHOULD: Treat bundle/runtime common-file consistency as a release/readiness
      check, not merely as repository housekeeping.'
    - 'MUST: For the current pre-release release flow, the canonical operator runtime
      object is the extracted release-bundle/workdir, not the raw repository tree
      or the bare list of versioned artefacts.'
    - 'MUST: When the operator workflow uses one release ZIP per release, the extracted
      workdir SHALL recreate the authoritative sibling runtime file penelope-common.sh
      from the chosen versioned penelope-common-<version>.sh before any real script
      run.'
    - 'SHOULD: Documentation, walkthrough text, and release-readiness checks SHOULD
      describe the extracted workdir assembly step explicitly instead of assuming
      that a loose source directory is already runnable.'
    - 'MUST: In Penelope patch delivery bundles, penelope-common.sh may be included
      as an unversioned operator convenience file only when it is byte-identical to
      the current versioned penelope-common-<version>.sh included in the same bundle.'
    - 'MUST: The Penelope bundle manifest states that byte-identical relationship
      explicitly whenever penelope-common.sh is included.'
  project_macros:
    based_on_pattern: general_rules.patterns.template_and_macro_injection
    parameters:
      version_placeholders:
        ___PENELOPE_INSTALL_VERSION___: Replaced by stamp_install_version() (only
          in penelope-install)
        ___PENELOPE_SETUP_VERSION___: Replaced by stamp_setup_version() (only in penelope-backup-setup)
        note: stamp_install_version() and stamp_setup_version() are intentionally
          named differently (different bundle contexts)
      code_injection_tokens:
        ___PENELOPE_SOURCE_COMMON___:
          description: Source statement for penelope-common.sh (recommended)
          replaced_by: inject_source_common_macro_if_present()
          usage: For system scripts in /usr/local/sbin/ that run on a mounted root
          expansion: "if [[ -f \"$(dirname \"${BASH_SOURCE[0]}\")/penelope-common.sh\" ]]; then
  source \"$(dirname \"${BASH_SOURCE[0]}\")/penelope-common.sh\"
elif [[ -f \"/usr/local/lib/penelope/common.sh\" ]]; then
  source \"/usr/local/lib/penelope/common.sh\"
else
  # Error with helpful paths
  exit 1
fi
"
          benefits:
          - 'Single source of truth: changes to the library propagate to all tools'
          - Smaller generated scripts (source statement only)
          - Fallback logic for development and production environments
        ___PENELOPE_LOG_FUNCTIONS___:
          description: Inline logging functions (legacy, but necessary for initramfs)
          replaced_by: inject_log_functions_macro_if_present()
          usage: Only for initramfs scripts that run BEFORE mounting root
          note: initramfs has no access to /usr/local/lib/
        ___PENELOPE_COMMON_GUARDS___:
          description: Inline guards (set, trap) (legacy, but necessary for initramfs)
          replaced_by: inject_common_guards_macro_if_present()
          usage: Only for initramfs scripts that run BEFORE mounting root
          note: initramfs has no access to /usr/local/lib/
      macro_selection_rules:
        system_scripts:
        - Scripts under /usr/local/sbin/ MUST use ___PENELOPE_SOURCE_COMMON___
        - 'Examples: penelope-backup.sh, penelope-verify-security.sh, penelope-rotate-masterpw-dropbear.sh'
        - These scripts run on the mounted system with access to /usr/local/lib/
        initramfs_scripts:
        - Scripts under /etc/initramfs-tools/ MUST use ___PENELOPE_LOG_FUNCTIONS___
          and ___PENELOPE_COMMON_GUARDS___
        - 'Examples: init-top/*, init-premount/*, init-bottom/*, hooks/*'
        - These scripts run BEFORE root is mounted and have NO access to /usr/local/lib/
        - They must be completely self-contained (all functions inline)
        chroot_context:
        - Chroot blocks in setup scripts MAY source the library
        - 'Prerequisite: library was installed into the target BEFORE the chroot call'
        - Chroot can then source /usr/local/lib/penelope/common.sh
        - 'Optional: override logging functions with [chroot] prefix for better visibility'
      generator_functions:
      - write_log_functions_block_bash() for bash context
      - write_log_functions_block_sh() for POSIX sh context
      - write_common_guards_block_bash() for bash guards (set -Eeuo pipefail, trap)
      - write_common_guards_block_sh() for sh guards (set -eu, trap)
      - inject_source_common_macro_if_present() for ___PENELOPE_SOURCE_COMMON___ (NEW,
        recommended)
      - inject_log_functions_macro_if_present() for ___PENELOPE_LOG_FUNCTIONS___ (legacy/initramfs)
      - inject_common_guards_macro_if_present() for ___PENELOPE_COMMON_GUARDS___ (legacy/initramfs)
      - inject_known_macros_if_present() processes all three macro types
      usage_rules:
      - 'When an embedded heredoc script should carry the setup version: use placeholder
        (e.g. ___PENELOPE_SETUP_VERSION___) in the quoted heredoc and then substitute
        specifically via sed/replace. Default: heredoc quoted; unquoted only when
        expansion is strictly necessary and this is commented directly above.'
      - 'SHALL: Operator-facing help, template, and next-step output should reuse
        the actual script invocation path (for example `~/Desktop/<workdir>/penelope-install-<version>.sh`)
        instead of hard-coding `./script.sh`, unless the path must be intentionally
        normalized for a documented reason.'
      - 'SHALL: Use macro tokens (e.g. ___PENELOPE_LOG_FUNCTIONS___, ___PENELOPE_COMMON_GUARDS___)
        only in shell scripts, not in configuration or systemd units.'
      - 'SHALL: Macro tokens must appear as their own line in the heredoc (line-based
        replace, no inline expansion).'
      - 'SHALL: Macro expansion occurs before syntax checks (bash -n/sh -n) and before
        further substitutions, so that validations remain meaningful.'
      - 'MUST: Macro injection must not change file permissions. Perform token replacement
        in-place or explicitly preserve mode and owner; no mv-based replace when execute
        bits are relevant.'
      - 'MUST: Finalisation order for installed artefacts: write, inject macros, apply
        placeholders, stamp version, chown or chmod, ensure_no_unexpanded_tokens,
        validate (file-type specific).'
      - 'MUST: When artefact A references artefact B (e.g. systemd unit ExecStart),
        B must be fully finalised (exists, chmod, syntax check) before A is validated.'
  token_vocabulary_policy:
    summary: Keep token vocabulary lean and use the canonical technical generator
      token syntax ___PENELOPE_*___ project-wide to avoid drift and ensure consistent
      validation.
    principles:
    - 'MUST: Technical Penelope generator tokens use exactly one canonical namespaced
      syntax: ___PENELOPE_[A-Z0-9_]+___.'
    - 'MUST NOT: Old double-underscore token forms or non-namespaced token forms remain
      in current code after a token-schema migration series lands.'
    - 'MUST: Operator placeholders such as change-me are a separate class from technical
      generator tokens and must not be used as a substitute for generator-token expansion.'
    - Tokens are intended for template finalisation (macros/placeholders). Runtime
      values belong in config/state files, not as a token flood.
    - Before introducing a new token, check whether an existing token or config file/state
      already covers the problem.
    recommended_minimal_set:
      macro_tokens:
      - ___PENELOPE_SOURCE_COMMON___
      - ___PENELOPE_LOG_FUNCTIONS___
      - ___PENELOPE_COMMON_GUARDS___
      version_tokens:
      - ___PENELOPE_INSTALL_VERSION___
      - ___PENELOPE_COMMON_VERSION___
      - ___PENELOPE_SETUP_VERSION___
    rules_for_ensure_no_unexpanded_tokens:
    - ensure_no_unexpanded_tokens() in penelope-common is the single source of truth
      for the canonical token regex and hardened-file rejection.
    - Install/backup/samba/walkthrough-assistant must use ensure_no_unexpanded_tokens()
      consistently; no local copies or parallel token vocabularies.
    - Unexpanded technical generator tokens are a hard error (also in comments) to
      prevent silent template leaks.
    - Operator-edit templates MAY contain operator placeholders such as change-me,
      but hardened/published artifacts MUST NOT contain canonical technical generator
      tokens.
  logging_and_observability:
    principles:
    - 'Each critical phase logs: start/end, paths used, relevant commands, return
      codes, and excerpts of important states.'
    - Logs must be deterministically findable, even if the copy path in initramfs
      fails.
    required_log_destinations:
      runtime_initramfs:
      - /run/initramfs/penelope/ (tmpfs; always available in initramfs)
      - /run/penelope-initramfs-diag.log (compatible with earlier builds)
      persistent_unencrypted_fallback:
      - /_backup (unencrypted backup partition) serves as persistence fallback for
        early logs when /var/log is not reachable or not writable in the initramfs
        context.
      - 'Path standard (installed system): /_backup/var/log/${TARGET_HOST}/initramfs/'
      - 'Path standard (initramfs, root FS under /root): /root/_backup/var/log/${TARGET_HOST}/initramfs/'
      - 'File standard: latest.log + timestamped copy'
      persistent_in_installed_os:
      - /var/log/${TARGET_HOST}/ (after successful boot/unlock in the installed system)
      - 'Path standard: /var/log/${TARGET_HOST}/initramfs/latest.log + timestamped
        copy'
      - 'Install log additionally: /var/log/${TARGET_HOST}/install/penelope-install-<version>-<timestamp>.log'
    log_path_contract:
      base_dir: /var/log/${TARGET_HOST}/
      required_subdirs:
      - initramfs/
      - install/
      - backup/
      - rotate/
      - verify/
      notes:
      - 'Install/initramfs scripts use host-scoped paths under ''/var/log/${TARGET_HOST}/''
        (fallback: ''/_backup/var/log/${TARGET_HOST}/''). The backup subsystem uses
        ''/_backup/${HOST_SCOPE_NAME}/backup/'' (HOST_SCOPE_NAME from backup.conf).'
      - Do not use project-scoped paths like '/var/log/penelope/<HOST>/'.
    required_log_content_minimum:
    - Kernel cmdline (cat /proc/cmdline)
    - Timestamp, hostname, initramfs phase (init-top/init-premount/init-bottom/local-bottom)
    - 'Network status: ip link, ip addr, ip route, ethtool -i <if> (if present), dmesg
      excerpts (NIC/PHY)'
    - 'Dropbear: port, start status, process list, listening sockets (ss -lntp / netstat
      fallback)'
    - 'Mount attempts: which devices/labels found, which mountpoint, error codes'
    initramfs_diagnostic_profile:
      based_on_pattern: general_rules.patterns.early_boot_network_diagnostic_profile
      parameters:
        purpose:
        - 'A single look at stage.log and net.state must be sufficient to determine:
          link ok? DHCP ok? IP/GW known? ARP/GW reachable? Dropbear listening?'
        - Diagnostics must be router-independent (MAC/IP/GW/ARP/ping in log) so that
          "not visible in router" is no longer the bottleneck.
        constraints_reference:
          minimal_userspace_constraints:
            based_on_contract: general_rules.patterns.early_boot_network_diagnostic_profile.contracts.minimal_userspace_constraints
            note:
            - These constraints are binding for all initramfs logic and parsers (no
              head/tail/awk/sed/cut etc. without explicit copy plan).
        required_files_and_aliases:
          net_state:
          - 'MUST: /run/initramfs/penelope/net.state (key=value; single source of
            truth for NET+DROPBEAR summary)'
          - 'MUST: /run/penelope-initramfs-net.state (stable alias file; for easy
            find/grep)'
          stable_logs:
          - 'MUST: /run/initramfs/penelope/penelope-initramfs-stage.log'
          - 'MUST: /run/initramfs/penelope/penelope-initramfs-netup.log'
          - 'MUST: /run/initramfs/penelope/penelope-initramfs-dropbear.log'
          - 'MUST: /run/initramfs/penelope/penelope-initramfs-diag.log'
          - 'SHALL: additional stable aliases under /run/ (e.g. /run/penelope-initramfs-*.log)
            so that find / -name "penelope*log" finds all relevant files.'
        console_operator_hints:
        - 'SHALL: After successful IPv4 determination (and optionally gateway detection),
          output a one-line operator hint to /dev/console: ''penelope initramfs: net=<iface>
          mac=<mac> ipv4=<ip> gw=<gw> ssh: ssh -p <port> root@<ip>'''
        - 'SHALL: The output must be usable without the router UI (IP immediately
          visible) and must appear in the same phase on every boot (after DHCP or
          after deferred-to-dropbear, once IPv4 is known).'
        - 'MUST: Do not log secrets (no key material, no passwords). The SSH example
          call may only contain host/IP/port.'
        net_state_required_keys:
        - iface
        - mac
        - expected_mac
        - carrier
        - dhcp_attempt_used
        - ipv4
        - gw
        - gw_ping
        - dhcp_hostname
        - dhcp_clientid
        - ip_cmdline
        - ip_hostname_field
        - ip_device_field
        - dropbear_port
        - dropbear_listening
        - dropbear_retry_used
        summary_contract_stage_log:
        - 'MUST: stage.log ends with exactly two summary lines, populated exclusively
          from net.state (no fragile re-interpretation from other logs):'
        - '  - ''SUMMARY NET: iface=<value> mac=<value> expected_mac=<value> dhcp_hostname=<value>
          dhcp_clientid=<value> carrier=<value> dhcp_attempt_used=<value> ipv4=<value> gw=<value>
          gw_ping=<ok|fail|skipped>'''
        - '  - ''SUMMARY DROPBEAR: port=<value> listening=<yes|no|unknown> retry_used=<0|1>'''
        dhcp_identity_logging_checklist:
        - 'MUST: In netup.log, explicitly log which DHCP mechanism is active (ipconfig
          vs. deferred-to-dropbear/dhcpcd/udhcpc) and which hostname input is used.'
        - 'MUST: When ip= kernel cmdline is used: log ip_hostname_field (field 5)
          and ip_device_field (field 6) and mark mismatch against selected iface as
          WARN.'
        - 'SHALL: Log client-ID/DUID hints from dhcpcd.conf (if present) as a hint;
          do not log secrets.'
        router_visibility_evidence:
        - 'MUST: Log the MAC address of the selected interface (router identifier).'
        - 'MUST: After DHCP, log default GW and ARP/neighbor snapshot (ip neigh if
          present, otherwise /proc/net/arp).'
        - 'MUST: Log gateway ping (1 attempt): gw_ping ok|fail|skipped, including
          reason for skipped.'
        logging_non_goals:
        - Do not log secrets (passwords, private keys, TPM secrets).
        - SSH public keys are ok.
  initramfs_dropbear_unlock:
    based_on_pattern: general_rules.patterns.initramfs_dropbear_unlock
    parameters:
      diagnostics_constraints_reference:
        based_on_contract: general_rules.patterns.early_boot_network_diagnostic_profile.contracts.minimal_userspace_constraints
        note:
        - These constraints apply to all initramfs hooks and scripts of this pattern
          (minimal userspace, no fragile pipes).
      requirements:
        lan_only:
        - Support only Ethernet; do not configure WLAN.
        - Initramfs must contain the same Ethernet drivers/modules as the live system
          where possible.
        determinism_and_timing:
        - Interface discovery robust (predictable names).
        - 'Link-up/DHCP may be time-critical: limited retries/backoff are allowed
          and must be logged.'
        dropbear:
        - Dropbear must start in initramfs before waiting for unlock.
        - SSH service must listen on the expected port (e.g. 2222); listening must
          be verified and logged.
        unlock_path:
        - Unlock via SSH/Dropbear must be possible (cryptroot unlock).
        module_and_firmware_verification:
        - 'SHALL: Kernel module checks in chroot must determine the target kernel
          from /lib/modules and use modinfo with -k <kver>; do not depend on the live
          kernel.'
        - 'SHALL: Firmware checks in initrd must accept compressed files (fw.zst,
          optionally fw.xz and fw.gz) and uncompressed fw files.'
        - 'SHALL: Deduplicate and limit firmware warnings (e.g. only the first 10
          entries plus summary) to maintain signal quality.'
      persistence_strategy:
      - Initramfs ALWAYS logs first to /run/initramfs/penelope/.
      - 'When /_backup can be mounted: additionally copy logs there immediately (latest.log
        + timestamp).'
      - 'After unlock and boot into installed system: mirror logs to /var/log/${TARGET_HOST}/.'
      - 'When mirroring fails: clear error message + pointer that /_backup (in initramfs:
        /root/_backup) is the source.'
      diagnostics_contract_checklist:
        must_adopt_net_state_keys:
        - iface
        - mac
        - expected_mac
        - carrier
        - dhcp_attempt_used
        - ipv4
        - gw
        - gw_ping
        - dhcp_hostname
        - dhcp_clientid
        - ip_cmdline
        - ip_hostname_field
        - ip_device_field
        - dropbear_port
        - dropbear_listening
        - dropbear_retry_used
        must_emit_stage_summary_lines_from_net_state_only:
        - 'SUMMARY NET: iface=<value> mac=<value> expected_mac=<value> dhcp_hostname=<value>
          dhcp_clientid=<value> carrier=<value> dhcp_attempt_used=<value> ipv4=<value> gw=<value>
          gw_ping=<ok|fail|skipped>'
        - 'SUMMARY DROPBEAR: port=<value> listening=<yes|no|unknown> retry_used=<0|1>'
        review_notes:
        - 'These contract elements are binding: without them, router/MAC visibility
          and remote unlock debugging are not deterministic.'
        - No secrets (private keys, passwords, MasterPW) in logs or /dev/console.
        - 'Cross-ref: must_adopt_net_state_keys is word-for-word identical to penelope_specific.logging_and_observability.initramfs_diagnostic_profile.net_state_required_keys
          (canonical owner: logging_and_observability); must_emit_stage_summary_lines_from_net_state_only
          matches summary_contract_stage_log.'
  _backup_partition:
    motivation:
    - Unencrypted partition serves as an always-readable diagnostic store, even when
      root cannot be mounted.
    mounting_convention:
      label:
      - The internal Penelope backup partition receives a stable filesystem LABEL.
      - 'Current Penelope contract: LABEL=_backup for the internal partition.'
      - Preserve-path validation in penelope-install currently treats a missing or
        different internal LABEL as a hard mismatch.
      mountpoint:
      - 'Mountpoint in installed system: /_backup'
      - 'Mountpoint in initramfs (root FS under /root): /root/_backup'
      mount_resolution:
      - The installed-system fstab contract is UUID-based for /_backup.
      - Preserve-path validation should reject a missing or unreadable internal /_backup
        UUID before destructive install/reinstall steps continue.
      - Label-based probing may still be used as a fallback discovery aid in Live/initramfs
        tooling, but that fallback does not replace the installed UUID mount contract.
    one_time_setup:
    - Install script should set LABEL=_backup when the internal backup filesystem
      is created.
    - Install/reinstall documentation and guidelines must not recommend a different
      internal label name unless the installer/runtime contract is changed in the
      same patch series.
    - Guidelines/documentation must not describe an optional by-label fstab entry
      for the internal /_backup partition while the current installer writes the canonical
      installed mount by UUID.
    - Preserve behaviour on reinstall is controlled via RECREATION_TARGET_LIST (e.g.
      RECREATION_TARGET_LIST=system,home,_archive). Targets not in the list are preserved;
      /_backup remains untouched by default.
  setup_update_semantics:
    based_on_pattern: general_rules.patterns.idempotent_setup_update_semantics
    parameters:
      principles:
      - Setup scripts must be runnable any number of times and establish a consistent
        end state.
      - Artefacts (runner, units, udev rules, cron, logrotate, smoke tests) may be
        updated on every run.
      - 'Configuration is merged by default: existing values are kept, missing new
        keys are added append-only.'
      - 'Secrets (e.g. restic password files) are create-once: never overwrite; only
        create when explicitly permitted.'
      required_flags:
      - --keep-config (no merge additions; permission fix only; if file is missing
        it is created)
      - --reset-config (rewrite template, backup old file first)
      - '--keep-secrets (no secret generation; if secret is missing/empty: hard abort)'
      - --init-secrets (generate missing/empty secrets; default)
      notes:
      - On migrations, new default keys must be pulled in via merge so that old configs
        remain compatible over time.
      - Secrets must never be logged (not even partially).
  release_bundle_policy:
    principles:
    - 'penelope-backup-setup is a release bundle: it is the single source of truth
      for the installed artefacts under /usr/local/sbin (runner, smoke test, USB disk
      setup, and other tools).'
    - '`penelope-install` is also a release bundle: all artefacts that `penelope-install`
      permanently deposits in the target system (e.g. ops tools under `/usr/local/sbin`
      such as rotate-masterpw-dropbear and verify-security) are considered released
      in the form installed by the installer.'
    - Documentation and operator instructions reference exclusively installed paths
      and the bundle versions that produced these paths.
    - No additional tool-specific version lines in the bundle (except the `# Version:`
      header in installed files). No additional version markers are used.
    - In bundle scripts, the concrete bundle version should appear only in the central
      VERSION variable; comments and usage examples are version-neutral (e.g. ${0##*/}
      or <version> placeholder).
    - For `penelope-backup-setup`, keep the release bundle as a single file for now,
      but reduce repeated generated-script fragments through local emit/render helper
      functions instead of copy/paste heredoc duplication whenever this clarifies
      maintenance without changing operator-visible behaviour.
    - Within the single-file `penelope-backup-setup` bundle, repeated backup.conf-derived
      runtime context logic for generated tools (for example TARGET_HOST/HOST_SCOPE_NAME
      resolution, dashboard dir resolution, and backup-log path derivation) SHOULD
      be centralized in shared local emit/helper snippets rather than re-derived ad
      hoc in each installed tool.
    versioning_rules:
    - 'Definition: An "installable heredoc" is any heredoc in penelope-backup-setup
      that produces a persistent file on disk (e.g. under /usr/local/sbin, /etc/systemd/system,
      /etc/udev/rules.d, /etc/cron.d, /etc/logrotate.d, or configuration templates).
      Such artifacts MUST carry the bundle version header (`# Version: <penelope-backup-setup
      VERSION>`) via placeholder substitution. Purely transient heredocs that do not
      create a persistent file are exempt.'
    - 'For installable heredocs in `penelope-install` the same applies: installed
      files must carry the installer bundle version (header `# Version: <penelope-install
      VERSION>`), implemented via placeholder `___PENELOPE_INSTALL_VERSION___` + substitution.'
    - 'All files installed per heredoc from penelope-backup-setup as standalone files
      (e.g. under /usr/local/sbin, /etc/systemd/system, /etc/udev/rules.d, /etc/cron.d,
      /etc/logrotate.d, and config templates) must carry the setup version in the
      header: `# Version: <penelope-backup-setup VERSION>`. This is ensured mechanically
      via a placeholder (e.g. ___PENELOPE_SETUP_VERSION___) and a targeted substitution
      after writing (heredoc remains single-quoted).'
    - The `# Version:` line of the installed file is always the bundle version (not
      the version number of an individual tool).
    - 'MUST: Generated helper headers, usage comments, and invocation notes must describe
      the actual installed file and its real trigger model (manual operator step vs
      automatic service/timer/udev path). Swapped or copy-pasted helper headers are
      treated as release artefact bugs, not cosmetic comments.'
    - 'MUST: Every file stamped via stamp_install_version or stamp_setup_version must
      have a first comment line ''# Version: ___PENELOPE_INSTALL_VERSION___'' or ''#
      Version: ___PENELOPE_SETUP_VERSION___'' in the template; including early or
      stub files.'
    - 'CLARIFICATION: stamp_install_version() and stamp_setup_version() are intentionally
      named differently because they serve different bundle contexts and placeholder
      tokens (install: ___PENELOPE_INSTALL_VERSION___, backup-setup: ___PENELOPE_SETUP_VERSION___).
      This distinction is correct and necessary.'
    artifact_validation_pipeline:
      based_on_pattern: general_rules.patterns.artifact_validation_pipeline
      parameters:
        principles:
        - 'MUST: For all installable heredocs (persistent files), a fixed finalisation
          order applies: write, inject macros, apply placeholders, stamp version,
          chmod/chown, ensure_no_unexpanded_tokens, validate (file-type specific).'
        - 'MUST: Non-shell heredocs (e.g. systemd units, conf files) are validated
          immediately after writing and after placeholder substitution (best-effort
          appropriate to file type).'
        - 'MUST: Failed validations (tokens remaining / syntax check / verify) are
          fatal for released/installable artefacts unless an explicit per-check downgrade
          with rationale is documented.'
        - 'SHALL: Validators must leave their stderr/stdout output in the install
          log (at minimum as WARNING) to enable root-cause analysis without a reproduction
          marathon.'
        type_specific:
          shell_scripts:
          - 'MUST: ensure_no_unexpanded_tokens <file> after macro/placeholder expansion.'
          - 'MUST: validate_shell_script <file> (dash -n -> sh -n -> bash --posix
            -n) appropriate to shebang.'
          - 'SHALL: shellcheck -x <file> (if available); severity follows the owning
            script policy and is fatal only where explicitly declared release-blocking.'
          systemd_units:
          - 'MUST: ensure_no_unexpanded_tokens <file> after placeholder expansion.'
          - 'MUST: validate_systemd_unit <file> (typically: systemd-analyze verify),
            when available.'
          - 'SHALL: Unit references (ExecStart targets) may only be verified when
            the target scripts are finalised (exist, chmod +x, syntax check).'
          config_and_templates:
          - 'MUST: ensure_no_unexpanded_tokens <file> after placeholder expansion.'
          - 'MUST: validate_generated_file <file> (existence, owner/mode, ASCII-only
            policy).'
          - 'SHALL: Best-effort structural checks by type (e.g. grep for invalid mountpoints,
            duplicate keys, empty values), but without fragile pipelines that produce
            false negatives under pipefail.'
    operator_expectation:
    - On a target system, the installed files under /usr/local/sbin (and other persistent
      artefacts from the bundles) count as the authoritative truth source. Operator
      documentation references exclusively these installed paths.
    - Before release, MUST review a diff against the direct predecessor version (e.g.
      `diff -u <old> <new>` or `git diff <old>..<new>`). Changes outside the planned
      scope are a blocker.
    - 'Required: pattern scan (grep) for remaining version placeholders (`___PENELOPE_*_VERSION___`)
      and impermissible standalone references (e.g. `./penelope-*` or version-encoded
      script names).'
    command_snippets:
    - '# Diff review (without Git)

      diff -u <old> <new> | less


      # Diff review (with Git)

      git diff <old>..<new> --


      # Placeholders must not remain after build/stamping

      grep -RIn "___PENELOPE_.*_VERSION___" <new>
      grep_rc=$?
      if [[ ${grep_rc} -eq 0 ]]; then
        echo "ERROR: unexpanded placeholders found"
      elif [[ ${grep_rc} -ne 1 ]]; then
        echo "ERROR: grep failed while scanning <new>"
      fi


      # No standalone references in docs/guidelines

      grep -RInE "(^|[^/])\./penelope-|penelope-[a-z0-9-]+-[0-9]+\.[0-9]+\.[0-9]+\.sh" \
        <file-or-folder>
      grep_rc=$?
      if [[ ${grep_rc} -eq 0 ]]; then
        echo "ERROR: impermissible standalone references found"
      elif [[ ${grep_rc} -ne 1 ]]; then
        echo "ERROR: grep failed while scanning <file-or-folder>"
      fi


      # Shell syntax

      bash -n <new>

      '
  troubleshooting_runbook:
    based_on_pattern: general_rules.patterns.troubleshooting_runbook
    parameters:
      purpose:
      - 'After a reboot, the operator should be able to determine without lengthy
        reproduction: link ok? DHCP ok? IP/GW known? ARP/GW reachable? Dropbear listening?'
      - 'Runbook is router-independent: router UI is optional, not a prerequisite.
        MAC/IP/GW/ARP/ping must be derivable from logs.'
      where_are_the_logs:
        initramfs_runtime:
        - /run/initramfs/penelope/penelope-initramfs-stage.log
        - /run/initramfs/penelope/penelope-initramfs-netup.log
        - /run/initramfs/penelope/penelope-initramfs-dropbear.log
        - /run/initramfs/penelope/penelope-initramfs-diag.log
        - /run/initramfs/penelope/net.state
        stable_aliases:
        - /run/penelope-initramfs-stage.log
        - /run/penelope-initramfs-netup.log
        - /run/penelope-initramfs-dropbear.log
        - /run/penelope-initramfs-diag.log
        - /run/penelope-initramfs-net.state
        after_unlock_persistent:
        - /var/log/${TARGET_HOST}/initramfs/ (timestamped + latest.log)
        - /var/log/${TARGET_HOST}/install/penelope-install-<version>-<timestamp>.log
        fallback_unencrypted_partition:
        - /_backup/var/log/${TARGET_HOST}/initramfs/ (installed system)
        - /root/_backup/var/log/${TARGET_HOST}/initramfs/ (initramfs, root FS under
          /root)
      quick_commands:
      - '# Most important single-look check (summary at end of stage.log)

        tail -n 20 /var/log/${TARGET_HOST}/initramfs/penelope-initramfs-stage.log


        # Only the summary lines

        grep -E ''^(SUMMARY NET:|SUMMARY DROPBEAR:)'' -n /var/log/${TARGET_HOST}/initramfs/penelope-initramfs-stage.log


        # net.state (single source of truth)

        cat /var/log/${TARGET_HOST}/initramfs/net.state 2>/dev/null || cat /run/penelope-initramfs-net.state
        2>/dev/null || true


        # Gateway/ARP evidence

        grep -nE ''gw_detected:|gw_ping:'' /var/log/${TARGET_HOST}/initramfs/penelope-initramfs-netup.log
        || true

        cat /var/log/${TARGET_HOST}/initramfs/penelope-initramfs-diag.log | grep -nE
        ''ip neigh|/proc/net/arp|carrier_|operstate'' || true


        # Dropbear listening

        grep -nE ''listening|DROPBEAR_OPTIONS|force_cmd|port='' /var/log/${TARGET_HOST}/initramfs/penelope-initramfs-dropbear.log
        || true


        # Logcopy service

        systemctl status penelope-initramfs-logcopy.service --no-pager || true

        journalctl -u penelope-initramfs-logcopy.service -b --no-pager | tail -n 200
        || true

        '
      evidence_chain:
      - '1) Interface/MAC: selected iface + MAC must match the expected router MAC
        (see net.state: iface/mac/expected_mac).'
      - '2) Link: carrier=1 and operstate=up. If carrier=0 -> no physical link / wrong
        interface / switch/port.'
      - '3) DHCP: dhcp_attempt_used and ipv4 must be set. If DHCP ok but ipv4 empty
        -> parsing/tooling bug.'
      - '4) Route/Gateway: gw must be set.'
      - '5) ARP/Neighbor: gateway should become visible in /proc/net/arp or ip neigh.'
      - '6) gw_ping: ok|fail|skipped. fail may be ICMP block; but ok is strong connectivity
        evidence.'
      - '7) Dropbear: port set and dropbear_listening=yes. retry_used explains timing/race.'
      - '8) Unlock: cryptroot-unlock prompt appears; cryptsetup success in dropbear.log.'
      router_visibility_notes:
      - 'When router knows the MAC persistently, "connected/not connected" is the
        best statement. However: router hostname display is not always reliable (hostname
        may be missing or not sent by DHCP client).'
      - 'DHCP identity diagnostics: dhcp_hostname/ip_hostname_field/ip_device_field
        and dhcp_clientid in net.state; warn on ip= device mismatch.'
      escalation_when_reproducing_is_costly:
      - 'When one attempt is expensive: first collect only summary+net.state and send;
        only then detail logs.'
      - 'For intermittent problems: collect multiple boots and compare the summary
        lines (carrier timing, dhcp_attempt_used, retry_used).'
  fast_iteration_mode:
    based_on_pattern: general_rules.patterns.fast_iteration_mode
    parameters:
      purpose:
      - 'Reduce reproduction costs: iterations on initramfs/dropbear/network diagnostics
        should be possible without a full install run.'
      - Fast iteration is exclusively for diagnostic/development cycles; productive
        initial installation remains unchanged.
      scope_and_non_goals:
      - 'Scope: Only update artefacts that affect the initramfs (initramfs-tools scripts/hooks,
        dropbear initramfs config, penelope initramfs debug/identity configs) and
        then run update-initramfs.'
      - 'Non-goal: NO partitioning, NO mkfs, NO (re)initialising LUKS, NO changes
        to fstab/crypttab/grub except optionally an explicit debug kernel parameter
        print (log only).'
      interface_contract:
        flags:
        - --initramfs-only (or equivalent flag)
        - 'Optional: --kver <kernel_version> (only when required; default: update
          all installed kernels)'
        behavior:
        - 'MUST: Only write/update initramfs-relevant artefacts and then run update-initramfs.'
        - 'MUST: Run lsinitramfs/manifest/validators after the build and abort on
          errors that violate the declared validation policy for this diagnostic path.'
        - 'SHALL: At the end, log a short list of updated paths (diff-suitable).'
      safety_guards:
      - 'MUST: require_root()'
      - 'MUST: Clearly mark in the log: FAST_ITERATION_MODE=1 and which parts are
        being skipped.'
      - 'MUST: Hard-disable all destructive operations (partitioning, mkfs, cryptsetup
        luksFormat, wipefs, grub-install).'
      - 'MUST: If a destructive path would be reached anyway: die() with clear error
        message (''initramfs-only mode forbids disk operations'').'
      - 'SHALL: Before writing, check that the target system is plausible (e.g. expected
        /etc/os-release, /etc/crypttab, /etc/initramfs-tools present).'
      expected_artifacts_touched:
        initramfs_tools_scripts:
        - /etc/initramfs-tools/scripts/init-top/*penelope*
        - /etc/initramfs-tools/scripts/init-premount/*penelope*
        - /etc/initramfs-tools/scripts/init-bottom/*penelope*
        initramfs_tools_hooks:
        - /etc/initramfs-tools/hooks/*penelope*
        dropbear_initramfs:
        - /etc/dropbear/initramfs/dropbear.conf
        penelope_initramfs_configs:
        - /etc/penelope/initramfs-debug.conf (if used)
        - /etc/penelope/initramfs-identity.conf (if used)
      required_logging:
      - 'MUST: The install log must contain: kernel list (ls /lib/modules), update-initramfs
        command, exit code, and the generated initrd paths.'
      - 'MUST: Continue to generate and log build manifest/inventory (lsinitramfs)
        (see initramfs_diagnostic_profile).'
      - 'SHALL: With --initramfs-only, explicitly remind the operator that a reboot
        is necessary to use the new initramfs (without stating a time).'
      example_operator_flow:
      - '# Initramfs-only refresh (live USB / chroot setup assumed) ./penelope-install-<ver>.sh
        --initramfs-only reboot # then: check summary/logs (see troubleshooting_runbook)'
  testing_smoke_tests:
    top_level_entrypoint_refactor_smoke:
    - When a patch changes shared startup/common-library sourcing, shared display/path
      helpers, argument parsing, or other code used by top-level bundles, do not rely
      only on `bash -n` or `--help`.
    - After such a refactor, run at least one real non-help entrypoint smoke for every
      touched top-level bundle/helper and record the result in the precheck or patch
      status.
    - 'For Penelope this usually means: install `--help`; backup `--help`; samba `--help`;
      walkthrough assistant `--help`, `status`, `live-usb`, and `installed`, unless
      a narrower touched-set justifies a smaller matrix.'
    - If a helper rename/removal or bundle/runtime library drift would only fail in
      a non-help path, treat missing real entrypoint smoke coverage as a blocker before
      declaring the refactor clean.
    - For release/readiness checks, prefer smoke evidence from an assembled runnable
      workdir (for example an extracted `penelope-x.y.z/` directory with a freshly
      recreated sibling penelope-common.sh) over smoke evidence from a raw repository
      directory that may not yet represent the operator runtime object.
    post_install:
    - Reboot; host visible on LAN
    - SSH to dropbear port reachable
    - Unlock possible
    - 'After unlock: /var/log/${TARGET_HOST}/ contains expected logs (initramfs +
      install). Backup logs are under /_backup/${HOST_SCOPE_NAME}/backup/ (HOST_SCOPE_NAME
      from backup.conf; path is on the unencrypted backup partition /_backup).'
    - 'Additionally a persistence fallback exists on the unencrypted backup partition:
      /_backup/var/log/${TARGET_HOST}/initramfs/ (installed system) or /root/_backup/var/log/${TARGET_HOST}/initramfs/
      (initramfs, root FS under /root), if /var/log/${TARGET_HOST}/ is not reachable
      or not writable.'
    evidence_required:
    - Concrete IP/link info in initramfs before unlock.
    - Dropbear listening confirmed.
    - Mount/copy steps with success/error + return codes.
  references:
    general_patterns:
    - artifact_validation_pipeline
    - troubleshooting_runbook
    - fast_iteration_mode
    - early_boot_network_diagnostic_profile
    - initramfs_dropbear_unlock
    pattern_instantiations:
      common_library:
        based_on_pattern: general_rules.patterns.common_library_functions_and_override_contract
        notes:
        - Instantiation covers both common_library and function_override; separate
          section function_override is omitted.
      initramfs_dropbear_unlock:
        based_on_pattern: general_rules.patterns.initramfs_dropbear_unlock
        notes:
        - Penelope instantiates the pattern for remote unlock via Dropbear in initramfs;
          concrete paths/host scope remain defined under parameters.
  documentation_markdown_extensions:
    canonical_owner: penelope_specific
    extends: general_rules.documentation_markdown
    top_level_bundles:
    - penelope-install
    - penelope-backup-setup
    - penelope-samba-setup
    version_list_rule: The "Current tool versions" list in Penelope documentation
      MUST cover all three bundles above plus any additional top-level ops tools released
      with them, and it is the only place in the documentation where concrete current
      tool versions may appear. Bundle structure notes, compatibility notes, examples,
      and recent change-log entries must refer back to that central list instead of
      restating the concrete current bundle versions. Historical change-log entries
      may mention past versions only when the version number itself is materially
      needed to explain the historical change; generic "updated to the then-current
      bundle" wording is preferred otherwise.
  generated_script_constraints:
    canonical_owner: penelope_specific.generated_script_constraints
    references_general_rule: general_rules.generated_script_rules
    rules:
    - Lock paths must be consistent between generator, installed artefacts, and runtime
      checks.
    - Dependency checks must match the active operational mode and the actual code
      path.
    - In single-file generator bundles, repeated dashboard/state helper families across
      generated runtime tools SHOULD be extracted into shared emit helpers before
      introducing new ad-hoc inline copies. This includes converging repeated last-*.json
      dashboard writers for runtime and ops helpers onto shared generator-level JSON/state
      helpers where the resulting schema stays unchanged.
    - In single-file generator bundles, repeated USB allowlist name/uniqueness parsing
      across generated runtime tools SHOULD be centralized in a shared emitted helper
      family instead of being reimplemented separately per installed tool when the
      allowlist format stays unchanged.
    - When a patch introduces a new host-scoped runtime log or changes which generated
      tools write which existing host-scoped logs, the same patch series SHOULD review
      the matching logrotate entry, install-time verification, and operator-facing
      documentation/update surface together.
    large_single_file_bundle_review_rules:
    - If a Penelope bundle mixes setup-runtime code and generated tool templates in
      one file, reviews must distinguish runtime-callable helpers from helpers that
      exist only inside generated artifacts.
    - For penelope-backup-setup revisions, repeated trivial apply-path regressions
      trigger a subsystem_audit_block rather than more local micro-fixes.
    - For Penelope single-file generator bundles, when a patch changes embedded Python
      or another non-shell payload used by generated runtime tools, the patch review
      should name the concrete payload-level validation used (for example rendered helper
      extraction plus python syntax/compile proof) rather than relying on the outer
      bundle shell syntax alone.
    - For Penelope bundles that automatically chain a second operator/runtime phase
      after a first one, reviews SHOULD name the concrete handoff boundary (for example
      lock release, dashboard marker cleanup, or pre-unmount verify) and avoid claiming
      the combined path is clean based only on the first phase finishing.
  backup_runtime_operator_semantics_2026_04_20:
    scope: Penelope backup runtime/operator semantics in the current release line.
    intent:
    - Keep daily backup cadence, cycle semantics, rerun rules, and recovery tempdir
      policy explicit across code, docs, and operator guidance.
    rules:
    - '`FULL_BACKUP_WEEKDAYS_INTERNAL` / `FULL_BACKUP_WEEKDAYS_EXTERNAL` define the
      configured full-marker weekdays for the current backup retention cycle contract.
      The default is `mon,thu`, so typical office-week data gets two full-marker anchors
      per week while Restic still stores deduplicating snapshots.'
    - 'For a normal run, the first successful snapshot per mode/scope in the current configured
      weekday cycle is tagged `penelope_kind=full`; later successful snapshots in the same
      cycle are tagged `penelope_kind=incr`. `--force-full` may intentionally add another
      full marker in the current configured cycle, but it must not alter the configured cycle
      weekdays, retention policy, or future cycle calculation.'
    - '`KEEP_CYCLES_INTERNAL` / `KEEP_CYCLES_EXTERNAL` express retention in whole configured
      cycles, not a promise of exactly one retained snapshot per configured cycle. Extra
      manual/debug snapshots inside an active cycle are allowed and age out with that whole
      cycle.'
    - 'Operator-facing backup docs and config comments SHOULD describe cadence and retention
      in terms of configured full-marker weekdays and whole-cycle retention, not in obsolete
      day-length/anchor-date terms.'
    - 'When live `backup.conf` keys change installed runtime behaviour or rendered artefacts,
      operator guidance SHOULD tell the operator to rerun `verify-config` and then `apply`;
      typical examples include cron schedule and Backup-Dashboard path changes.'
    - 'Recovery temp directories such as `_recovery.tmp.*` / `_recovery.old.*` may remain
      briefly after a failed publish for immediate analysis, but a later successful publish
      SHOULD clean stale temp dirs that belong to dead processes so the canonical `_recovery`
      path is not obscured by historical crash residue.'
thread_series_local_rules:
  walkthrough_followup_series_2026_03_26:
    scope: This active Penelope walkthrough-followup series only.
    intent:
    - Tighten the canonical operator runbooks around the currently typical two-disk
      host shape without widening the install semantics.
    rules:
    - Treat the approx. 2 TB + 4 TB two-disk host shape as the canonical walkthrough
      example until the operator chooses a different default example.
    - Prefer concrete verify checkpoints in runbooks over vague "verify later" wording;
      name the installed verifier, backup dashboard/log checks, and Samba inspect
      commands when they exist.
    - Secret-bearing Desktop copies are temporary staging only; relied-on secrets
      and generated key archives must be captured redundantly outside the server.
    - Small script UX fixes discovered while tightening the walkthrough are allowed
      in the same patch block when they only reinforce the documented operator policy
      and do not widen runtime semantics.
    - Prefer one shared operator phrasing pattern across bundles: scaffold/template
        paths SHOULD print numbered Next steps; completion paths SHOULD print explicit
        Next inspect commands and Next verify commands whenever those commands are
        part of the canonical runbook.
    - In the current pre-release line, the canonical maintenance operator surface
      for backup-setup and samba-setup is `write-config -> verify-config -> apply`;
      do not preserve older public command names as compatibility aliases unless the
      operator explicitly asks for them.
    - Operator-facing `write-config` or template-generation paths SHOULD print the
      concrete next commands the walkthrough expects next (for example edit -> inspect/preflight
      -> verify-config -> apply -> verify) instead of only saying "edit and rerun".
    - Completion output for backup-setup and Samba apply SHOULD name the installed
      verifier and the most relevant inspect commands so the canonical walkthrough
      does not rely on memory alone.
  operator_guided_walkthrough_assistant_2026_03_26:
    scope: This active Penelope operator-guided walkthrough scaffold only.
    intent:
    - Add an optional guide-layer assistant without turning the core bundles into
      a second embedded handbook or a second installer implementation.
    rules:
    - Prefer a separate operator assistant script over inflating penelope-install,
      penelope-backup-setup, or penelope-samba-setup into long tutorial shells.
    - For the phase split, use **Live-USB** terminology for the booted Ubuntu session
      and **installed** terminology for the running post-reboot host. Avoid plain
      `live` as the phase label when it could be confused with the running installed
      system.
    - The walkthrough assistant SHOULD be idempotent and rerunnable. It MAY remember
      only non-secret operator context if that later becomes useful; it MUST NOT persist
      relied-on secrets, vault contents, private keys, or equivalent secret state.
    - A newly introduced optional guide-layer assistant file may start on a `0.0.x`
      version line while Penelope remains pre-release and while wrapper-UX patches
      are expected.
    - The assistant SHOULD reuse the actual detected invocation and sibling bundle
      paths in the commands it prints, instead of hard-coding `./script.sh` assumptions
      where the current workdir may differ.
    - The assistant remains a guide/orchestration layer only. Real destructive or
      mutating work continues to belong to the core scripts.
    - In the current pre-release series, prefer the artifact name `penelope-walkthrough-assistant`
      over `penelope-walkthrough`; do not carry compatibility aliases unless the operator
      asks for them explicitly.
    - For real provisioning runs, operator-edited install identity/password inputs
      SHOULD live in an external bootstrap-config file instead of inline script edits.
      The walkthrough assistant SHOULD guide operators through the bootstrap-config
      plus layout-config pair and SHOULD NOT instruct inline secret edits in the installer
      body.
    - '`--write-layout-config-template` SHOULD analyze the currently visible local
      whole-disk hardware and prefill the canonical `two-disk` mapping when the disk
      picture is unambiguous (especially approx. 2 TB for `DISK_SYS` plus approx.
      4 TB for `DISK_DATA`). When the picture is ambiguous, the template SHOULD still
      record the detected candidates in comments rather than silently guessing.'
    - Real full-install runs and `--verify-layout-contract` SHOULD fail fast on unresolved
      `REPLACE_WITH_<VALUE>` layout placeholders before package installation, key generation,
      or other long-running provisioning work begins.
    - When the operator is intentionally working inside one runnable bundle/workdir,
      operator-facing command examples in Penelope scripts and walkthrough helpers
      SHOULD prefer `./<script>` form over absolute paths; absolute paths remain appropriate
      for status, diagnostics, or file-location reporting.


penelope_update_loop_config_convergence:
  status: active
  rules:
    - write-config is an idempotent schema-convergence operation, not a reset.
    - Existing operator-owned active configs and secrets must not be overwritten by write-config.
    - Existing active config trees must not be repopulated with optional default users, shares, or secrets merely because those files are absent; seed active defaults only for a genuinely fresh tree.
    - Newly introduced known active config keys may be appended with defaults, with a visible generated comment block.
    - Package-owned examples may be overwritten on write-config/apply so they match the installed script version.
    - Structural pre-release model changes SHOULD NOT add compatibility migration code; move old local test config trees aside deliberately, then scaffold the current schema.
    - verify-config and apply must reject active placeholder secrets such as change-me before runtime changes.

